name: Gofile Downloader

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "scan"
        type: choice
        options:
          - "scan"
          - "download"

      file_selection:
        description: "Files to download — run 'scan' first, then enter: all  or  1,3  or  2"
        required: false
        default: "all"
        type: string

      upload_mode:
        description: "Upload mode (only used in download action)"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

permissions:
  contents: write

jobs:
  # ══════════════════════════════════════════════════
  #  JOB 1 — SCAN
  # ══════════════════════════════════════════════════
  scan:
    if: github.event.inputs.action == 'scan'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node + Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: mkdir -p grabbed

      - name: Read URLs from browser.txt
        run: |
          if [ ! -f browser.txt ]; then
            echo "ERROR: browser.txt not found!"
            exit 1
          fi
          grep -E "gofile\.io" browser.txt > grabbed/gofile_urls.txt || true
          if [ ! -s grabbed/gofile_urls.txt ]; then
            echo "ERROR: No gofile.io URLs found in browser.txt"
            exit 1
          fi
          echo "URLs to scan:"
          cat grabbed/gofile_urls.txt

      - name: Scan Gofile and list files
        run: |
          cat > gofile_scan.js << 'EOF'
          const fs = require('fs');
          const { chromium } = require('playwright');

          (async () => {
            const urls = fs.readFileSync('grabbed/gofile_urls.txt', 'utf8')
              .split('\n').map(l => l.trim()).filter(Boolean);

            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-blink-features=AutomationControlled']
            });

            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              locale: 'en-US',
              timezoneId: 'America/New_York',
              viewport: { width: 1280, height: 800 },
              extraHTTPHeaders: { 'Accept-Language': 'en-US,en;q=0.9' }
            });

            await context.addInitScript(() => {
              Object.defineProperty(navigator, 'webdriver', { get: () => false });
            });

            const allFiles = [];

            for (const pageUrl of urls) {
              console.log('\nScanning:', pageUrl);
              const page = await context.newPage();
              let accountToken = '';
              const fileLinks = [];

              page.on('response', async (response) => {
                try {
                  const url = response.url();
                  if (url.includes('api.gofile.io/accounts')) {
                    try {
                      const body = await response.json();
                      if (body?.data?.token) {
                        accountToken = body.data.token;
                        console.log('  [TOKEN]', accountToken.slice(0,8) + '...');
                      }
                    } catch (_) {}
                  }
                  if (url.includes('api.gofile.io/contents')) {
                    try {
                      const body = await response.json();
                      if (body?.status === 'ok') {
                        const walk = (node) => {
                          if (!node) return;
                          if (node.type === 'file' && node.link) {
                            fileLinks.push({
                              name: node.name,
                              url: node.link,
                              size: node.size || 0,
                              mimetype: node.mimetype || ''
                            });
                          }
                          const ch = node.children;
                          if (ch && typeof ch === 'object') Object.values(ch).forEach(walk);
                        };
                        walk(body.data);
                      }
                    } catch (_) {}
                  }
                } catch (_) {}
              });

              try {
                await page.goto(pageUrl, { waitUntil: 'networkidle', timeout: 90000 });
                await page.waitForTimeout(8000);
                try {
                  await page.waitForSelector('[class*="download"i],[id*="download"i]', { timeout: 12000 });
                } catch (_) {}
                await page.waitForTimeout(3000);
              } catch (e) {
                console.log('Page error:', e.message);
              }

              const cookies = await context.cookies();
              const cookieStr = cookies.map(c => `${c.name}=${c.value}`).join('; ');
              let cookieJar = '# Netscape HTTP Cookie File\n';
              for (const c of cookies) {
                const domain  = c.domain.startsWith('.') ? c.domain : '.' + c.domain;
                const path    = c.path || '/';
                const secure  = c.secure ? 'TRUE' : 'FALSE';
                const expires = c.expires && c.expires > 0 ? Math.floor(c.expires) : 0;
                cookieJar += `${domain}\tTRUE\t${path}\t${secure}\t${expires}\t${c.name}\t${c.value}\n`;
              }
              if (accountToken) {
                cookieJar += `.gofile.io\tTRUE\t/\tFALSE\t0\taccountToken\t${accountToken}\n`;
              }

              for (const fl of fileLinks) {
                allFiles.push({
                  name: fl.name, url: fl.url, size: fl.size,
                  mimetype: fl.mimetype, token: accountToken,
                  cookieStr, cookieJar, source: pageUrl
                });
              }
              await page.close();
            }

            await browser.close();

            if (allFiles.length === 0) {
              console.log('No files found!');
              process.exit(1);
            }

            fs.writeFileSync('grabbed/final_links.json', JSON.stringify(allFiles, null, 2));
            console.log(`\nFound ${allFiles.length} file(s).`);
          })();
          EOF

          node gofile_scan.js

      - name: Print file list
        run: |
          python3 << 'PYEOF'
          import json
          LIMIT = 2 * 1024 * 1024 * 1024  # 2 GB

          with open('grabbed/final_links.json') as f:
              items = json.load(f)

          def size_str(b):
              mb = b / (1024*1024)
              return f'{mb/1024:.2f} GB' if mb >= 1024 else f'{mb:.1f} MB'

          print('\n' + '='*60)
          print('  FILES FOUND')
          print('='*60)
          for i, item in enumerate(items, 1):
              sz = item.get('size', 0)
              note = '  ⚠ will be split (>2GB)' if sz > LIMIT else ''
              print(f'  [{i}] {item["name"]}  ({size_str(sz)}){note}')
          print('='*60)
          print(f'\n  Total: {len(items)} file(s)')
          print('\n  HOW TO DOWNLOAD:')
          print('  - All   → action: download  |  selection: all')
          print('  - Some  → action: download  |  selection: 1,3')
          print('='*60)
          PYEOF

      - name: Upload scan result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gofile-scan-result
          path: grabbed/final_links.json
          retention-days: 1

  # ══════════════════════════════════════════════════
  #  JOB 2 — DOWNLOAD
  # ══════════════════════════════════════════════════
  download:
    if: github.event.inputs.action == 'download'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl aria2 zip jq gh ffmpeg

      - name: Install Node + Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: mkdir -p downloads grabbed upload_ready

      - name: Download scan artifact
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          name: gofile-scan-result
          path: grabbed/
          workflow: ${{ github.workflow }}
          if_no_artifact_found: ignore

      - name: Re-scan if no artifact found
        run: |
          if [ -f grabbed/final_links.json ]; then
            echo "Using cached scan result."
            exit 0
          fi
          echo "No scan artifact — running fresh scan..."
          grep -E "gofile\.io" browser.txt > grabbed/gofile_urls.txt || true

          cat > gofile_scan.js << 'EOF'
          const fs = require('fs');
          const { chromium } = require('playwright');
          (async () => {
            const urls = fs.readFileSync('grabbed/gofile_urls.txt', 'utf8')
              .split('\n').map(l => l.trim()).filter(Boolean);
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox', '--disable-blink-features=AutomationControlled'] });
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              locale: 'en-US', timezoneId: 'America/New_York', viewport: { width: 1280, height: 800 },
              extraHTTPHeaders: { 'Accept-Language': 'en-US,en;q=0.9' }
            });
            await context.addInitScript(() => { Object.defineProperty(navigator, 'webdriver', { get: () => false }); });
            const allFiles = [];
            for (const pageUrl of urls) {
              console.log('Scanning:', pageUrl);
              const page = await context.newPage();
              let accountToken = '';
              const fileLinks = [];
              page.on('response', async (response) => {
                try {
                  const url = response.url();
                  if (url.includes('api.gofile.io/accounts')) {
                    try { const body = await response.json(); if (body?.data?.token) accountToken = body.data.token; } catch (_) {}
                  }
                  if (url.includes('api.gofile.io/contents')) {
                    try {
                      const body = await response.json();
                      if (body?.status === 'ok') {
                        const walk = (node) => {
                          if (!node) return;
                          if (node.type === 'file' && node.link) fileLinks.push({ name: node.name, url: node.link, size: node.size || 0, mimetype: node.mimetype || '' });
                          const ch = node.children;
                          if (ch && typeof ch === 'object') Object.values(ch).forEach(walk);
                        };
                        walk(body.data);
                      }
                    } catch (_) {}
                  }
                } catch (_) {}
              });
              try {
                await page.goto(pageUrl, { waitUntil: 'networkidle', timeout: 90000 });
                await page.waitForTimeout(8000);
                try { await page.waitForSelector('[class*="download"i]', { timeout: 12000 }); } catch (_) {}
                await page.waitForTimeout(3000);
              } catch (e) { console.log('Page error:', e.message); }
              const cookies = await context.cookies();
              const cookieStr = cookies.map(c => `${c.name}=${c.value}`).join('; ');
              let cookieJar = '# Netscape HTTP Cookie File\n';
              for (const c of cookies) {
                const domain = c.domain.startsWith('.') ? c.domain : '.' + c.domain;
                cookieJar += `${domain}\tTRUE\t${c.path||'/'}\t${c.secure?'TRUE':'FALSE'}\t${c.expires>0?Math.floor(c.expires):0}\t${c.name}\t${c.value}\n`;
              }
              if (accountToken) cookieJar += `.gofile.io\tTRUE\t/\tFALSE\t0\taccountToken\t${accountToken}\n`;
              for (const fl of fileLinks) allFiles.push({ name: fl.name, url: fl.url, size: fl.size, token: accountToken, cookieStr, cookieJar, source: pageUrl });
              await page.close();
            }
            await browser.close();
            if (allFiles.length === 0) { console.log('No files found!'); process.exit(1); }
            fs.writeFileSync('grabbed/final_links.json', JSON.stringify(allFiles, null, 2));
            console.log(`Found ${allFiles.length} file(s).`);
          })();
          EOF

          node gofile_scan.js

      - name: Download and split if needed
        run: |
          python3 << 'PYEOF'
          import json, os, re, subprocess, sys

          LIMIT_BYTES = 2 * 1024 * 1024 * 1024  # 2 GB
          # split target: 1.9 GB per part to have some margin
          PART_SIZE_BYTES = int(1.9 * 1024 * 1024 * 1024)

          selection = "${{ github.event.inputs.file_selection }}".strip().lower()

          with open('grabbed/final_links.json') as f:
              all_items = json.load(f)

          def size_str(b):
              mb = b / (1024*1024)
              return f'{mb/1024:.2f} GB' if mb >= 1024 else f'{mb:.1f} MB'

          # parse selection
          if selection in ('all', '', '*'):
              selected = list(range(len(all_items)))
          else:
              selected = []
              for part in selection.split(','):
                  part = part.strip()
                  if part.isdigit():
                      idx = int(part) - 1
                      if 0 <= idx < len(all_items):
                          selected.append(idx)
                      else:
                          print(f'WARNING: [{part}] out of range, skipping.')

          if not selected:
              print('No valid files selected!')
              sys.exit(1)

          items = [all_items[i] for i in selected]

          print('\nFiles to process:')
          for item in items:
              sz = item.get('size', 0)
              note = ' → will be split' if sz > LIMIT_BYTES else ''
              print(f'  - {item["name"]}  ({size_str(sz)}){note}')

          os.makedirs('downloads', exist_ok=True)
          os.makedirs('upload_ready', exist_ok=True)

          def run_download(url, token, cookieJar, out_path, safe_name):
              jar_path = f'/tmp/cookies_{safe_name}.txt'
              with open(jar_path, 'w') as jf:
                  jf.write(cookieJar)

              cmd = [
                  'aria2c',
                  '-x', '16', '-s', '16', '-k', '1M', '-c',
                  '--summary-interval=30',
                  '--download-result=hide',
                  '--console-log-level=warn',
                  f'--load-cookies={jar_path}',
                  '--header=User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
                  '--header=Accept: video/mp4,video/*;q=0.9,*/*;q=0.8',
                  '--header=Referer: https://gofile.io/',
                  '--dir=downloads',
                  f'--out={safe_name}',
                  url
              ]
              if token:
                  cmd.insert(-1, f'--header=Authorization: Bearer {token}')

              result = subprocess.run(cmd)

              if result.returncode != 0:
                  print('  [CURL FALLBACK]')
                  curl_cmd = [
                      'curl', '-L', '--retry', '5', '--connect-timeout', '30',
                      '-A', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)',
                      '-H', 'Accept: video/mp4,video/*;q=0.9,*/*;q=0.8',
                      '-H', 'Referer: https://gofile.io/',
                      '--cookie', jar_path,
                      '-o', out_path,
                  ]
                  if token:
                      curl_cmd += ['-H', f'Authorization: Bearer {token}']
                  curl_cmd.append(url)
                  subprocess.run(curl_cmd)

          def verify_file(path):
              if not os.path.exists(path):
                  return False, 'not found'
              with open(path, 'rb') as f:
                  header = f.read(12)
              if header[:5] in (b'<!DOC', b'<html', b'<?xml'):
                  return False, 'HTML (auth failed)'
              return True, 'ok'

          def split_video(input_path, base_name, part_size):
              """Split video into parts using ffmpeg segment muxer — no re-encode."""
              print(f'\n  Splitting into ~{size_str(part_size)} parts (no re-encode)...')

              # get total duration
              probe = subprocess.run(
                  ['ffprobe', '-v', 'quiet', '-print_format', 'json',
                   '-show_format', input_path],
                  capture_output=True, text=True
              )
              duration = 0
              try:
                  info = json.loads(probe.stdout)
                  duration = float(info['format']['duration'])
                  file_size = int(info['format']['size'])
                  print(f'  Duration: {duration:.1f}s  |  Size: {size_str(file_size)}')
              except Exception as e:
                  print(f'  ffprobe error: {e}')
                  # fallback: estimate from file size and 10 Mbps
                  file_size = os.path.getsize(input_path)
                  duration = (file_size * 8) / (10 * 1024 * 1024)

              # calculate segment duration
              file_size = os.path.getsize(input_path)
              n_parts = -(-file_size // part_size)  # ceiling division
              seg_duration = duration / n_parts
              print(f'  Parts: {n_parts}  |  ~{seg_duration:.1f}s per part')

              ext = os.path.splitext(input_path)[1] or '.mp4'
              pattern = f'upload_ready/{base_name}_part%03d{ext}'

              cmd = [
                  'ffmpeg', '-i', input_path,
                  '-c', 'copy',           # no re-encode
                  '-map', '0',
                  '-segment_time', str(int(seg_duration)),
                  '-f', 'segment',
                  '-reset_timestamps', '1',
                  '-avoid_negative_ts', 'make_zero',
                  pattern
              ]
              result = subprocess.run(cmd)
              if result.returncode != 0:
                  print('  ffmpeg split failed!')
                  return False

              parts = sorted([
                  f for f in os.listdir('upload_ready')
                  if f.startswith(base_name + '_part')
              ])
              print(f'\n  Split result:')
              for p in parts:
                  sz = os.path.getsize(f'upload_ready/{p}')
                  print(f'    {p}  ({size_str(sz)})')
              return True

          # ── main loop ────────────────────────────────────────────
          for i, item in enumerate(items, 1):
              name      = item['name']
              url       = item['url']
              token     = item.get('token', '')
              cookieJar = item.get('cookieJar', '')
              declared_size = item.get('size', 0)

              safe = re.sub(r'[^a-zA-Z0-9 ._-]', '_', name)
              safe = re.sub(r'[\s_]+', '_', safe).strip('_')[:120] or f'file_{i}'
              base_name = os.path.splitext(safe)[0]
              out_path  = f'downloads/{safe}'

              print(f'\n{"="*55}')
              print(f'  [{i}/{len(items)}] {name}')
              print(f'  Size: {size_str(declared_size)}')
              print('='*55)

              # download
              run_download(url, token, cookieJar, out_path, safe)

              ok, reason = verify_file(out_path)
              if not ok:
                  print(f'  ERROR: File invalid — {reason}')
                  continue

              actual_size = os.path.getsize(out_path)
              print(f'  Downloaded: {size_str(actual_size)}  ✓')

              if actual_size > LIMIT_BYTES:
                  # split with ffmpeg
                  ok = split_video(out_path, base_name, PART_SIZE_BYTES)
                  if not ok:
                      print('  Falling back to raw copy to upload_ready...')
                      import shutil
                      shutil.copy(out_path, f'upload_ready/{safe}')
              else:
                  # small enough — copy directly to upload_ready
                  import shutil
                  shutil.copy(out_path, f'upload_ready/{safe}')
                  print(f'  → upload_ready/{safe}')

          print('\n\n' + '='*55)
          print('  UPLOAD READY FILES')
          print('='*55)
          total = 0
          for fn in sorted(os.listdir('upload_ready')):
              sz = os.path.getsize(f'upload_ready/{fn}')
              total += sz
              print(f'  {fn}  ({size_str(sz)})')
          print(f'\n  Total: {size_str(total)}')
          print('='*55)
          PYEOF

      - name: Create ZIP
        if: github.event.inputs.upload_mode == 'zip'
        run: |
          ts=$(date +"%Y%m%d_%H%M%S")
          zip -r -P "${{ secrets.ZIP_PASSWORD }}" "gofile_media_${ts}.zip" upload_ready/

      - name: Upload Release (direct)
        if: github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gofile-${{ github.run_number }}
          name: "Gofile Download #${{ github.run_number }}"
          body: |
            Downloaded from Gofile links in `browser.txt`
            Selection: `${{ github.event.inputs.file_selection }}`
            Run: #${{ github.run_number }}
          files: upload_ready/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release (zip)
        if: github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gofile-${{ github.run_number }}
          name: "Gofile Download #${{ github.run_number }}"
          body: |
            Downloaded from Gofile links in `browser.txt`
            Selection: `${{ github.event.inputs.file_selection }}`
            Run: #${{ github.run_number }}
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
