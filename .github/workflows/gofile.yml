name: Gofile Downloader

on:
  workflow_dispatch:
    inputs:
      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  gofile-download:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl aria2 zip jq gh

      - name: Install Node + Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: |
          mkdir -p downloads grabbed

      - name: Read URLs from browser.txt
        run: |
          if [ ! -f browser.txt ]; then
            echo "ERROR: browser.txt not found in repository root!"
            exit 1
          fi
          echo "=== All URLs in browser.txt ==="
          cat browser.txt
          grep -E "gofile\.io" browser.txt > grabbed/gofile_urls.txt || true
          echo "=== Gofile URLs ==="
          cat grabbed/gofile_urls.txt || echo "(none)"

      - name: Browse Gofile and extract download links
        run: |
          cat > gofile_grab.js << 'EOF'
          const fs = require('fs');
          const { chromium } = require('playwright');

          (async () => {

            const urlsFile = 'grabbed/gofile_urls.txt';
            if (!fs.existsSync(urlsFile)) {
              console.log('No Gofile URLs file found.');
              process.exit(1);
            }

            const urls = fs.readFileSync(urlsFile, 'utf8')
              .split('\n').map(l => l.trim()).filter(Boolean);

            if (urls.length === 0) {
              console.log('No gofile.io links found in browser.txt');
              process.exit(1);
            }

            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-blink-features=AutomationControlled']
            });

            const context = await browser.newContext({
              userAgent:
                'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
                'AppleWebKit/537.36 (KHTML, like Gecko) ' +
                'Chrome/124.0.0.0 Safari/537.36',
              locale: 'en-US',
              timezoneId: 'America/New_York',
              viewport: { width: 1280, height: 800 },
              extraHTTPHeaders: { 'Accept-Language': 'en-US,en;q=0.9' }
            });

            await context.addInitScript(() => {
              Object.defineProperty(navigator, 'webdriver', { get: () => false });
            });

            const results = [];

            for (const pageUrl of urls) {
              console.log('\n========================================');
              console.log('OPENING:', pageUrl);
              console.log('========================================');

              const page = await context.newPage();

              let accountToken = '';
              const fileLinks = [];

              page.on('response', async (response) => {
                try {
                  const url = response.url();

                  if (url.includes('api.gofile.io/accounts')) {
                    try {
                      const body = await response.json();
                      if (body?.data?.token) {
                        accountToken = body.data.token;
                        console.log('  [TOKEN] captured:', accountToken.slice(0, 8) + '...');
                      }
                    } catch (_) {}
                  }

                  if (url.includes('api.gofile.io/contents')) {
                    try {
                      const body = await response.json();
                      if (body?.status === 'ok') {
                        const walk = (node) => {
                          if (!node) return;
                          if (node.type === 'file' && node.link) {
                            fileLinks.push({ name: node.name, url: node.link });
                            console.log('  [FILE]', node.name);
                          }
                          const ch = node.children;
                          if (ch && typeof ch === 'object') Object.values(ch).forEach(walk);
                        };
                        walk(body.data);
                      }
                    } catch (_) {}
                  }

                } catch (_) {}
              });

              try {
                await page.goto(pageUrl, { waitUntil: 'networkidle', timeout: 90000 });
                await page.waitForTimeout(8000);
                try {
                  await page.waitForSelector(
                    '[class*="download"i], [id*="download"i], a[href*="/download/"]',
                    { timeout: 12000 }
                  );
                } catch (_) {}
                await page.waitForTimeout(3000);
              } catch (e) {
                console.log('  [PAGE ERROR]', e.message);
              }

              // fallback: call API from inside page context
              if (fileLinks.length === 0) {
                console.log('  [FALLBACK] Calling API from inside page context...');
                const m = pageUrl.match(/gofile\.io\/d\/([A-Za-z0-9]+)/);
                if (m) {
                  try {
                    const apiResult = await page.evaluate(async ({ contentId, token }) => {
                      let useToken = token;
                      if (!useToken) {
                        const accResp = await fetch('https://api.gofile.io/accounts', {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json' }
                        });
                        const accData = await accResp.json();
                        useToken = accData?.data?.token || '';
                      }
                      const r = await fetch(
                        `https://api.gofile.io/contents/${contentId}?wt=4fd6sg89d7s6&cache=true`,
                        { headers: { 'Authorization': `Bearer ${useToken}` } }
                      );
                      return { data: await r.json(), token: useToken };
                    }, { contentId: m[1], token: accountToken });

                    if (apiResult?.token) accountToken = apiResult.token;
                    const body = apiResult?.data;
                    if (body?.status === 'ok') {
                      const walk = (node) => {
                        if (!node) return;
                        if (node.type === 'file' && node.link) {
                          fileLinks.push({ name: node.name, url: node.link });
                          console.log('  [FILE via fallback]', node.name);
                        }
                        const ch = node.children;
                        if (ch && typeof ch === 'object') Object.values(ch).forEach(walk);
                      };
                      walk(body.data);
                    }
                  } catch (e) {
                    console.log('  [FALLBACK ERROR]', e.message);
                  }
                }
              }

              const cookies = await context.cookies();
              const cookieStr = cookies.map(c => `${c.name}=${c.value}`).join('; ');

              for (const fl of fileLinks) {
                results.push({ name: fl.name, url: fl.url, token: accountToken, cookie: cookieStr });
              }

              await page.close();
            }

            await browser.close();

            if (results.length === 0) {
              console.log('\n[!] No downloadable files found!');
              process.exit(1);
            }

            // Write as JSON - no delimiter issues
            fs.writeFileSync('grabbed/final_links.json', JSON.stringify(results, null, 2));
            console.log(`\n[+] Saved ${results.length} file(s) to grabbed/final_links.json`);

          })();
          EOF

          node gofile_grab.js

      - name: Show grabbed links
        run: |
          echo "=== Final links ==="
          python3 -c "
          import json
          with open('grabbed/final_links.json') as f:
              items = json.load(f)
          for i, item in enumerate(items, 1):
              print(f'{i}. {item[\"name\"]} -> {item[\"url\"][:80]}...')
          "

      - name: Download files
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess, sys

          with open('grabbed/final_links.json') as f:
              items = json.load(f)

          if not items:
              print('No files to download.')
              sys.exit(1)

          os.makedirs('downloads', exist_ok=True)

          for i, item in enumerate(items, 1):
              name   = item['name']
              url    = item['url']
              token  = item.get('token', '')
              cookie = item.get('cookie', '')

              # sanitize filename
              import re
              safe = re.sub(r'[^a-zA-Z0-9 ._-]', '_', name)
              safe = re.sub(r'[\s_]+', '_', safe).strip('_')[:120]
              if not safe:
                  safe = f'file_{i}'

              out_path = f'downloads/{safe}'

              print(f'\n{"="*50}')
              print(f'FILE    : {name}')
              print(f'SAVE AS : {out_path}')
              print(f'URL     : {url[:80]}...')
              print('='*50)

              headers = [
                  '--header=User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
                  '--header=Accept: */*',
                  '--header=Referer: https://gofile.io/',
              ]
              if token:
                  headers.append(f'--header=Authorization: Bearer {token}')
              if cookie:
                  headers.append(f'--header=Cookie: {cookie}')

              cmd = [
                  'aria2c',
                  '-x', '16', '-s', '16', '-k', '1M',
                  '-c',
                  '--summary-interval=0',
                  '--download-result=hide',
                  '--console-log-level=warn',
                  *headers,
                  '--dir=downloads',
                  f'--out={safe}',
                  url
              ]

              result = subprocess.run(cmd)

              if result.returncode != 0:
                  print('[CURL FALLBACK]')
                  curl_cmd = [
                      'curl', '-L', '--retry', '5', '--connect-timeout', '30',
                      '-A', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)',
                      '-H', 'Referer: https://gofile.io/',
                      '-o', out_path,
                  ]
                  if token:
                      curl_cmd += ['-H', f'Authorization: Bearer {token}']
                  if cookie:
                      curl_cmd += ['-H', f'Cookie: {cookie}']
                  curl_cmd.append(url)
                  subprocess.run(curl_cmd)

          print('\n=== Downloaded files ===')
          for f in os.listdir('downloads'):
              size = os.path.getsize(f'downloads/{f}')
              print(f'  {f}  ({size/1024/1024:.1f} MB)')
          PYEOF

      - name: Create ZIP
        if: github.event.inputs.upload_mode == 'zip'
        run: |
          ts=$(date +"%Y%m%d_%H%M%S")
          zip -r -P "${{ secrets.ZIP_PASSWORD }}" "gofile_media_${ts}.zip" downloads/

      - name: Delete old releases
        if: github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tags=$(gh release list --limit 100 --json tagName -q '.[].tagName' 2>/dev/null || true)
          for tag in $tags; do
            echo "Deleting: $tag"
            gh release delete "$tag" --yes 2>/dev/null || true
            git push --delete origin "$tag" 2>/dev/null || true
          done

      - name: Upload Release (direct)
        if: github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gofile-${{ github.run_number }}
          name: "Gofile Download #${{ github.run_number }}"
          body: |
            Downloaded from Gofile links in `browser.txt`
            Run: #${{ github.run_number }}
          files: downloads/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release (zip)
        if: github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gofile-${{ github.run_number }}
          name: "Gofile Download #${{ github.run_number }}"
          body: |
            Downloaded from Gofile links in `browser.txt`
            Run: #${{ github.run_number }}
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
