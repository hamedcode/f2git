name: 6 - 9xBuddy Downloader

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "لینک فایل برای دانلود"
        required: true

      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip curl jq gh
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: mkdir -p downloads grabbed

      - name: Run Playwright
        run: node buddy_dl.js "${{ github.event.inputs.source_url }}"

      - name: Download
        run: python3 download.py

      - name: Show results
        run: |
          echo "=== downloads/ ===" && ls -lh downloads/ || echo "(empty)"

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-grabbed
          path: grabbed/

      - name: Create ZIP
        if: github.event.inputs.upload_mode == 'zip'
        run: |
          ts=$(date +"%Y%m%d_%H%M%S")
          zip -r -P "${{ secrets.ZIP_PASSWORD }}" "buddy_media_${ts}.zip" downloads/

      - name: Delete old releases
        if: github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --limit 100 | awk '{print $1}')
          for tag in $releases; do gh release delete "$tag" -y || true; done

      - name: Upload Direct Release
        if: github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "downloads/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP Release
        if: github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
