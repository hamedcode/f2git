name: 6 - 9xBuddy Downloader

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "لینک فایل برای دانلود"
        required: true

      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip curl aria2 jq gh
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: |
          mkdir -p downloads
          mkdir -p grabbed

      - name: Create Playwright script
        run: |
          cat > buddy_dl.js << 'EOF'

          const fs   = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const SOURCE_URL = process.argv[2];
          if (!SOURCE_URL) { console.error('No source URL'); process.exit(1); }

          const PROCESS_URL = 'https://9xbuddy.site/process?url=' + encodeURIComponent(SOURCE_URL);

          function sanitize(str) {
            return (str || 'video')
              .replace(/[^a-zA-Z0-9 ._-]/g, '_')
              .replace(/[_ ]+/g, '_')
              .replace(/^_|_$/g, '')
              .slice(0, 80) || 'video';
          }

          function isVideoFile(url) {
            return /\.(mp4|m3u8|mkv|avi|mov|webm|vid)(\?|$)/i.test(url.split('?')[0]);
          }

          (async () => {

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent:
                'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
                'AppleWebKit/537.36 (KHTML, like Gecko) ' +
                'Chrome/122.0.0.0 Safari/537.36',
              acceptDownloads: true
            });

            const page = await context.newPage();

            // ── intercept همه responses از ab.9xbud.com ──────────────────
            // وقتی صفحه خودش /token و /extract رو صدا می‌زنه،
            // ما body رو می‌خونیم — بدون اینکه خودمون request بزنیم
            let tokenData   = null;
            let extractData = null;
            const videoUrls = [];

            page.on('response', async (resp) => {
              try {
                const u  = resp.url();
                const ct = resp.headers()['content-type'] || '';
                const st = resp.status();

                // /token response
                if (u.includes('9xbud.com/token')) {
                  const text = await resp.text();
                  console.log(`[TOKEN] status=${st} body=${text.slice(0, 300)}`);
                  try { tokenData = JSON.parse(text); } catch (e) {}
                  return;
                }

                // /extract response
                if (u.includes('9xbud.com/extract')) {
                  const text = await resp.text();
                  console.log(`[EXTRACT] status=${st} body=${text.slice(0, 500)}`);
                  try { extractData = JSON.parse(text); } catch (e) {}
                  fs.writeFileSync('grabbed/extract_response.json', text);

                  // لینک‌های ویدیو رو از body استخراج کن
                  const matches = text.match(/https?:\/\/[^"\\]+\.(mp4|m3u8|mkv|webm|mov|vid)(\?[^"\\]*)?/gi) || [];
                  for (const m of matches) {
                    const clean = m.replace(/\\u0026/g, '&').replace(/\\\//g, '/');
                    if (!videoUrls.includes(clean)) {
                      console.log('[EXTRACT VIDEO URL]', clean);
                      videoUrls.push(clean);
                    }
                  }
                  return;
                }

                // لینک مستقیم ویدیو
                if (
                  st === 200 &&
                  (isVideoFile(u) || ct.startsWith('video/')) &&
                  !u.includes('9xbuddy')
                ) {
                  if (!videoUrls.includes(u)) {
                    console.log('[VIDEO RESPONSE]', u);
                    videoUrls.push(u);
                  }
                }

              } catch (e) {}
            });

            // popup listener
            context.on('page', async (popup) => {
              try {
                await popup.waitForLoadState('domcontentloaded', { timeout: 10000 });
                const u = popup.url();
                console.log('[POPUP]', u);
                if (isVideoFile(u) && !videoUrls.includes(u)) videoUrls.push(u);
                popup.on('response', async (resp) => {
                  const pu = resp.url();
                  const ct = resp.headers()['content-type'] || '';
                  if ((isVideoFile(pu) || ct.startsWith('video/')) && !videoUrls.includes(pu)) {
                    console.log('[POPUP VIDEO]', pu);
                    videoUrls.push(pu);
                  }
                  if (pu.includes('9xbud.com/extract')) {
                    const text = await resp.text().catch(() => '');
                    const matches = text.match(/https?:\/\/[^"\\]+\.(mp4|m3u8|mkv|webm)/gi) || [];
                    matches.forEach(m => { if (!videoUrls.includes(m)) videoUrls.push(m); });
                  }
                });
              } catch (e) {}
            });

            // ── Step 1: صفحه رو باز کن ───────────────────────────────────
            // صفحه خودش /token می‌گیره و لینک‌ها رو نمایش می‌ده
            console.log('Opening:', PROCESS_URL);
            await page.goto(PROCESS_URL, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(4000);

            const title = sanitize((await page.title()).trim());
            console.log('Title:', title);
            console.log('Video URLs so far:', videoUrls.length);

            // ── Step 2: کلیک روی Extract/Download buttons ────────────────
            // صفحه برای هر سرور جداگانه /extract صدا می‌زنه — وقتی کلیک می‌کنیم
            // ما response رو از intercept می‌گیریم
            console.log('\n=== Clicking Extract/Download buttons ===');

            const buttons = await page.$$('a, button');

            for (const btn of buttons) {
              if (videoUrls.length > 0) break;

              try {
                const txt  = (await btn.innerText()).trim().toLowerCase();
                const href = (await btn.getAttribute('href') || '');

                if (/app|software|extension|program|home|support/.test(txt)) continue;
                if (
                  !txt.includes('download') &&
                  !txt.includes('extract') &&
                  !txt.includes('get link') &&
                  !href.toLowerCase().includes('download')
                ) continue;

                // اگه href مستقیم به ویدیو اشاره داره
                if (isVideoFile(href) && !href.includes('9xbuddy')) {
                  console.log('Direct href:', href);
                  if (!videoUrls.includes(href)) videoUrls.push(href);
                  break;
                }

                console.log('Clicking:', txt || href.slice(0, 60));

                // کلیک و صبر برای /extract response
                const extractPromise = page.waitForResponse(
                  r => r.url().includes('9xbud.com/extract'),
                  { timeout: 20000 }
                ).catch(() => null);

                await btn.click().catch(() => {});

                const extractResp = await extractPromise;
                if (extractResp) {
                  console.log('[EXTRACT RESPONSE caught after click]', extractResp.status());
                }

                // صبر اضافه برای DOM update
                await page.waitForTimeout(5000);

                if (videoUrls.length > 0) break;

              } catch (e) {}
            }

            console.log('\nTotal video URLs found:', videoUrls.length);
            videoUrls.forEach((u, i) => console.log(` [${i+1}] ${u}`));

            fs.writeFileSync('grabbed/result.json', JSON.stringify({ title, urls: videoUrls }, null, 2));

            if (videoUrls.length === 0) {
              await browser.close();
              console.error('No video URLs found!');
              process.exit(1);
            }

            // ── Step 3: دانلود با همان browser session ───────────────────
            let downloaded = false;

            for (const url of videoUrls) {
              console.log('\nDownloading:', url);

              const extM = url.split('?')[0].match(/\.(mp4|m3u8|mkv|webm|mov|vid)$/i);
              let ext = extM ? extM[1].toLowerCase() : 'mp4';
              if (ext === 'vid') ext = 'mp4';

              if (ext === 'm3u8') {
                const cookies = await context.cookies();
                fs.writeFileSync('grabbed/hls_url.txt', url);
                fs.writeFileSync('grabbed/hls_title.txt', title);
                fs.writeFileSync('grabbed/hls_cookies.txt', cookies.map(c => `${c.name}=${c.value}`).join('; '));
                console.log('HLS saved for ffmpeg');
                downloaded = true;
                break;
              }

              try {
                const resp = await page.request.get(url, {
                  headers: { 'Referer': 'https://9xbuddy.site/', 'Accept': '*/*' },
                  timeout: 0
                });
                console.log('Status:', resp.status());
                if (!resp.ok()) { console.log('Non-200, skip'); continue; }
                const body = await resp.body();
                console.log('Size:', (body.length / 1024 / 1024).toFixed(2), 'MB');
                if (body.length < 1_048_576) { console.log('Too small, skip'); continue; }
                const dest = path.join('downloads', `${title}.${ext}`);
                fs.writeFileSync(dest, body);
                console.log('Saved:', dest);
                downloaded = true;
                break;
              } catch (e) {
                console.log('Error:', e.message);
              }
            }

            await browser.close();
            if (!downloaded) { console.error('Download failed!'); process.exit(1); }

          })();

          EOF

      - name: Run Playwright
        run: node buddy_dl.js "${{ github.event.inputs.source_url }}"

      - name: Download HLS if needed
        run: |
          if [ ! -f grabbed/hls_url.txt ]; then echo "No HLS"; exit 0; fi
          url=$(cat grabbed/hls_url.txt)
          title=$(cat grabbed/hls_title.txt)
          cookies=$(cat grabbed/hls_cookies.txt)
          ffmpeg -y -user_agent "Mozilla/5.0" \
            -headers "Cookie: ${cookies}" \
            -i "$url" -c copy "downloads/${title}.mp4"

      - name: Show results
        run: |
          echo "=== downloads/ ===" && ls -lh downloads/ || echo "(empty)"
          echo "=== result.json ===" && cat grabbed/result.json 2>/dev/null || true
          echo "=== extract_response ===" && cat grabbed/extract_response.json 2>/dev/null || true

      - name: Create ZIP
        if: github.event.inputs.upload_mode == 'zip'
        run: |
          ts=$(date +"%Y%m%d_%H%M%S")
          zip -r -P "${{ secrets.ZIP_PASSWORD }}" "buddy_media_${ts}.zip" downloads/

      - name: Delete old releases
        if: github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --limit 100 | awk '{print $1}')
          for tag in $releases; do gh release delete "$tag" -y || true; done

      - name: Upload Direct Release
        if: github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "downloads/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP Release
        if: github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
