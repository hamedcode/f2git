name: 6 - 9xBuddy Downloader

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "لینک مستقیم فایل (مثلاً https://miixdrop.net/f/7k38ql4zid1vkr9)"
        required: true

      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip curl aria2 jq gh
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: |
          mkdir -p downloads
          mkdir -p grabbed

      - name: Create Playwright script
        run: |
          cat > buddy_dl.js << 'EOF'

          const fs   = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const SOURCE_URL = process.argv[2];
          if (!SOURCE_URL) { console.error('No source URL'); process.exit(1); }

          // 9xbuddy process page URL
          const BUDDY_URL = 'https://9xbuddy.site/process?url=' + encodeURIComponent(SOURCE_URL);

          function sanitize(str) {
            return (str || 'video')
              .replace(/[^a-zA-Z0-9 ._-]/g, '_')
              .replace(/[_ ]+/g, '_')
              .replace(/^_|_$/g, '')
              .slice(0, 80) || 'video';
          }

          const JUNK_DOMAINS = [
            '123sudo.com','offmp3.com','savegif.com',
            '9xbuddy.site','9xbuddy.org','9xbuddy.app',
            'google.com','facebook.com','twitter.com','youtube.com'
          ];
          function isJunk(url) {
            try { const h = new URL(url).hostname; return JUNK_DOMAINS.some(d => h.includes(d)); }
            catch { return true; }
          }
          function isVideoFile(url) {
            return /\.(mp4|m3u8|mkv|avi|mov|webm|vid)(\?|$)/i.test(url.split('?')[0]);
          }

          async function tryDownload(page, context, url, title) {
            const extMatch = url.split('?')[0].match(/\.(mp4|m3u8|mkv|avi|mov|webm|vid)$/i);
            let ext = extMatch ? extMatch[1].toLowerCase() : 'mp4';
            if (ext === 'vid') ext = 'mp4';

            if (ext === 'm3u8') {
              const cookies = await context.cookies();
              fs.writeFileSync('grabbed/hls_url.txt',     url);
              fs.writeFileSync('grabbed/hls_title.txt',   title);
              fs.writeFileSync('grabbed/hls_cookies.txt', cookies.map(c=>`${c.name}=${c.value}`).join('; '));
              console.log('HLS URL saved for ffmpeg');
              return 'hls';
            }

            const dest = path.join('downloads', `${title}.${ext}`);

            try {
              console.log('  Requesting with browser session...');
              const resp = await page.request.get(url, {
                headers: {
                  'Referer':        'https://9xbuddy.site/',
                  'Origin':         'https://9xbuddy.site',
                  'Accept':         '*/*',
                  'Accept-Language':'en-US,en;q=0.9',
                },
                timeout: 0
              });

              console.log('  HTTP Status:', resp.status());

              if (!resp.ok()) return false;

              const body = await resp.body();
              console.log('  Size:', (body.length / 1024 / 1024).toFixed(2), 'MB');

              if (body.length < 1_048_576) {
                console.log('  Too small — skip');
                return false;
              }

              fs.writeFileSync(dest, body);
              console.log('  SAVED ->', dest);
              return true;

            } catch (err) {
              console.log('  ERROR:', err.message);
              return false;
            }
          }

          (async () => {

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent:
                'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
                'AppleWebKit/537.36 (KHTML, like Gecko) ' +
                'Chrome/122.0.0.0 Safari/537.36',
              acceptDownloads: true
            });

            const page = await context.newPage();

            // ── STEP 1: go to 9xbuddy homepage, paste URL, submit ────────
            console.log('=== Step 1: Opening 9xbuddy ===');
            await page.goto('https://9xbuddy.site/', {
              waitUntil: 'networkidle',
              timeout: 30000
            });

            // find the input box and type the source URL
            console.log('Entering source URL:', SOURCE_URL);
            try {
              // 9xbuddy has an input with placeholder like "Paste link here"
              const input = await page.waitForSelector(
                'input[type="text"], input[type="url"], input[placeholder*="link"], input[placeholder*="url"], input[placeholder*="URL"], input[placeholder*="paste"]',
                { timeout: 10000 }
              );
              await input.fill(SOURCE_URL);
              console.log('URL entered in input box');

              // submit: press Enter or click the download/go button
              await Promise.race([
                page.keyboard.press('Enter'),
                page.click('button[type="submit"], button:has-text("Download"), button:has-text("Go")').catch(() => {})
              ]);

            } catch (e) {
              // fallback: navigate directly to process URL
              console.log('Input not found, navigating directly to process URL');
              console.log('Process URL:', BUDDY_URL);
            }

            // ── STEP 2: wait on the process page for links to appear ─────
            console.log('\n=== Step 2: Waiting for process page ===');
            await page.waitForURL('**/process**', { timeout: 15000 }).catch(async () => {
              // if page didn't navigate to /process, go there directly
              console.log('Navigating directly to:', BUDDY_URL);
              await page.goto(BUDDY_URL, { waitUntil: 'networkidle', timeout: 60000 });
            });

            // wait for download links to render (JS-heavy page)
            console.log('Waiting for download links to render...');
            try {
              await page.waitForSelector(
                'a[href*="download"], a[href*=".mp4"], a[href*=".m3u8"], button:has-text("Download")',
                { timeout: 30000 }
              );
            } catch (e) {
              console.log('Selector timeout, continuing anyway...');
            }
            await page.waitForTimeout(3000);

            const rawTitle = (await page.title()).trim();
            const title    = sanitize(rawTitle);
            console.log('PAGE TITLE:', rawTitle, '->', title);

            // ── STEP 3: collect DOM video links and try immediately ───────
            console.log('\n=== Step 3: Checking DOM links ===');

            const domVideoUrls = (await page.$$eval('a', els => els.map(a => a.href || '')))
              .filter(h => isVideoFile(h) && !isJunk(h));

            console.log('DOM video links:', domVideoUrls.length);

            for (const url of domVideoUrls) {
              console.log('\nTRYING:', url);
              const result = await tryDownload(page, context, url, title);
              if (result) {
                await browser.close();
                process.exit(0);
              }
            }

            // ── STEP 4: click each download button → try resolved URL ─────
            console.log('\n=== Step 4: Clicking download buttons ===');

            const buttons = await page.$$('a, button');

            for (const btn of buttons) {
              try {
                const txt  = (await btn.innerText()).trim().toLowerCase();
                const href = (await btn.getAttribute('href') || '').toLowerCase();

                // skip junk buttons
                if (/app|software|extension|program/.test(txt)) continue;
                if (!txt.includes('download') && !href.includes('download')) continue;

                const fullHref = (await btn.getAttribute('href')) || '';

                // if already a resolved video link
                if (fullHref.startsWith('http') && isVideoFile(fullHref) && !isJunk(fullHref)) {
                  console.log('\nDirect href button:', fullHref);
                  const result = await tryDownload(page, context, fullHref, title);
                  if (result) { await browser.close(); process.exit(0); }
                  continue;
                }

                console.log('\nClicking button:', txt || href);

                // click (Cmd+click to open new tab, preventing navigation away)
                const [newPage] = await Promise.all([
                  context.waitForEvent('page', { timeout: 5000 }).catch(() => null),
                  btn.click({ modifiers: ['Meta'] }).catch(async () => {
                    await btn.click().catch(() => {});
                  })
                ]);

                // wait for anti-bot spinner (9xbuddy: ~3–8s, we give 12s)
                await page.waitForTimeout(12000);

                // close any new tab that opened (likely software download page)
                if (newPage) {
                  const newUrl = newPage.url();
                  if (newUrl && newUrl !== 'about:blank' && isVideoFile(newUrl) && !isJunk(newUrl)) {
                    console.log('New tab has video URL:', newUrl);
                    const result = await tryDownload(page, context, newUrl, title);
                    if (result) { await browser.close(); process.exit(0); }
                  }
                  await newPage.close().catch(() => {});
                }

                // check if button href was updated after click
                const resolvedHref = (await btn.getAttribute('href').catch(() => '')) || '';
                if (resolvedHref.startsWith('http') && isVideoFile(resolvedHref) && !isJunk(resolvedHref)) {
                  console.log('Resolved href:', resolvedHref);
                  const result = await tryDownload(page, context, resolvedHref, title);
                  if (result) { await browser.close(); process.exit(0); }
                }

              } catch (e) {}
            }

            await browser.close();
            console.error('\nAll attempts failed!');
            process.exit(1);

          })();

          EOF

      - name: Run Playwright
        run: |
          node buddy_dl.js "${{ github.event.inputs.source_url }}"

      - name: Download HLS if needed
        run: |
          if [ -f grabbed/hls_url.txt ]; then
            url=$(cat grabbed/hls_url.txt)
            title=$(cat grabbed/hls_title.txt)
            cookies=$(cat grabbed/hls_cookies.txt)
            echo "HLS: $url"
            ffmpeg -y \
              -user_agent "Mozilla/5.0" \
              -headers "Cookie: ${cookies}" \
              -i "$url" \
              -c copy \
              "downloads/${title}.mp4"
          else
            echo "No HLS"
          fi

      - name: Show results
        run: |
          echo "=== downloads/ ==="
          ls -lh downloads/ || echo "(empty)"

      - name: Create ZIP
        if: github.event.inputs.upload_mode == 'zip'
        run: |
          ts=$(date +"%Y%m%d_%H%M%S")
          zip -r -P "${{ secrets.ZIP_PASSWORD }}" "buddy_media_${ts}.zip" downloads/

      - name: Delete old releases
        if: github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --limit 100 | awk '{print $1}')
          for tag in $releases; do gh release delete "$tag" -y || true; done

      - name: Upload Direct Release
        if: github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "downloads/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP Release
        if: github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
