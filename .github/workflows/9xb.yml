name: 6 - 9xBuddy Downloader

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "لینک فایل برای دانلود"
        required: true

      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip curl aria2 jq gh
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: mkdir -p downloads grabbed

      - name: Create Playwright script
        run: |
          cat > buddy_dl.js << 'EOF'

          const fs   = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const SOURCE_URL = process.argv[2];
          if (!SOURCE_URL) { console.error('No source URL'); process.exit(1); }

          const PROCESS_URL = 'https://9xbuddy.site/process?url=' + encodeURIComponent(SOURCE_URL);

          function sanitize(str) {
            return (str || 'video')
              .replace(/[^a-zA-Z0-9 ._-]/g, '_')
              .replace(/[_ ]+/g, '_')
              .replace(/^_|_$/g, '')
              .slice(0, 80) || 'video';
          }

          function isVideoStream(url, ct = '') {
            if (ct.startsWith('video/')) return true;
            if (url.includes('googlevideo.com/videoplayback')) return true;
            if (/\.(mp4|m3u8|mkv|webm|mov)(\?|$)/i.test(url.split('?')[0])) return true;
            return false;
          }

          function isAudioOnly(url, ct = '') {
            if (ct.startsWith('audio/')) return true;
            const audioItags = ['139','140','141','171','249','250','251'];
            const m = url.match(/[?&]itag=(\d+)/);
            if (m && audioItags.includes(m[1])) return true;
            if (url.includes('mime=audio')) return true;
            return false;
          }

          (async () => {

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent:
                'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
                'AppleWebKit/537.36 (KHTML, like Gecko) ' +
                'Chrome/122.0.0.0 Safari/537.36',
              acceptDownloads: true
            });

            const page = await context.newPage();
            const capturedStreams = [];

            // ── intercept همه network responses ──────────────────────────
            page.on('response', async (resp) => {
              try {
                const u  = resp.url();
                const ct = resp.headers()['content-type'] || '';
                const st = resp.status();

                if (u.includes('9xbud.com/token'))  console.log(`[TOKEN] ${st}`);
                if (u.includes('9xbud.com/extract')) console.log(`[EXTRACT] ${st}`);

                if ((st === 200 || st === 206) && isVideoStream(u, ct) && !isAudioOnly(u, ct)) {
                  if (!capturedStreams.find(s => s.url === u)) {
                    const itag = (u.match(/[?&]itag=(\d+)/) || [])[1] || '';
                    console.log(`[VIDEO STREAM] itag=${itag} ct=${ct} url=${u.slice(0,100)}`);
                    capturedStreams.push({ url: u, itag, ct });
                  }
                }
              } catch (e) {}
            });

            // popup listener
            context.on('page', async (popup) => {
              try {
                await popup.waitForLoadState('domcontentloaded', { timeout: 10000 });
                const u = popup.url();
                console.log('[POPUP]', u.slice(0, 100));
                popup.on('response', async (resp) => {
                  const pu = resp.url();
                  const ct = resp.headers()['content-type'] || '';
                  const st = resp.status();
                  if ((st === 200 || st === 206) && isVideoStream(pu, ct) && !isAudioOnly(pu, ct)) {
                    if (!capturedStreams.find(s => s.url === pu)) {
                      console.log('[POPUP VIDEO STREAM]', pu.slice(0,100));
                      capturedStreams.push({ url: pu, itag: '', ct });
                    }
                  }
                });
              } catch (e) {}
            });

            // ── صفحه رو باز کن ───────────────────────────────────────────
            console.log('Opening:', PROCESS_URL);
            await page.goto(PROCESS_URL, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(3000);

            const title = sanitize((await page.title()).trim());
            console.log('Title:', title);

            // ── کلیک روی دکمه‌های download/extract ───────────────────────
            console.log('\n=== Clicking download buttons ===');

            // همه <a> و <button> رو ساده بگیر (بدون $$eval پیچیده)
            const btnHandles = await page.$$('a, button');

            for (const btn of btnHandles) {
              if (capturedStreams.length > 0) break;
              try {
                const txt  = (await btn.innerText().catch(() => '')).toLowerCase().trim();
                const href = (await btn.getAttribute('href').catch(() => '')) || '';

                // skip: external redirect links و app download
                if (/app|software|extension|program|home|support|about/.test(txt)) continue;
                if (href.includes('offmp3') || href.includes('savegif') || href.includes('123sudo')) continue;
                if (!txt.includes('download') && !txt.includes('extract') && !href.toLowerCase().includes('download')) continue;

                // اگه href مستقیم به ویدیو اشاره داره
                if (/\.(mp4|m3u8|mkv|webm)(\?|$)/i.test(href) && !href.includes('9xbuddy')) {
                  console.log('Direct video href:', href.slice(0, 80));
                  capturedStreams.push({ url: href, itag: '', ct: '' });
                  break;
                }

                console.log('Clicking:', txt || href.slice(0, 50));
                await btn.click().catch(() => {});
                await page.waitForTimeout(8000);

              } catch (e) {}
            }

            // صبر بیشتر اگه هنوز stream نداریم
            if (capturedStreams.length === 0) {
              console.log('Waiting extra 10s for streams...');
              await page.waitForTimeout(10000);
            }

            // ── همچنین دنبال URL های مستقیم در HTML بگرد ─────────────────
            const html = await page.content();
            fs.writeFileSync('grabbed/final_html.txt', html);

            const htmlVideoUrls = [
              ...(html.match(/https?:\/\/[^\s"<>]+googlevideo[^\s"<>]+/g) || []),
              ...(html.match(/https?:\/\/[^\s"<>]+\.mp4[^\s"<>]*/g) || []),
              ...(html.match(/https?:\/\/[^\s"<>]+\.m3u8[^\s"<>]*/g) || []),
            ].map(u => u.replace(/&amp;/g, '&'))
             .filter(u => !isAudioOnly(u));

            console.log('\nHTML video URLs:', htmlVideoUrls.length);
            htmlVideoUrls.slice(0, 3).forEach(u => console.log(' ', u.slice(0, 100)));

            // merge
            for (const u of htmlVideoUrls) {
              if (!capturedStreams.find(s => s.url === u)) {
                capturedStreams.push({ url: u, itag: '', ct: '' });
              }
            }

            console.log('\n=== Total streams found:', capturedStreams.length, '===');
            capturedStreams.forEach((s, i) =>
              console.log(` [${i+1}] itag=${s.itag} url=${s.url.slice(0, 120)}`)
            );

            fs.writeFileSync('grabbed/result.json', JSON.stringify({ title, streams: capturedStreams }, null, 2));

            if (capturedStreams.length === 0) {
              await browser.close();
              console.error('No streams found!');
              process.exit(1);
            }

            // ذخیره برای ffmpeg step
            const best = capturedStreams[0];
            const cookies = await context.cookies();
            fs.writeFileSync('grabbed/stream_url.txt', best.url);
            fs.writeFileSync('grabbed/stream_title.txt', title);
            fs.writeFileSync('grabbed/stream_cookies.txt', cookies.map(c => `${c.name}=${c.value}`).join('; '));

            await browser.close();
            console.log('\nDone. Stream URL saved.');

          })();

          EOF

      - name: Run Playwright
        run: node buddy_dl.js "${{ github.event.inputs.source_url }}"

      - name: Download with ffmpeg
        run: |
          if [ ! -f grabbed/stream_url.txt ]; then
            echo "No stream URL"
            exit 1
          fi

          url=$(cat grabbed/stream_url.txt)
          title=$(cat grabbed/stream_title.txt)
          cookies=$(cat grabbed/stream_cookies.txt 2>/dev/null || echo "")

          echo "URL: ${url:0:120}..."
          echo "Title: $title"

          ffmpeg -y \
            -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            ${cookies:+-headers "Cookie: ${cookies}"} \
            -i "$url" \
            -c copy \
            "downloads/${title}.mp4" \
          && echo "SUCCESS" \
          || {
            echo "ffmpeg failed, trying aria2c..."
            aria2c \
              -x 16 -s 16 -k 1M -c \
              --summary-interval=10 \
              --console-log-level=warn \
              --header="User-Agent: Mozilla/5.0" \
              ${cookies:+--header="Cookie: ${cookies}"} \
              --dir=downloads \
              --out="${title}.mp4" \
              "$url"
          }

      - name: Show results
        run: |
          echo "=== downloads/ ===" && ls -lh downloads/ || echo "(empty)"
          echo "=== result.json ===" && cat grabbed/result.json 2>/dev/null || true

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-grabbed
          path: grabbed/

      - name: Create ZIP
        if: github.event.inputs.upload_mode == 'zip'
        run: |
          ts=$(date +"%Y%m%d_%H%M%S")
          zip -r -P "${{ secrets.ZIP_PASSWORD }}" "buddy_media_${ts}.zip" downloads/

      - name: Delete old releases
        if: github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --limit 100 | awk '{print $1}')
          for tag in $releases; do gh release delete "$tag" -y || true; done

      - name: Upload Direct Release
        if: github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "downloads/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP Release
        if: github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
