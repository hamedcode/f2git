name: 6 - 9xBuddy Downloader

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "لینک فایل برای دانلود"
        required: true

      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip curl aria2 jq gh
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: mkdir -p downloads grabbed

      - name: Create Playwright script
        run: |
          cat > buddy_dl.js << 'EOF'

          const fs   = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const SOURCE_URL = process.argv[2];
          if (!SOURCE_URL) { console.error('No source URL'); process.exit(1); }

          const PROCESS_URL = 'https://9xbuddy.site/process?url=' + encodeURIComponent(SOURCE_URL);

          function sanitize(str) {
            return (str || 'video')
              .replace(/[^a-zA-Z0-9 ._-]/g, '_')
              .replace(/[_ ]+/g, '_')
              .replace(/^_|_$/g, '')
              .slice(0, 80) || 'video';
          }

          // ── worker.dev decoder ────────────────────────────────────────
          // هر segment = reversed base64
          // part1 → URL واقعی، part2 → JSON headers
          function decodeWorkerSegment(seg) {
            try {
              const rev = seg.split('').reverse().join('');
              return Buffer.from(rev, 'base64').toString('utf-8');
            } catch (e) { return null; }
          }

          function parseWorkerUrl(url) {
            try {
              const afterDomain = url.split('workers.dev/')[1]?.split('?')[0];
              if (!afterDomain) return null;
              // جداسازی بر اساس / و , و فیلتر empty
              const parts = afterDomain.split(/[\/,]+/).filter(p => p && p.length > 10);
              if (parts.length === 0) return null;

              let realUrl = null;
              let headers = {};

              // هر part رو امتحان کن
              for (const p of parts) {
                const dec = decodeWorkerSegment(p);
                if (!dec) continue;
                if (!realUrl && dec.startsWith('http')) {
                  realUrl = dec.trim();
                  continue;
                }
                // JSON headers
                if (dec.includes('"headers"') || dec.includes('"user-agent"')) {
                  try {
                    const json = JSON.parse(dec);
                    headers = json.headers || {};
                  } catch (e) {}
                }
              }

              return realUrl ? { url: realUrl, headers } : null;
            } catch (e) { return null; }
          }

          // ── 9xbud/down decoder ────────────────────────────────────────
          // سه نوع:
          //   نوع ۱: base64 → worker.dev URL → دوباره parseWorkerUrl
          //   نوع ۲: base64 → PHP serialized → url + headers
          //   نوع ۳: base64 → مستقیم URL
          function decode9xbudDown(url) {
            try {
              const match = url.match(/\/down\/([A-Za-z0-9+/=,_-]+)/);
              if (!match) return null;
              const b64 = match[1].split('/')[0];
              const decoded = Buffer.from(b64, 'base64').toString('utf-8');
              console.log('  9xbud/down decoded preview:', decoded.slice(0, 80));

              // نوع ۱: → worker.dev
              if (decoded.includes('workers.dev')) {
                console.log('  → worker.dev chain');
                return parseWorkerUrl(decoded);
              }

              // نوع ۲: → PHP serialized
              if (decoded.includes('s:3:"url"')) {
                const urlMatch = decoded.match(/s:3:"url";s:\d+:"([^"]+)"/);
                if (urlMatch) {
                  const realUrl = urlMatch[1];
                  const headers = {};
                  const hMatches = decoded.matchAll(/s:\d+:"([^"]+:\s*[^"]+)"/g);
                  for (const m of hMatches) {
                    const ci = m[1].indexOf(':');
                    if (ci > 0) {
                      headers[m[1].slice(0, ci).trim().toLowerCase()] = m[1].slice(ci + 1).trim();
                    }
                  }
                  console.log('  → PHP serialized, url:', realUrl.slice(0, 80));
                  return { url: realUrl, headers };
                }
              }

              // نوع ۳: مستقیم URL
              if (decoded.startsWith('http')) {
                console.log('  → direct URL');
                return { url: decoded.trim(), headers: {} };
              }

              return null;
            } catch (e) {
              console.log('  decode9xbudDown error:', e.message);
              return null;
            }
          }

          (async () => {

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent:
                'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
                'AppleWebKit/537.36 (KHTML, like Gecko) ' +
                'Chrome/122.0.0.0 Safari/537.36',
              acceptDownloads: true
            });

            const page = await context.newPage();

            page.on('response', async (resp) => {
              try {
                const u = resp.url();
                if (u.includes('9xbud.com/token'))  console.log(`[TOKEN] ${resp.status()}`);
                if (u.includes('9xbud.com/extract')) console.log(`[EXTRACT] ${resp.status()}`);
              } catch (e) {}
            });

            console.log('Opening:', PROCESS_URL);
            await page.goto(PROCESS_URL, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(3000);

            const title = sanitize((await page.title()).trim());
            console.log('Title:', title);

            // ── جمع‌آوری همه لینک‌ها ──────────────────────────────────
            const allHrefs = await page.$$eval('a[href]', els => els.map(a => a.href).filter(Boolean));
            const html = await page.content();
            fs.writeFileSync('grabbed/page.html', html);

            const rawUrls = new Set([
              ...allHrefs,
              ...(html.match(/https?:\/\/[^\s"<>'\\]+workers?\.dev\/[^\s"<>'\\]*/g) || []),
              ...(html.match(/https?:\/\/[^\s"<>'\\]*9xbud\.com\/down\/[^\s"<>'\\]+/g) || []),
              ...(html.match(/https?:\/\/[^\s"<>'\\]+googlevideo[^\s"<>'\\]+/g) || []),
              ...(html.match(/https?:\/\/[^\s"<>'\\]+\.mp4[^\s"<>'\\]*/g) || []),
            ].map(u => u.replace(/&amp;/g, '&')));

            // ── decode و categorize ───────────────────────────────────
            const candidates = [];
            const seenUrls = new Set();

            function addCandidate(url, headers, type, priority) {
              if (!url || seenUrls.has(url)) return;
              seenUrls.add(url);
              candidates.push({ url, headers: headers || {}, type, priority });
              console.log(`[${type}] ${url.slice(0, 100)}`);
            }

            for (const u of rawUrls) {
              // 9xbud/down → decode
              if (u.includes('9xbud.com/down')) {
                console.log('\nDecoding 9xbud/down:', u.slice(0, 80));
                const parsed = decode9xbudDown(u);
                if (parsed?.url) {
                  addCandidate(parsed.url, parsed.headers, '9xbud-decoded', 1);
                } else {
                  // اگه decode نشد مستقیم امتحان کن
                  addCandidate(u, {}, '9xbud-raw', 3);
                }
                continue;
              }

              // worker.dev → decode
              if (u.includes('workers.dev')) {
                const parsed = parseWorkerUrl(u);
                if (parsed?.url) {
                  addCandidate(parsed.url, parsed.headers, 'worker-decoded', 1);
                } else {
                  addCandidate(u, {}, 'worker-raw', 2);
                }
                continue;
              }

              // googlevideo → بدون audio
              if (u.includes('googlevideo.com')) {
                const itag = (u.match(/[?&]itag=(\d+)/) || [])[1];
                const audioItags = ['139','140','141','171','249','250','251'];
                if (itag && audioItags.includes(itag)) continue;
                if (u.includes('mime=audio')) continue;
                addCandidate(u, {}, 'googlevideo', 4);
                continue;
              }

              // direct mp4
              if (/\.mp4(\?|$)/i.test(u.split('?')[0]) && !u.includes('9xbuddy')) {
                addCandidate(u, {}, 'direct', 2);
              }
            }

            candidates.sort((a, b) => a.priority - b.priority);

            console.log('\n=== Candidates:', candidates.length, '===');
            candidates.forEach((c, i) =>
              console.log(` [${i+1}][${c.type}] ${c.url.slice(0, 100)}`)
            );

            fs.writeFileSync('grabbed/candidates.json', JSON.stringify(candidates, null, 2));
            fs.writeFileSync('grabbed/title.txt', title);

            const cookies = await context.cookies();
            fs.writeFileSync('grabbed/cookies.txt', cookies.map(c => `${c.name}=${c.value}`).join('; '));

            await browser.close();

            if (candidates.length === 0) {
              console.error('No candidates found!');
              process.exit(1);
            }

          })();

          EOF

      - name: Run Playwright
        run: node buddy_dl.js "${{ github.event.inputs.source_url }}"

      - name: Download best candidate
        run: |
          python3 << 'PYEOF'
          import json, subprocess, sys, os, re

          candidates = json.load(open('grabbed/candidates.json'))
          title      = open('grabbed/title.txt').read().strip()
          cookies    = open('grabbed/cookies.txt').read().strip() if os.path.exists('grabbed/cookies.txt') else ''

          def get_ext(url):
              m = re.search(r'\.(mp4|m3u8|mkv|webm|mov|vid)', url.split('?')[0], re.I)
              ext = m.group(1).lower() if m else 'mp4'
              return 'mp4' if ext == 'vid' else ext

          def run_curl(url, headers, dest):
              cmd = ['curl', '-L', '--retry', '3', '--connect-timeout', '30',
                     '--max-time', '3600', '-o', dest, '--silent', '--show-error']
              all_h = {'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                       'accept': '*/*'}
              if cookies: all_h['cookie'] = cookies
              all_h.update({k.lower(): v for k, v in headers.items()})
              for k, v in all_h.items():
                  cmd += ['-H', f'{k}: {v}']
              print('  curl:', url[:80])
              r = subprocess.run(cmd + [url])
              if r.returncode == 0 and os.path.exists(dest):
                  sz = os.path.getsize(dest)
                  print(f'  size: {sz/1024/1024:.1f} MB')
                  if sz > 1_048_576: return True
              if os.path.exists(dest): os.remove(dest)
              return False

          def run_aria2(url, headers, dest):
              d, f = os.path.dirname(dest), os.path.basename(dest)
              cmd = ['aria2c', '-x', '16', '-s', '16', '-k', '1M', '-c',
                     '--summary-interval=10', '--console-log-level=warn',
                     '--dir', d, '--out', f]
              all_h = {'user-agent': 'Mozilla/5.0', 'accept': '*/*'}
              if cookies: all_h['cookie'] = cookies
              all_h.update({k.lower(): v for k, v in headers.items()})
              for k, v in all_h.items():
                  cmd += ['--header', f'{k}: {v}']
              print('  aria2c:', url[:80])
              r = subprocess.run(cmd + [url])
              if r.returncode == 0 and os.path.exists(dest):
                  sz = os.path.getsize(dest)
                  if sz > 1_048_576: return True
              if os.path.exists(dest): os.remove(dest)
              return False

          def run_ffmpeg(url, headers, dest):
              cmd = ['ffmpeg', '-y', '-user_agent', 'Mozilla/5.0']
              for k, v in headers.items():
                  if k.lower() in ['referer', 'origin']:
                      cmd += ['-headers', f'{k}: {v}']
              cmd += ['-i', url, '-c', 'copy', dest]
              print('  ffmpeg:', url[:80])
              r = subprocess.run(cmd)
              if r.returncode == 0 and os.path.exists(dest):
                  if os.path.getsize(dest) > 1_048_576: return True
              if os.path.exists(dest): os.remove(dest)
              return False

          downloaded = False

          for c in candidates:
              url     = c['url']
              headers = c.get('headers', {})
              ctype   = c['type']
              ext     = get_ext(url)
              dest    = f'downloads/{title}.{ext}'

              print(f'\n=== [{ctype}] {url[:80]}')

              if ext == 'm3u8':
                  downloaded = run_ffmpeg(url, headers, f'downloads/{title}.mp4')
              else:
                  downloaded = run_curl(url, headers, dest)
                  if not downloaded:
                      downloaded = run_aria2(url, headers, dest)

              if downloaded:
                  print('SUCCESS:', dest)
                  break

          if not downloaded:
              print('All candidates failed!')
              sys.exit(1)
          PYEOF

      - name: Show results
        run: |
          echo "=== downloads/ ===" && ls -lh downloads/ || echo "(empty)"
          echo "=== candidates ===" && python3 -c "
          import json
          c = json.load(open('grabbed/candidates.json'))
          for i,x in enumerate(c): print(f'  [{i+1}][{x[\"type\"]}] {x[\"url\"][:80]}')
          " 2>
