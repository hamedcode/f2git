name: 6 - 9xBuddy Downloader

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "لینک فایل برای دانلود"
        required: true

      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip curl aria2 jq gh
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: |
          mkdir -p downloads
          mkdir -p grabbed

      - name: Create Playwright script
        run: |
          cat > buddy_dl.js << 'EOF'

          const fs   = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const SOURCE_URL = process.argv[2];
          if (!SOURCE_URL) { console.error('No source URL'); process.exit(1); }

          const PROCESS_URL = 'https://9xbuddy.site/process?url=' + encodeURIComponent(SOURCE_URL);

          function sanitize(str) {
            return (str || 'video')
              .replace(/[^a-zA-Z0-9 ._-]/g, '_')
              .replace(/[_ ]+/g, '_')
              .replace(/^_|_$/g, '')
              .slice(0, 80) || 'video';
          }

          function isVideoUrl(url) {
            if (!url || !url.startsWith('http')) return false;
            return /\.(mp4|m3u8|mkv|avi|mov|webm|vid)(\?|$)/i.test(url.split('?')[0]);
          }

          // بعد از /extract response، صفحه JS رو اجرا می‌کنه و لینک‌ها رو decode می‌کنه
          // ما باید صبر کنیم تا href های واقعی توی DOM ظاهر بشن
          async function waitForDecodedLinks(page, timeoutMs = 15000) {
            const start = Date.now();
            while (Date.now() - start < timeoutMs) {
              await page.waitForTimeout(500);

              const links = await page.$$eval('a[href]', els =>
                els.map(a => a.href).filter(h =>
                  h.startsWith('http') &&
                  /\.(mp4|m3u8|mkv|avi|mov|webm|vid)(\?|$)/i.test(h.split('?')[0]) &&
                  !h.includes('9xbuddy')
                )
              );

              if (links.length > 0) {
                return links;
              }
            }
            return [];
          }

          (async () => {

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent:
                'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
                'AppleWebKit/537.36 (KHTML, like Gecko) ' +
                'Chrome/122.0.0.0 Safari/537.36',
              acceptDownloads: true
            });

            const page = await context.newPage();

            // intercept برای لاگ و catch مستقیم
            const interceptedVideoUrls = [];

            page.on('response', async (resp) => {
              try {
                const u  = resp.url();
                const ct = resp.headers()['content-type'] || '';
                const st = resp.status();

                if (u.includes('9xbud.com/token'))   console.log(`[TOKEN] ${st}`);
                if (u.includes('9xbud.com/extract'))  console.log(`[EXTRACT] ${st}`);

                if (st === 200 && (isVideoUrl(u) || ct.startsWith('video/'))) {
                  if (!interceptedVideoUrls.includes(u)) {
                    console.log('[VIDEO INTERCEPTED]', u);
                    interceptedVideoUrls.push(u);
                  }
                }
              } catch (e) {}
            });

            // popup listener
            context.on('page', async (popup) => {
              try {
                await popup.waitForLoadState('domcontentloaded', { timeout: 10000 });
                const u = popup.url();
                console.log('[POPUP]', u);
                if (isVideoUrl(u) && !interceptedVideoUrls.includes(u)) {
                  interceptedVideoUrls.push(u);
                }
              } catch (e) {}
            });

            // ── Step 1: صفحه رو باز کن ───────────────────────────────────
            console.log('Opening:', PROCESS_URL);
            await page.goto(PROCESS_URL, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(3000);

            const title = sanitize((await page.title()).trim());
            console.log('Title:', title);

            // ── Step 2: روی اولین Extract/Download کلیک کن ───────────────
            // بعد از کلیک، صفحه /extract می‌زنه و JS آدرس decode شده رو
            // توی DOM می‌نویسه — ما با waitForDecodedLinks منتظر می‌مونیم
            console.log('\n=== Clicking first actionable button ===');

            const buttons = await page.$$('a, button');
            let domLinks = [];

            for (const btn of buttons) {
              try {
                const txt  = (await btn.innerText()).trim().toLowerCase();
                const href = (await btn.getAttribute('href') || '');

                if (/app|software|extension|program|home|support|about/.test(txt)) continue;
                if (
                  !txt.includes('download') &&
                  !txt.includes('extract') &&
                  !txt.includes('get link') &&
                  !href.toLowerCase().includes('download')
                ) continue;

                // اگه href مستقیماً به ویدیو اشاره داره
                if (isVideoUrl(href)) {
                  console.log('Direct href found:', href);
                  domLinks = [href];
                  break;
                }

                console.log('Clicking:', txt || href.slice(0, 60));

                // کلیک کن و صبر کن تا /extract response بیاد و JS لینک رو decode کنه
                const extractResponsePromise = page.waitForResponse(
                  r => r.url().includes('9xbud.com/extract'),
                  { timeout: 20000 }
                ).catch(() => null);

                await btn.click().catch(() => {});

                const extractResp = await extractResponsePromise;
                if (extractResp) {
                  console.log('[EXTRACT response received, status:', extractResp.status(), ']');
                  // صبر کن JS لینک‌ها رو decode و توی DOM بنویسه
                  console.log('Waiting for DOM to update with decoded links...');
                  domLinks = await waitForDecodedLinks(page, 15000);
                  console.log('DOM links found:', domLinks.length);
                  if (domLinks.length > 0) break;
                } else {
                  // اگه /extract نیومد، ممکنه لینک مستقیم باشه
                  await page.waitForTimeout(5000);
                  domLinks = await waitForDecodedLinks(page, 3000);
                  if (domLinks.length > 0) break;
                }

              } catch (e) {}
            }

            // ── Step 3: merge همه منابع ───────────────────────────────────
            const allUrls = [...new Set([...domLinks, ...interceptedVideoUrls])];

            console.log('\n=== All video URLs:', allUrls.length, '===');
            allUrls.forEach((u, i) => console.log(` [${i+1}] ${u}`));

            fs.writeFileSync('grabbed/result.json', JSON.stringify({ title, urls: allUrls }, null, 2));

            if (allUrls.length === 0) {
              // آخرین تلاش: dump کامل HTML برای debug
              const html = await page.content();
              fs.writeFileSync('grabbed/final_html.txt', html);
              console.log('Saved final HTML for debug');
              await browser.close();
              console.error('No video URLs found!');
              process.exit(1);
            }

            // ── Step 4: دانلود ───────────────────────────────────────────
            let downloaded = false;

            for (const url of allUrls) {
              console.log('\nDownloading:', url);

              const extM = url.split('?')[0].match(/\.(mp4|m3u8|mkv|webm|mov|vid)$/i);
              let ext = extM ? extM[1].toLowerCase() : 'mp4';
              if (ext === 'vid') ext = 'mp4';

              if (ext === 'm3u8') {
                const cookies = await context.cookies();
                fs.writeFileSync('grabbed/hls_url.txt', url);
                fs.writeFileSync('grabbed/hls_title.txt', title);
                fs.writeFileSync('grabbed/hls_cookies.txt', cookies.map(c => `${c.name}=${c.value}`).join('; '));
                console.log('HLS saved for ffmpeg');
                downloaded = true;
                break;
              }

              try {
                const resp = await page.request.get(url, {
                  headers: { 'Referer': 'https://9xbuddy.site/', 'Accept': '*/*' },
                  timeout: 0
                });
                console.log('Status:', resp.status());
                if (!resp.ok()) { console.log('Non-200, skip'); continue; }
                const body = await resp.body();
                console.log('Size:', (body.length / 1024 / 1024).toFixed(2), 'MB');
                if (body.length < 1_048_576) { console.log('Too small, skip'); continue; }
                const dest = path.join('downloads', `${title}.${ext}`);
                fs.writeFileSync(dest, body);
                console.log('Saved:', dest);
                downloaded = true;
                break;
              } catch (e) {
                console.log('Error:', e.message);
              }
            }

            await browser.close();
            if (!downloaded) { console.error('Download failed!'); process.exit(1); }

          })();

          EOF

      - name: Run Playwright
        run: node buddy_dl.js "${{ github.event.inputs.source_url }}"

      - name: Download HLS if needed
        run: |
          if [ ! -f grabbed/hls_url.txt ]; then echo "No HLS"; exit 0; fi
          url=$(cat grabbed/hls_url.txt)
          title=$(cat grabbed/hls_title.txt)
          cookies=$(cat grabbed/hls_cookies.txt)
          ffmpeg -y -user_agent "Mozilla/5.0" \
            -headers "Cookie: ${cookies}" \
            -i "$url" -c copy "downloads/${title}.mp4"

      - name: Show results
        run: |
          echo "=== downloads/ ===" && ls -lh downloads/ || echo "(empty)"
          echo "=== result.json ===" && cat grabbed/result.json 2>/dev/null || true

      - name: Create ZIP
        if: github.event.inputs.upload_mode == 'zip'
        run: |
          ts=$(date +"%Y%m%d_%H%M%S")
          zip -r -P "${{ secrets.ZIP_PASSWORD }}" "buddy_media_${ts}.zip" downloads/

      - name: Delete old releases
        if: github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --limit 100 | awk '{print $1}')
          for tag in $releases; do gh release delete "$tag" -y || true; done

      - name: Upload Direct Release
        if: github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "downloads/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP Release
        if: github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
