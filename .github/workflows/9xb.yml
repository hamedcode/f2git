name: 6 - 9xBuddy Downloader

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "لینک فایل برای دانلود"
        required: true

      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip curl aria2 jq gh
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: |
          mkdir -p downloads
          mkdir -p grabbed

      - name: Create Playwright script
        run: |
          cat > buddy_dl.js << 'EOF'

          const fs   = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const SOURCE_URL = process.argv[2];
          if (!SOURCE_URL) { console.error('No source URL'); process.exit(1); }

          const PROCESS_URL = 'https://9xbuddy.site/process?url=' + encodeURIComponent(SOURCE_URL);

          function sanitize(str) {
            return (str || 'video')
              .replace(/[^a-zA-Z0-9 ._-]/g, '_')
              .replace(/[_ ]+/g, '_')
              .replace(/^_|_$/g, '')
              .slice(0, 80) || 'video';
          }

          function isVideoFile(url) {
            return /\.(mp4|m3u8|mkv|avi|mov|webm|vid)(\?|$)/i.test(url.split('?')[0]);
          }

          // همه لینک‌های ویدیو رو از DOM فعلی جمع می‌کنه
          async function collectVideoLinksFromDOM(page) {
            const links = await page.$$eval('a', els =>
              els.map(a => a.href || '').filter(Boolean)
            );
            return links.filter(h => isVideoFile(h) && !h.includes('9xbuddy'));
          }

          // بعد از کلیک، منتظر می‌مونه تا لینک جدیدی در DOM ظاهر بشه
          async function waitForNewLink(page, existingLinks, timeoutMs = 15000) {
            const start = Date.now();
            while (Date.now() - start < timeoutMs) {
              await page.waitForTimeout(1000);
              const current = await collectVideoLinksFromDOM(page);
              const newLinks = current.filter(u => !existingLinks.includes(u));
              if (newLinks.length > 0) return newLinks;
            }
            return [];
          }

          (async () => {

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent:
                'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
                'AppleWebKit/537.36 (KHTML, like Gecko) ' +
                'Chrome/122.0.0.0 Safari/537.36',
              acceptDownloads: true
            });

            const page = await context.newPage();

            // intercept همه network responses
            const capturedVideoUrls = [];

            page.on('response', async (resp) => {
              try {
                const u  = resp.url();
                const ct = resp.headers()['content-type'] || '';
                const st = resp.status();

                if (
                  st === 200 &&
                  (isVideoFile(u) || ct.startsWith('video/')) &&
                  !u.includes('9xbuddy') &&
                  !capturedVideoUrls.includes(u)
                ) {
                  console.log(`[NETWORK VIDEO] ${u}`);
                  capturedVideoUrls.push(u);
                }
              } catch (e) {}
            });

            // popup listener
            context.on('page', async (popup) => {
              try {
                await popup.waitForLoadState('domcontentloaded', { timeout: 10000 });
                const u = popup.url();
                console.log('[POPUP]', u);
                if (isVideoFile(u) && !u.includes('9xbuddy') && !capturedVideoUrls.includes(u)) {
                  capturedVideoUrls.push(u);
                }
                popup.on('response', async (resp) => {
                  const pu = resp.url();
                  const ct = resp.headers()['content-type'] || '';
                  if ((isVideoFile(pu) || ct.startsWith('video/')) && !capturedVideoUrls.includes(pu)) {
                    console.log('[POPUP VIDEO]', pu);
                    capturedVideoUrls.push(pu);
                  }
                });
                await popup.waitForTimeout(8000);
                await popup.close().catch(() => {});
              } catch (e) {}
            });

            // ── باز کردن صفحه ────────────────────────────────────────────
            console.log('Opening:', PROCESS_URL);
            await page.goto(PROCESS_URL, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(5000);

            const title = sanitize((await page.title()).trim());
            console.log('Title:', title);

            // snapshot از لینک‌های فعلی DOM (قبل از هر کلیک)
            let knownLinks = await collectVideoLinksFromDOM(page);
            console.log('DOM video links before clicks:', knownLinks.length);

            if (capturedVideoUrls.length > 0 || knownLinks.length > 0) {
              console.log('Already have links from network intercept!');
            }

            // ── پیدا کردن همه دکمه‌های قابل کلیک ───────────────────────
            // شامل: download, download now, extract link, get link, و غیره
            console.log('\n=== Finding all action buttons ===');

            const allButtons = await page.$$('a, button');
            const actionButtons = [];

            for (const btn of allButtons) {
              try {
                const txt  = (await btn.innerText()).trim().toLowerCase();
                const href = (await btn.getAttribute('href') || '').toLowerCase();

                // skip: navigation, app download, و دکمه‌های بی‌ربط
                if (/app|software|extension|program|home|support|about/.test(txt)) continue;
                if (txt.length === 0 && href.length === 0) continue;

                // دکمه‌های مرتبط با دانلود یا extract
                const isRelevant =
                  txt.includes('download') ||
                  txt.includes('extract') ||
                  txt.includes('get link') ||
                  txt.includes('get video') ||
                  txt.includes('fetch') ||
                  href.includes('download');

                if (!isRelevant) continue;

                console.log(`  Button: "${txt || href.slice(0, 60)}"`);
                actionButtons.push(btn);
              } catch (e) {}
            }

            console.log('Action buttons found:', actionButtons.length);

            // ── کلیک روی هر دکمه و بررسی نتیجه ─────────────────────────
            for (const btn of actionButtons) {
              if (capturedVideoUrls.length > 0) break;

              try {
                const txt  = (await btn.innerText()).trim();
                const href = (await btn.getAttribute('href') || '');

                // اگه href مستقیماً به ویدیو اشاره می‌کنه
                if (isVideoFile(href) && !href.includes('9xbuddy')) {
                  console.log('\nDirect video href:', href);
                  if (!capturedVideoUrls.includes(href)) capturedVideoUrls.push(href);
                  continue;
                }

                console.log(`\nClicking: "${txt}"`);

                // کلیک + صبر برای resolve شدن لینک
                const dlPromise = page.waitForEvent('download', { timeout: 12000 }).catch(() => null);
                await btn.click().catch(() => {});

                // صبر می‌کنیم و هم download event و هم DOM تغییر رو چک می‌کنیم
                const [dl, newDomLinks] = await Promise.all([
                  dlPromise,
                  waitForNewLink(page, knownLinks, 12000)
                ]);

                if (dl) {
                  const dest = path.join('downloads', dl.suggestedFilename() || `${title}.mp4`);
                  console.log('  DOWNLOAD EVENT! Saving:', dest);
                  await dl.saveAs(dest);
                  fs.writeFileSync('grabbed/result.json', JSON.stringify({ title, direct_download: dest }, null, 2));
                  await browser.close();
                  process.exit(0);
                }

                if (newDomLinks.length > 0) {
                  console.log('  NEW DOM LINKS after click:');
                  newDomLinks.forEach(u => console.log('   ', u));
                  capturedVideoUrls.push(...newDomLinks);
                  knownLinks = [...knownLinks, ...newDomLinks];
                  break;
                }

                // بررسی href بعد از کلیک (بعضی سایت‌ها href رو آپدیت می‌کنن)
                const resolvedHref = (await btn.getAttribute('href').catch(() => '')) || '';
                if (isVideoFile(resolvedHref) && !resolvedHref.includes('9xbuddy')) {
                  console.log('  Resolved href:', resolvedHref);
                  capturedVideoUrls.push(resolvedHref);
                  break;
                }

                console.log('  No new links found after click');

              } catch (e) {
                console.log('  Error:', e.message);
              }
            }

            // ── merge همه منابع ───────────────────────────────────────────
            const allUrls = [...new Set([...capturedVideoUrls, ...knownLinks])];

            console.log('\n=== All video URLs:', allUrls.length, '===');
            allUrls.forEach((u, i) => console.log(` [${i+1}] ${u}`));

            fs.writeFileSync('grabbed/result.json', JSON.stringify({ title, urls: allUrls }, null, 2));

            if (allUrls.length === 0) {
              await browser.close();
              console.error('No video URLs found!');
              process.exit(1);
            }

            // ── دانلود ───────────────────────────────────────────────────
            let downloaded = false;

            for (const url of allUrls) {
              console.log('\nDownloading:', url);

              const extM = url.split('?')[0].match(/\.(mp4|m3u8|mkv|webm|mov|vid)$/i);
              let ext = extM ? extM[1].toLowerCase() : 'mp4';
              if (ext === 'vid') ext = 'mp4';

              if (ext === 'm3u8') {
                const cookies = await context.cookies();
                fs.writeFileSync('grabbed/hls_url.txt', url);
                fs.writeFileSync('grabbed/hls_title.txt', title);
                fs.writeFileSync('grabbed/hls_cookies.txt', cookies.map(c=>`${c.name}=${c.value}`).join('; '));
                console.log('HLS saved for ffmpeg');
                downloaded = true;
                break;
              }

              try {
                const resp = await page.request.get(url, {
                  headers: { 'Referer': 'https://9xbuddy.site/', 'Accept': '*/*' },
                  timeout: 0
                });
                console.log('Status:', resp.status());
                if (!resp.ok()) { console.log('Non-200, skip'); continue; }
                const body = await resp.body();
                console.log('Size:', (body.length / 1024 / 1024).toFixed(2), 'MB');
                if (body.length < 1_048_576) { console.log('Too small, skip'); continue; }
                const dest = path.join('downloads', `${title}.${ext}`);
                fs.writeFileSync(dest, body);
                console.log('Saved:', dest);
                downloaded = true;
                break;
              } catch (e) {
                console.log('Error:', e.message);
              }
            }

            await browser.close();
            if (!downloaded) { console.error('Download failed!'); process.exit(1); }

          })();

          EOF

      - name: Run Playwright
        run: node buddy_dl.js "${{ github.event.inputs.source_url }}"

      - name: Download HLS if needed
        run: |
          if [ ! -f grabbed/hls_url.txt ]; then echo "No HLS"; exit 0; fi
          url=$(cat grabbed/hls_url.txt)
          title=$(cat grabbed/hls_title.txt)
          cookies=$(cat grabbed/hls_cookies.txt)
          ffmpeg -y -user_agent "Mozilla/5.0" \
            -headers "Cookie: ${cookies}" \
            -i "$url" -c copy "downloads/${title}.mp4"

      - name: Show results
        run: |
          echo "=== downloads/ ===" && ls -lh downloads/ || echo "(empty)"
          echo "=== result.json ===" && cat grabbed/result.json 2>/dev/null || true

      - name: Create ZIP
        if: github.event.inputs.upload_mode == 'zip'
        run: |
          ts=$(date +"%Y%m%d_%H%M%S")
          zip -r -P "${{ secrets.ZIP_PASSWORD }}" "buddy_media_${ts}.zip" downloads/

      - name: Delete old releases
        if: github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --limit 100 | awk '{print $1}')
          for tag in $releases; do gh release delete "$tag" -y || true; done

      - name: Upload Direct Release
        if: github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "downloads/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP Release
        if: github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
