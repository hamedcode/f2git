name: 6 - 9xBuddy Downloader

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "لینک فایل برای دانلود"
        required: true

      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip curl aria2 jq gh
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: mkdir -p downloads grabbed

      - name: Write Playwright script
        run: |
          python3 - << 'PYEOF'
          script = r"""
          const fs   = require('fs');
          const { chromium } = require('playwright');

          const SOURCE_URL = process.argv[2];
          if (!SOURCE_URL) { console.error('No source URL'); process.exit(1); }

          const PROCESS_URL = 'https://9xbuddy.site/process?url=' + encodeURIComponent(SOURCE_URL);

          function sanitize(str) {
            return (str || 'video')
              .replace(/[^a-zA-Z0-9 ._-]/g, '_')
              .replace(/[_ ]+/g, '_')
              .replace(/^_|_$/g, '')
              .slice(0, 80) || 'video';
          }

          // لینک‌های قابل استفاده از DOM
          async function getActionLinks(page) {
            const hrefs = await page.$$eval('a[href]', els => els.map(a => a.href).filter(Boolean));
            return hrefs.filter(u =>
              u.includes('9xbud.com/down') ||
              u.includes('workers.dev')
            );
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
              acceptDownloads: true
            });
            const page = await context.newPage();

            page.on('response', async (resp) => {
              try {
                const u = resp.url();
                if (u.includes('9xbud.com/token'))  console.log('[TOKEN]', resp.status());
                if (u.includes('9xbud.com/extract')) console.log('[EXTRACT]', resp.status());
              } catch(e) {}
            });

            console.log('Opening:', PROCESS_URL);
            await page.goto(PROCESS_URL, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(3000);

            const title = sanitize((await page.title()).trim());
            console.log('Title:', title);

            // کلیک روی اولین دکمه download/extract
            const buttons = await page.$$('button, a');
            let foundLinks = [];

            for (const btn of buttons) {
              try {
                const txt  = (await btn.innerText().catch(() => '')).toLowerCase().trim();
                const href = (await btn.getAttribute('href').catch(() => '')) || '';

                if (/app|software|extension|home|support|language/.test(txt)) continue;
                if (!txt.includes('download') && !txt.includes('extract') && !txt.includes('get link')) continue;
                if (href.startsWith('http') && !href.includes('9xbud.com') && !href.includes('workers.dev')) continue;

                console.log('Clicking:', txt.slice(0, 40) || href.slice(0, 60));
                await btn.click().catch(() => {});

                // poll هر 500ms تا 12 ثانیه
                const start = Date.now();
                while (Date.now() - start < 12000) {
                  await page.waitForTimeout(500);
                  const links = await getActionLinks(page);
                  if (links.length > 0) {
                    console.log('Found', links.length, 'link(s) after', Math.round((Date.now()-start)/1000), 's');
                    links.forEach(l => console.log(' ', l.slice(0, 120)));
                    foundLinks = links;
                    break;
                  }
                }

                if (foundLinks.length > 0) break;
                console.log('No links, trying next button...');
              } catch(e) {}
            }

            if (foundLinks.length === 0) {
              console.error('No links found!');
              await browser.close();
              process.exit(1);
            }

            // ── build candidates ──────────────────────────────────────────
            // کلید: 9xbud.com/down/ رو مستقیم دانلود کن (proxy هست)
            // workers.dev رو هم مستقیم دانلود کن (proxy هست)
            // نیازی به decode نیست!
            const candidates = [];
            const seen = new Set();

            function addCandidate(url, type, priority) {
              if (!url || seen.has(url)) return;
              seen.add(url);
              candidates.push({ url, type, priority });
              console.log('[' + type + '] ' + url.slice(0, 100));
            }

            for (const u of foundLinks) {
              if (u.includes('9xbud.com/down')) {
                addCandidate(u, '9xbud-direct', 1);
              } else if (u.includes('workers.dev')) {
                addCandidate(u, 'worker-direct', 2);
              }
            }

            candidates.sort((a, b) => a.priority - b.priority);
            console.log('\n=== Candidates:', candidates.length);
            candidates.forEach((c, i) => console.log(' [' + (i+1) + '][' + c.type + '] ' + c.url.slice(0, 100)));

            fs.writeFileSync('grabbed/candidates.json', JSON.stringify(candidates, null, 2));
            fs.writeFileSync('grabbed/title.txt', title);
            const cookies = await context.cookies();
            fs.writeFileSync('grabbed/cookies.txt', cookies.map(c => c.name + '=' + c.value).join('; '));

            await browser.close();
          })();
          """
          with open('buddy_dl.js', 'w') as f:
              f.write(script)
          print('Written')
          PYEOF

      - name: Run Playwright
        run: node buddy_dl.js "${{ github.event.inputs.source_url }}"

      - name: Download candidates
        run: |
          python3 - << 'PYEOF'
          import json, subprocess, sys, os, re

          candidates = json.load(open('grabbed/candidates.json'))
          title      = open('grabbed/title.txt').read().strip()
          cookies    = open('grabbed/cookies.txt').read().strip() if os.path.exists('grabbed/cookies.txt') else ''

          print(f'Total candidates: {len(candidates)}')

          def get_ext(url):
            # از Content-Disposition میخونیم، ولی پیش‌فرض mp4
            return 'mp4'

          def run_curl(url, dest):
            cmd = [
              'curl', '-L',
              '--retry', '3',
              '--connect-timeout', '30',
              '--max-time', '3600',
              '-o', dest,
              '--silent', '--show-error',
              '--write-out', '%{http_code}|%{content_type}',
              '-H', 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
              '-H', 'Accept: */*',
            ]
            if cookies:
              cmd += ['-H', f'Cookie: {cookies}']
            cmd.append(url)
            print('  curl:', url[:80])
            r = subprocess.run(cmd, capture_output=True, text=True)
            out = r.stdout.strip() if r.stdout else ''
            parts = out.split('|')
            code = parts[0][-3:] if parts else '?'
            ctype = parts[1] if len(parts) > 1 else ''
            print(f'  http={code} content-type={ctype[:50]}')
            if r.returncode == 0 and os.path.exists(dest):
              sz = os.path.getsize(dest)
              print(f'  size: {sz/1024/1024:.1f} MB')
              if sz > 1_048_576 and code == '200': return True
            if os.path.exists(dest): os.remove(dest)
            return False

          def run_aria2(url, dest):
            d, f = os.path.dirname(dest) or 'downloads', os.path.basename(dest)
            cmd = [
              'aria2c', '-x', '16', '-s', '16', '-k', '1M', '-c',
              '--summary-interval=10', '--console-log-level=warn',
              '--header', 'User-Agent: Mozilla/5.0',
              '--header', 'Accept: */*',
              '--dir', d, '--out', f,
              url
            ]
            print('  aria2c:', url[:80])
            r = subprocess.run(cmd)
            full = os.path.join(d, f)
            if r.returncode == 0 and os.path.exists(full):
              sz = os.path.getsize(full)
              print(f'  size: {sz/1024/1024:.1f} MB')
              if sz > 1_048_576: return True
            if os.path.exists(full): os.remove(full)
            return False

          downloaded = False
          for i, c in enumerate(candidates):
            url   = c['url']
            ctype = c['type']
            dest  = f'downloads/{title}.mp4'

            print(f'\n=== [{i+1}/{len(candidates)}][{ctype}] {url[:80]}')

            ok = run_curl(url, dest)
            if not ok:
              print('  curl failed, trying aria2c...')
              ok = run_aria2(url, dest)

            if ok:
              print('SUCCESS!')
              downloaded = True
              break
            else:
              print('  failed, next...')

          if not downloaded:
            print('\nAll candidates failed!')
            sys.exit(1)
          PYEOF

      - name: Show results
        run: |
          echo "=== downloads/ ===" && ls -lh downloads/ || echo "(empty)"
          echo "=== candidates ===" && python3 -c "
          import json
          try:
            c = json.load(open('grabbed/candidates.json'))
            for i,x in enumerate(c): print(f'  [{i+1}][{x[\"type\"]}] {x[\"url\"][:90]}')
          except: pass
          "

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-grabbed
          path: grabbed/

      - name: Create ZIP
        if: github.event.inputs.upload_mode == 'zip'
        run: |
          ts=$(date +"%Y%m%d_%H%M%S")
          zip -r -P "${{ secrets.ZIP_PASSWORD }}" "buddy_media_${ts}.zip" downloads/

      - name: Delete old releases
        if: github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --limit 100 | awk '{print $1}')
          for tag in $releases; do gh release delete "$tag" -y || true; done

      - name: Upload Direct Release
        if: github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "downloads/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP Release
        if: github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
