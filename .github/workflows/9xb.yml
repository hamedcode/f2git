name: 6 - 9xBuddy Downloader

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: "9xbuddy process URL (e.g. https://9xbuddy.site/process?url=...)"
        required: true

      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip curl aria2 jq gh
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: |
          mkdir -p downloads
          mkdir -p grabbed

      - name: Create Playwright script
        run: |
          cat > buddy_dl.js << 'EOF'

          const fs   = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const PAGE_URL = process.argv[2];
          if (!PAGE_URL) { console.error('No URL'); process.exit(1); }

          function sanitize(str) {
            return (str || 'video')
              .replace(/[^a-zA-Z0-9 ._-]/g, '_')
              .replace(/[_ ]+/g, '_')
              .replace(/^_|_$/g, '')
              .slice(0, 80) || 'video';
          }

          const JUNK_DOMAINS = [
            '123sudo.com','offmp3.com','savegif.com',
            '9xbuddy.site','9xbuddy.org','9xbuddy.app',
            'google.com','facebook.com','twitter.com'
          ];
          function isJunk(url) {
            try { const h = new URL(url).hostname; return JUNK_DOMAINS.some(d => h.includes(d)); }
            catch { return true; }
          }
          function isVideoUrl(url) {
            return /\.(mp4|m3u8|mkv|avi|mov|webm|vid)(\?|$)/i.test(url.split('?')[0]);
          }

          (async () => {

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent:
                'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
                'AppleWebKit/537.36 (KHTML, like Gecko) ' +
                'Chrome/122.0.0.0 Safari/537.36',
              acceptDownloads: true
            });

            const page = await context.newPage();

            // ── KEY STRATEGY ─────────────────────────────────────────────
            // Intercept network responses.
            // The moment a real video URL appears → download it immediately
            // using page.request (same browser session/IP/TLS fingerprint).
            // Do NOT wait for all buttons to be clicked first.
            // ─────────────────────────────────────────────────────────────

            let downloadPromiseResolve = null;
            const downloadPromise = new Promise(res => { downloadPromiseResolve = res; });
            let downloaded = false;

            page.on('response', async (response) => {
              if (downloaded) return;
              try {
                const u  = response.url();
                const ct = response.headers()['content-type'] || '';
                const status = response.status();

                // catch actual video being streamed (content-type video/*)
                if ((ct.startsWith('video/') || ct === 'application/octet-stream') && status === 200) {
                  if (isJunk(u)) return;
                  console.log('STREAMING RESPONSE CAUGHT:', u);
                  console.log('Content-Type:', ct, '| Status:', status);
                  // try to read the body directly from this response
                  try {
                    const body = await response.body();
                    if (body.length > 1_048_576) {
                      const title = sanitize((await page.title()).trim());
                      const ext   = u.split('?')[0].match(/\.(mp4|mkv|webm|mov)/i)?.[1] || 'mp4';
                      const dest  = path.join('downloads', `${title}.${ext}`);
                      fs.writeFileSync(dest, body);
                      console.log(`SAVED from stream: ${(body.length/1024/1024).toFixed(1)} MB -> ${dest}`);
                      downloaded = true;
                      downloadPromiseResolve('done');
                    }
                  } catch (e) {
                    console.log('Could not read stream body:', e.message);
                  }
                }
              } catch (e) {}
            });

            console.log('Opening:', PAGE_URL);
            await page.goto(PAGE_URL, { waitUntil: 'networkidle', timeout: 60000 });

            console.log('Waiting for page to render...');
            try { await page.waitForSelector('a[href], button', { timeout: 20000 }); } catch (e) {}
            await page.waitForTimeout(3000);

            const rawTitle = (await page.title()).trim();
            const title    = sanitize(rawTitle);
            console.log('TITLE:', rawTitle, '->', title);

            // collect direct video links from DOM (before any clicks)
            const domVideoUrls = (await page.$$eval('a', els => els.map(a => a.href || '')))
              .filter(h => isVideoUrl(h) && !isJunk(h));

            console.log('DOM video links found:', domVideoUrls.length);

            // try DOM links immediately — before clicking anything
            for (const url of domVideoUrls) {
              if (downloaded) break;
              console.log('\nTRYING DOM link immediately:', url);
              try {
                const resp = await page.request.get(url, {
                  headers: {
                    'Referer':        'https://9xbuddy.site/',
                    'Origin':         'https://9xbuddy.site',
                    'Accept':         '*/*',
                    'Accept-Language':'en-US,en;q=0.9',
                  },
                  timeout: 0
                });
                console.log('Status:', resp.status());
                if (resp.ok()) {
                  const body = await resp.body();
                  if (body.length > 1_048_576) {
                    const extMatch = url.split('?')[0].match(/\.(mp4|m3u8|mkv|avi|mov|webm|vid)$/i);
                    let ext = extMatch ? extMatch[1].toLowerCase() : 'mp4';
                    if (ext === 'vid') ext = 'mp4';
                    if (ext === 'm3u8') {
                      // HLS fallback
                      const cookies = await context.cookies();
                      fs.writeFileSync('grabbed/hls_url.txt',     url);
                      fs.writeFileSync('grabbed/hls_title.txt',   title);
                      fs.writeFileSync('grabbed/hls_cookies.txt', cookies.map(c=>`${c.name}=${c.value}`).join('; '));
                      downloaded = true;
                      downloadPromiseResolve('hls');
                    } else {
                      const dest = path.join('downloads', `${title}.${ext}`);
                      fs.writeFileSync(dest, body);
                      console.log(`SUCCESS: ${(body.length/1024/1024).toFixed(1)} MB -> ${dest}`);
                      downloaded = true;
                      downloadPromiseResolve('done');
                    }
                  } else {
                    console.log('Too small, skip:', body.length, 'bytes');
                  }
                }
              } catch (err) {
                console.log('FAILED:', err.message);
              }
            }

            if (downloaded) {
              await browser.close();
              process.exit(0);
            }

            // if DOM links didn't work, click download buttons one at a time
            // and try each resolved URL immediately (don't collect all first)
            const buttons = await page.$$('a, button');

            for (const btn of buttons) {
              if (downloaded) break;
              try {
                const txt  = (await btn.innerText()).trim().toLowerCase();
                const href = (await btn.getAttribute('href') || '').toLowerCase();

                if (/app|software|extension|program/.test(txt)) continue;
                if (!txt.includes('download') && !href.includes('download')) continue;

                const fullHref = (await btn.getAttribute('href')) || '';

                // if it's already a direct video link, try it now
                if (fullHref.startsWith('http') && isVideoUrl(fullHref) && !isJunk(fullHref)) {
                  console.log('\nTRYING direct href:', fullHref);
                  try {
                    const resp = await page.request.get(fullHref, {
                      headers: { 'Referer': 'https://9xbuddy.site/', 'Accept': '*/*' },
                      timeout: 0
                    });
                    console.log('Status:', resp.status());
                    if (resp.ok()) {
                      const body = await resp.body();
                      if (body.length > 1_048_576) {
                        const extM = fullHref.split('?')[0].match(/\.(mp4|mkv|webm|mov|vid)$/i);
                        let ext = extM ? extM[1].toLowerCase() : 'mp4';
                        if (ext === 'vid') ext = 'mp4';
                        const dest = path.join('downloads', `${title}.${ext}`);
                        fs.writeFileSync(dest, body);
                        console.log(`SUCCESS: ${(body.length/1024/1024).toFixed(1)} MB -> ${dest}`);
                        downloaded = true;
                        break;
                      }
                    }
                  } catch (e) { console.log('FAILED:', e.message); }
                  continue;
                }

                console.log('\nClicking:', txt || href);

                // click button, wait for anti-bot loader, then check resolved href
                await btn.click({ modifiers: ['Meta'] }).catch(async () => {
                  await btn.click().catch(() => {});
                });

                // wait for 9xbuddy's anti-bot spinner (usually 3-8s, we give 12s)
                await page.waitForTimeout(12000);

                const resolvedHref = (await btn.getAttribute('href').catch(() => '')) || '';
                if (resolvedHref.startsWith('http') && isVideoUrl(resolvedHref) && !isJunk(resolvedHref)) {
                  console.log('RESOLVED:', resolvedHref);
                  try {
                    const resp = await page.request.get(resolvedHref, {
                      headers: { 'Referer': 'https://9xbuddy.site/', 'Accept': '*/*' },
                      timeout: 0
                    });
                    console.log('Status:', resp.status());
                    if (resp.ok()) {
                      const body = await resp.body();
                      if (body.length > 1_048_576) {
                        const extM = resolvedHref.split('?')[0].match(/\.(mp4|mkv|webm|mov|vid)$/i);
                        let ext = extM ? extM[1].toLowerCase() : 'mp4';
                        if (ext === 'vid') ext = 'mp4';
                        const dest = path.join('downloads', `${title}.${ext}`);
                        fs.writeFileSync(dest, body);
                        console.log(`SUCCESS: ${(body.length/1024/1024).toFixed(1)} MB -> ${dest}`);
                        downloaded = true;
                        break;
                      } else {
                        console.log('Too small:', body.length, 'bytes');
                      }
                    } else {
                      console.log('Non-200:', resp.status());
                    }
                  } catch (e) { console.log('FAILED:', e.message); }
                }

              } catch (e) {}
            }

            await browser.close();

            if (!downloaded) {
              console.error('All URLs failed!');
              process.exit(1);
            }

          })();

          EOF

      - name: Run Playwright
        run: |
          node buddy_dl.js "${{ github.event.inputs.page_url }}"

      - name: Download HLS if needed
        run: |
          if [ -f grabbed/hls_url.txt ]; then
            url=$(cat grabbed/hls_url.txt)
            title=$(cat grabbed/hls_title.txt)
            cookies=$(cat grabbed/hls_cookies.txt)
            echo "HLS: $url"
            ffmpeg -y \
              -user_agent "Mozilla/5.0" \
              -headers "Cookie: ${cookies}" \
              -i "$url" \
              -c copy \
              "downloads/${title}.mp4"
          else
            echo "No HLS"
          fi

      - name: Show results
        run: |
          echo "=== downloads/ ==="
          ls -lh downloads/ || echo "(empty)"

      - name: Create ZIP
        if: github.event.inputs.upload_mode == 'zip'
        run: |
          ts=$(date +"%Y%m%d_%H%M%S")
          zip -r -P "${{ secrets.ZIP_PASSWORD }}" "buddy_media_${ts}.zip" downloads/

      - name: Delete old releases
        if: github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --limit 100 | awk '{print $1}')
          for tag in $releases; do gh release delete "$tag" -y || true; done

      - name: Upload Direct Release
        if: github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "downloads/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP Release
        if: github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
