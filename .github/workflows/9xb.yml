name: 6 - 9xBuddy Downloader

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "لینک مستقیم فایل (مثلاً https://miixdrop.net/f/abc123)"
        required: true

      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip curl aria2 jq gh
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: |
          mkdir -p downloads
          mkdir -p grabbed

      - name: Create Playwright script
        run: |
          cat > buddy_dl.js << 'EOF'

          const fs   = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const SOURCE_URL = process.argv[2];
          if (!SOURCE_URL) { console.error('No source URL'); process.exit(1); }

          const BUDDY_URL = 'https://9xbuddy.site/process?url=' + encodeURIComponent(SOURCE_URL);

          function sanitize(str) {
            return (str || 'video')
              .replace(/[^a-zA-Z0-9 ._-]/g, '_')
              .replace(/[_ ]+/g, '_')
              .replace(/^_|_$/g, '')
              .slice(0, 80) || 'video';
          }

          const JUNK_DOMAINS = [
            '123sudo.com','offmp3.com','savegif.com',
            '9xbuddy.site','9xbuddy.org','9xbuddy.app',
            'google.com','facebook.com','twitter.com','youtube.com'
          ];
          function isJunk(url) {
            try { const h = new URL(url).hostname; return JUNK_DOMAINS.some(d => h.includes(d)); }
            catch { return true; }
          }
          function isVideoFile(url) {
            return /\.(mp4|m3u8|mkv|avi|mov|webm|vid)(\?|$)/i.test(url.split('?')[0]);
          }

          (async () => {

            const browser = await chromium.launch({
              headless: true,
              // allow downloads to go to our downloads/ folder
              downloadsPath: path.resolve('downloads')
            });

            const context = await browser.newContext({
              userAgent:
                'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
                'AppleWebKit/537.36 (KHTML, like Gecko) ' +
                'Chrome/122.0.0.0 Safari/537.36',
              acceptDownloads: true
            });

            const page = await context.newPage();

            // ── Watch ALL requests to log headers sent by the browser ─────
            // This helps us capture the real Referer/Cookie the CDN expects
            const videoRequests = [];
            page.on('request', req => {
              const u = req.url();
              if (isVideoFile(u) && !isJunk(u)) {
                console.log('VIDEO REQUEST:', u);
                console.log('  headers:', JSON.stringify(req.headers(), null, 2));
                videoRequests.push({ url: u, headers: req.headers() });
              }
            });

            // ── Watch for Playwright download events ──────────────────────
            // When the browser triggers a file download, capture it
            let downloadedFile = null;
            context.on('page', newPage => {
              newPage.on('download', async dl => {
                console.log('DOWNLOAD EVENT on new page:', dl.url());
                const dest = path.join('downloads', dl.suggestedFilename() || 'video.mp4');
                await dl.saveAs(dest);
                console.log('Saved:', dest);
                downloadedFile = dest;
              });
            });
            page.on('download', async dl => {
              console.log('DOWNLOAD EVENT:', dl.url());
              const dest = path.join('downloads', dl.suggestedFilename() || 'video.mp4');
              await dl.saveAs(dest);
              console.log('Saved:', dest);
              downloadedFile = dest;
            });

            // ── Watch responses for actual video data (200 + video/*) ─────
            let interceptedVideoUrl  = null;
            let interceptedHeaders   = null;
            page.on('response', async resp => {
              try {
                const u   = resp.url();
                const ct  = resp.headers()['content-type'] || '';
                const st  = resp.status();
                if (
                  st === 200 &&
                  (ct.startsWith('video/') || ct === 'application/octet-stream') &&
                  !isJunk(u)
                ) {
                  console.log('VIDEO RESPONSE INTERCEPTED:', u, ct);
                  interceptedVideoUrl = u;
                  // capture the request headers that succeeded
                  const req = resp.request();
                  interceptedHeaders = req.headers();
                }
              } catch (e) {}
            });

            // ── Step 1: go to 9xbuddy, enter URL ─────────────────────────
            console.log('=== Step 1: Opening 9xbuddy ===');
            await page.goto('https://9xbuddy.site/', {
              waitUntil: 'networkidle',
              timeout: 30000
            });

            console.log('Entering source URL:', SOURCE_URL);
            try {
              const input = await page.waitForSelector(
                'input[type="text"], input[type="url"], input[placeholder*="link" i], input[placeholder*="url" i], input[placeholder*="paste" i]',
                { timeout: 10000 }
              );
              await input.fill(SOURCE_URL);

              await Promise.race([
                page.keyboard.press('Enter'),
                page.click('button[type="submit"], button:has-text("Download"), button:has-text("Go")').catch(() => {})
              ]);
              console.log('Submitted');
            } catch (e) {
              console.log('Input submit failed, going direct:', e.message);
              await page.goto(BUDDY_URL, { waitUntil: 'networkidle', timeout: 60000 });
            }

            // ── Step 2: wait for process page + download links ────────────
            console.log('\n=== Step 2: Waiting for process page ===');
            await page.waitForURL('**/process**', { timeout: 15000 }).catch(async () => {
              console.log('Still not on process page, navigating directly...');
              await page.goto(BUDDY_URL, { waitUntil: 'networkidle', timeout: 60000 });
            });

            try {
              await page.waitForSelector(
                'a[href*=".mp4"], a[href*=".m3u8"], button:has-text("Download")',
                { timeout: 30000 }
              );
            } catch (e) { console.log('Selector timeout, continuing...'); }

            await page.waitForTimeout(3000);

            const rawTitle = (await page.title()).trim();
            const title    = sanitize(rawTitle);
            console.log('TITLE:', rawTitle, '->', title);

            // ── Step 3: click each download button ────────────────────────
            // Strategy: let the BROWSER do the actual navigation/download
            // so the CDN sees a real browser request with correct headers
            console.log('\n=== Step 3: Clicking download buttons ===');

            const buttons = await page.$$('a, button');

            for (const btn of buttons) {
              if (downloadedFile) break;

              try {
                const txt  = (await btn.innerText()).trim().toLowerCase();
                const href = (await btn.getAttribute('href') || '');

                if (/app|software|extension|program/.test(txt)) continue;
                if (!txt.includes('download') && !href.toLowerCase().includes('download')) continue;

                console.log('\nClicking:', txt || href.slice(0, 80));

                // Normal left-click — let the browser navigate/download naturally
                // Wrap in downloadEvent race so we catch if it triggers a download
                const dlPromise = page.waitForEvent('download', { timeout: 15000 }).catch(() => null);

                await btn.click().catch(() => {});

                // wait for anti-bot spinner and potential navigation
                await page.waitForTimeout(10000);

                // check if a download was triggered
                const dl = await dlPromise;
                if (dl) {
                  const dest = path.join('downloads', dl.suggestedFilename() || `${title}.mp4`);
                  console.log('Download triggered! Saving to:', dest);
                  await dl.saveAs(dest);
                  downloadedFile = dest;
                  break;
                }

                // check if href resolved to a video URL after click
                const resolvedHref = (await btn.getAttribute('href').catch(() => '')) || '';
                if (resolvedHref.startsWith('http') && isVideoFile(resolvedHref) && !isJunk(resolvedHref)) {
                  console.log('Resolved href after click:', resolvedHref);

                  // navigate the page directly to the video URL
                  // this makes the browser send ALL the same headers it would
                  // if a user clicked the link
                  const dlPromise2 = page.waitForEvent('download', { timeout: 30000 }).catch(() => null);

                  await page.goto(resolvedHref, { waitUntil: 'commit', timeout: 30000 }).catch(() => {});

                  const dl2 = await dlPromise2;
                  if (dl2) {
                    const dest = path.join('downloads', dl2.suggestedFilename() || `${title}.mp4`);
                    console.log('Download from navigation! Saving:', dest);
                    await dl2.saveAs(dest);
                    downloadedFile = dest;
                    break;
                  }

                  // if no download event but we have intercepted request headers, use aria2c
                  if (interceptedHeaders) {
                    console.log('Using intercepted headers with aria2c');
                    fs.writeFileSync('grabbed/dl_url.txt', resolvedHref);
                    fs.writeFileSync('grabbed/dl_title.txt', title);
                    fs.writeFileSync('grabbed/dl_headers.json', JSON.stringify(interceptedHeaders));
                    downloadedFile = 'aria2c';
                    break;
                  }
                }

              } catch (e) {}
            }

            // if we intercepted a video URL with working headers, save for aria2c
            if (!downloadedFile && interceptedVideoUrl && interceptedHeaders) {
              console.log('Using intercepted video URL with captured headers');
              fs.writeFileSync('grabbed/dl_url.txt', interceptedVideoUrl);
              fs.writeFileSync('grabbed/dl_title.txt', title);
              fs.writeFileSync('grabbed/dl_headers.json', JSON.stringify(interceptedHeaders));
              downloadedFile = 'aria2c';
            }

            // also save all video request info for debugging
            fs.writeFileSync('grabbed/video_requests.json', JSON.stringify(videoRequests, null, 2));

            await browser.close();

            if (!downloadedFile) {
              console.error('All attempts failed!');
              // print video requests for debugging
              console.log('\nVideo requests seen:', videoRequests.length);
              videoRequests.forEach((r,i) => console.log(`[${i+1}]`, r.url));
              process.exit(1);
            }

            console.log('Done! downloadedFile =', downloadedFile);

          })();

          EOF

      - name: Run Playwright
        run: |
          node buddy_dl.js "${{ github.event.inputs.source_url }}"

      - name: Download with aria2c (if Playwright captured headers)
        run: |
          if [ ! -f grabbed/dl_url.txt ]; then
            echo "No aria2c download needed"
            exit 0
          fi

          url=$(cat grabbed/dl_url.txt)
          title=$(cat grabbed/dl_title.txt)
          ext=$(echo "$url" | grep -oiE '\.(mp4|mkv|webm|mov|vid)' | head -1 | tr -d '.' | sed 's/vid/mp4/')
          ext=${ext:-mp4}

          echo "aria2c download: $url"

          # build header args from captured headers JSON
          header_args=""
          while IFS= read -r line; do
            name=$(echo "$line" | jq -r '.name')
            value=$(echo "$line" | jq -r '.value')
            [ -z "$name" ] || [ "$name" = "null" ] && continue
            header_args="$header_args --header=\"${name}: ${value}\""
          done < <(jq -c 'to_entries[] | {name: .key, value: .value}' grabbed/dl_headers.json)

          eval aria2c \
            -x 16 -s 16 -k 1M \
            -c \
            --summary-interval=10 \
            --console-log-level=warn \
            $header_args \
            --dir=downloads \
            --out="${title}.${ext}" \
            "\"$url\""

      - name: Show results
        run: |
          echo "=== downloads/ ==="
          ls -lh downloads/ || echo "(empty)"
          echo ""
          echo "=== video requests seen ==="
          cat grabbed/video_requests.json 2>/dev/null || echo "(none)"

      - name: Create ZIP
        if: github.event.inputs.upload_mode == 'zip'
        run: |
          ts=$(date +"%Y%m%d_%H%M%S")
          zip -r -P "${{ secrets.ZIP_PASSWORD }}" "buddy_media_${ts}.zip" downloads/

      - name: Delete old releases
        if: github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --limit 100 | awk '{print $1}')
          for tag in $releases; do gh release delete "$tag" -y || true; done

      - name: Upload Direct Release
        if: github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "downloads/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP Release
        if: github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
