name: 6 - 9xBuddy Downloader

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "لینک فایل برای دانلود"
        required: true

      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip curl aria2 jq gh
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: mkdir -p downloads grabbed

      - name: Create Playwright script
        run: |
          cat > buddy_dl.js << 'EOF'

          const fs      = require('fs');
          const path    = require('path');
          const https   = require('https');
          const http    = require('http');
          const { chromium } = require('playwright');

          const SOURCE_URL = process.argv[2];
          if (!SOURCE_URL) { console.error('No source URL'); process.exit(1); }

          const PROCESS_URL = 'https://9xbuddy.site/process?url=' + encodeURIComponent(SOURCE_URL);

          function sanitize(str) {
            return (str || 'video')
              .replace(/[^a-zA-Z0-9 ._-]/g, '_')
              .replace(/[_ ]+/g, '_')
              .replace(/^_|_$/g, '')
              .slice(0, 80) || 'video';
          }

          function isVideoStream(url, ct = '') {
            if (ct.startsWith('video/')) return true;
            if (url.includes('googlevideo.com/videoplayback')) return true;
            if (url.includes('worker.dev')) return true;
            if (/\.(mp4|m3u8|mkv|webm|mov)(\?|$)/i.test(url.split('?')[0])) return true;
            return false;
          }

          function isAudioOnly(url, ct = '') {
            if (ct.startsWith('audio/')) return true;
            const audioItags = ['139','140','141','171','249','250','251'];
            const m = url.match(/[?&]itag=(\d+)/);
            if (m && audioItags.includes(m[1])) return true;
            if (/[?&]mime=audio/.test(url)) return true;
            return false;
          }

          // دانلود با Node http/https — با همون headers که browser استفاده کرد
          function downloadWithNode(url, dest, headers = {}) {
            return new Promise((resolve, reject) => {
              const follow = (u, redirects) => {
                if (redirects > 10) return reject(new Error('Too many redirects'));
                const mod = u.startsWith('https') ? https : http;
                const req = mod.get(u, { headers }, (res) => {
                  if ([301,302,303,307,308].includes(res.statusCode)) {
                    return follow(res.headers['location'], redirects + 1);
                  }
                  if (res.statusCode !== 200 && res.statusCode !== 206) {
                    res.resume();
                    return reject(new Error(`HTTP ${res.statusCode}`));
                  }
                  const total = parseInt(res.headers['content-length'] || '0');
                  let got = 0, last = 0;
                  const out = fs.createWriteStream(dest);
                  res.on('data', chunk => {
                    got += chunk.length;
                    const now = Date.now();
                    if (now - last > 5000) {
                      const pct = total ? ((got/total)*100).toFixed(1) : '?';
                      console.log(`  ${(got/1024/1024).toFixed(1)}MB / ${(total/1024/1024).toFixed(1)}MB (${pct}%)`);
                      last = now;
                    }
                  });
                  res.pipe(out);
                  out.on('finish', () => resolve(got));
                  out.on('error', reject);
                });
                req.on('error', reject);
              };
              follow(url, 0);
            });
          }

          (async () => {

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent:
                'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
                'AppleWebKit/537.36 (KHTML, like Gecko) ' +
                'Chrome/122.0.0.0 Safari/537.36',
              acceptDownloads: true
            });

            const page = await context.newPage();

            // ── collect candidate URLs از همه منابع ──────────────────────
            // اولویت: 1) worker.dev  2) 9xbuddy direct  3) googlevideo
            const candidates = [];

            function addCandidate(url, source) {
              if (!url || candidates.find(c => c.url === url)) return;
              candidates.push({ url, source });
              console.log(`[CANDIDATE][${source}] ${url.slice(0, 100)}`);
            }

            // network intercept
            page.on('response', async (resp) => {
              try {
                const u  = resp.url();
                const ct = resp.headers()['content-type'] || '';
                const st = resp.status();
                if (u.includes('9xbud.com/token'))   console.log(`[TOKEN] ${st}`);
                if (u.includes('9xbud.com/extract'))  console.log(`[EXTRACT] ${st}`);
                if ((st === 200 || st === 206) && isVideoStream(u, ct) && !isAudioOnly(u, ct)) {
                  addCandidate(u, 'network');
                }
              } catch (e) {}
            });

            context.on('page', async (popup) => {
              try {
                await popup.waitForLoadState('domcontentloaded', { timeout: 10000 });
                const u = popup.url();
                console.log('[POPUP]', u.slice(0, 100));
                if (isVideoStream(u) && !isAudioOnly(u)) addCandidate(u, 'popup');
                popup.on('response', async (r) => {
                  const pu = r.url();
                  const ct = r.headers()['content-type'] || '';
                  if (isVideoStream(pu, ct) && !isAudioOnly(pu, ct)) addCandidate(pu, 'popup-network');
                });
              } catch (e) {}
            });

            // ── Step 1: صفحه رو باز کن ───────────────────────────────────
            console.log('Opening:', PROCESS_URL);
            await page.goto(PROCESS_URL, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(3000);

            const title = sanitize((await page.title()).trim());
            console.log('Title:', title);

            // ── Step 2: همه لینک‌ها رو از HTML بگیر ─────────────────────
            // بدون کلیک — URL ها قبلاً توی HTML هستن
            const html = await page.content();

            // worker.dev links (اولویت اول)
            const workerUrls = (html.match(/https?:\/\/[^\s"<>']+worker\.dev[^\s"<>'"]*/g) || [])
              .map(u => u.replace(/&amp;/g, '&'));
            workerUrls.forEach(u => addCandidate(u, 'html-worker'));

            // 9xbuddy direct download links
            const buddyUrls = (html.match(/https?:\/\/[^\s"<>']*9xbuddy[^\s"<>'"]*download[^\s"<>'"]+/g) || [])
              .map(u => u.replace(/&amp;/g, '&'));
            buddyUrls.forEach(u => addCandidate(u, 'html-9xbuddy'));

            // googlevideo (اولویت آخر — expire میشن)
            const googleUrls = (html.match(/https?:\/\/[^\s"<>']+googlevideo[^\s"<>'"]+/g) || [])
              .map(u => u.replace(/&amp;/g, '&'))
              .filter(u => !isAudioOnly(u));
            googleUrls.forEach(u => addCandidate(u, 'html-googlevideo'));

            // mp4/m3u8 links
            const directUrls = (html.match(/https?:\/\/[^\s"<>'"]+\.(mp4|m3u8|mkv|webm)(\?[^\s"<>'"]*)?/gi) || [])
              .map(u => u.replace(/&amp;/g, '&'))
              .filter(u => !u.includes('9xbuddy'));
            directUrls.forEach(u => addCandidate(u, 'html-direct'));

            console.log('\nCandidates after HTML scan:', candidates.length);

            // ── Step 3: دانلود بلافاصله با همان session ──────────────────
            // مهم: دانلود اینجا انجام میشه — نه در step جداگانه
            // چون URL های googlevideo IP-bound و time-limited هستن

            const cookies = await context.cookies();
            const cookieStr = cookies.map(c => `${c.name}=${c.value}`).join('; ');

            const dlHeaders = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
              'Referer': 'https://9xbuddy.site/',
              'Cookie': cookieStr
            };

            let downloaded = false;

            // تابع دانلود با page.request (همان browser session)
            async function tryPageRequest(url, dest) {
              try {
                console.log('  [page.request]', url.slice(0, 80));
                const resp = await page.request.get(url, {
                  headers: { 'Referer': 'https://9xbuddy.site/', 'Accept': '*/*' },
                  timeout: 0
                });
                console.log('  status:', resp.status());
                if (!resp.ok()) return false;
                const body = await resp.body();
                console.log('  size:', (body.length/1024/1024).toFixed(2), 'MB');
                if (body.length < 1_048_576) return false;
                fs.writeFileSync(dest, body);
                return true;
              } catch (e) {
                console.log('  page.request error:', e.message);
                return false;
              }
            }

            // تابع دانلود با Node http (برای stream URLs)
            async function tryNodeDownload(url, dest) {
              try {
                console.log('  [node http]', url.slice(0, 80));
                const bytes = await downloadWithNode(url, dest, dlHeaders);
                console.log('  size:', (bytes/1024/1024).toFixed(2), 'MB');
                if (bytes < 1_048_576) { fs.unlinkSync(dest); return false; }
                return true;
              } catch (e) {
                console.log('  node http error:', e.message);
                if (fs.existsSync(dest)) fs.unlinkSync(dest);
                return false;
              }
            }

            for (const c of candidates) {
              if (downloaded) break;
              console.log('\n=== Trying:', c.source, c.url.slice(0, 80));

              const extM = c.url.split('?')[0].match(/\.(mp4|m3u8|mkv|webm|mov|vid)$/i);
              let ext = extM ? extM[1].toLowerCase() : 'mp4';
              if (ext === 'vid') ext = 'mp4';

              if (ext === 'm3u8') {
                // HLS: ذخیره برای ffmpeg
                fs.writeFileSync('grabbed/hls_url.txt', c.url);
                fs.writeFileSync('grabbed/hls_title.txt', title);
                fs.writeFileSync('grabbed/hls_cookies.txt', cookieStr);
                console.log('  HLS saved for ffmpeg');
                downloaded = true;
                break;
              }

              const dest = path.join('downloads', `${title}.${ext}`);

              // worker.dev و direct links: با page.request
              if (c.source.includes('worker') || c.source.includes('9xbuddy') || c.source.includes('direct')) {
                downloaded = await tryPageRequest(c.url, dest);
              }

              // googlevideo: با Node http (چون IP باید match کنه)
              if (!downloaded && c.url.includes('googlevideo')) {
                downloaded = await tryNodeDownload(c.url, dest);
              }

              // fallback: هر دو روش رو امتحان کن
              if (!downloaded) {
                downloaded = await tryPageRequest(c.url, dest);
              }
              if (!downloaded) {
                downloaded = await tryNodeDownload(c.url, dest);
              }

              if (downloaded) {
                console.log('SUCCESS:', dest);
              }
            }

            await browser.close();

            fs.writeFileSync('grabbed/result.json', JSON.stringify({ title, candidates, downloaded }, null, 2));

            if (!downloaded) {
              console.error('All candidates failed!');
              process.exit(1);
            }

          })();

          EOF

      - name: Run Playwright
        run: node buddy_dl.js "${{ github.event.inputs.source_url }}"

      - name: Download HLS if needed
        run: |
          if [ ! -f grabbed/hls_url.txt ]; then echo "No HLS"; exit 0; fi
          url=$(cat grabbed/hls_url.txt)
          title=$(cat grabbed/hls_title.txt)
          cookies=$(cat grabbed/hls_cookies.txt 2>/dev/null || echo "")
          ffmpeg -y \
            -user_agent "Mozilla/5.0" \
            ${cookies:+-headers "Cookie: ${cookies}"} \
            -i "$url" -c copy "downloads/${title}.mp4"

      - name: Show results
        run: |
          echo "=== downloads/ ===" && ls -lh downloads/ || echo "(empty)"
          echo "=== result.json ===" && cat grabbed/result.json 2>/dev/null | head -30 || true

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-grabbed
          path: grabbed/

      - name: Create ZIP
        if: github.event.inputs.upload_mode == 'zip'
        run: |
          ts=$(date +"%Y%m%d_%H%M%S")
          zip -r -P "${{ secrets.ZIP_PASSWORD }}" "buddy_media_${ts}.zip" downloads/

      - name: Delete old releases
        if: github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --limit 100 | awk '{print $1}')
          for tag in $releases; do gh release delete "$tag" -y || true; done

      - name: Upload Direct Release
        if: github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "downloads/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP Release
        if: github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
