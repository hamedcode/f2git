name: 6 - 9xBuddy Downloader

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: "9xbuddy process URL (e.g. https://9xbuddy.site/process?url=...)"
        required: true

      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            zip \
            curl \
            aria2 \
            jq \
            gh

          npm init -y
          npm install playwright

          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: |
          mkdir -p downloads
          mkdir -p grabbed

      - name: Create Playwright script
        run: |
          cat > buddy_dl.js << 'EOF'

          const fs      = require('fs');
          const path    = require('path');
          const https   = require('https');
          const http    = require('http');
          const { chromium } = require('playwright');

          const PAGE_URL = process.argv[2];

          if (!PAGE_URL) {
            console.error('No URL provided');
            process.exit(1);
          }

          function sanitize(str) {
            return (str || 'video')
              .replace(/[^a-zA-Z0-9 ._-]/g, '_')
              .replace(/[_ ]+/g, '_')
              .replace(/^_|_$/g, '')
              .slice(0, 80) || 'video';
          }

          // Download using Node's http/https — carries the same headers
          // Playwright used when it resolved the URL
          function downloadFile(url, destPath, extraHeaders = {}) {
            return new Promise((resolve, reject) => {

              const follow = (u, redirects) => {

                if (redirects > 10) return reject(new Error('Too many redirects'));

                const mod     = u.startsWith('https') ? https : http;
                const options = {
                  headers: {
                    'User-Agent':
                      'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
                      'AppleWebKit/537.36 (KHTML, like Gecko) ' +
                      'Chrome/122.0.0.0 Safari/537.36',
                    'Referer': 'https://9xbuddy.site/',
                    ...extraHeaders
                  }
                };

                const req = mod.get(u, options, (res) => {

                  if ([301, 302, 303, 307, 308].includes(res.statusCode)) {
                    const loc = res.headers['location'];
                    console.log(`  REDIRECT ${res.statusCode} -> ${loc}`);
                    return follow(loc, redirects + 1);
                  }

                  if (res.statusCode !== 200) {
                    res.resume();
                    return reject(new Error(`HTTP ${res.statusCode}`));
                  }

                  const total = parseInt(res.headers['content-length'] || '0', 10);
                  let received = 0;
                  let lastLog  = 0;

                  const out = fs.createWriteStream(destPath);

                  res.on('data', (chunk) => {
                    received += chunk.length;
                    const now = Date.now();
                    if (now - lastLog > 5000) {
                      const pct = total ? ((received / total) * 100).toFixed(1) : '?';
                      console.log(`  ... ${(received/1024/1024).toFixed(1)} MB / ${(total/1024/1024).toFixed(1)} MB (${pct}%)`);
                      lastLog = now;
                    }
                  });

                  res.pipe(out);
                  out.on('finish', () => resolve(received));
                  out.on('error', reject);

                });

                req.on('error', reject);
              };

              follow(url, 0);
            });
          }

          (async () => {

            const browser = await chromium.launch({ headless: true });

            const context = await browser.newContext({
              userAgent:
                'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
                'AppleWebKit/537.36 (KHTML, like Gecko) ' +
                'Chrome/122.0.0.0 Safari/537.36',
              acceptDownloads: true
            });

            const page = await context.newPage();

            // intercept all responses to catch direct video URLs early
            const interceptedVideoUrls = [];

            page.on('response', async (response) => {
              try {
                const u   = response.url();
                const ct  = response.headers()['content-type'] || '';
                if (
                  /\.(mp4|m3u8|mkv|webm|vid)(\?|$)/i.test(u) ||
                  ct.includes('video/')
                ) {
                  if (!interceptedVideoUrls.includes(u)) {
                    console.log('INTERCEPTED VIDEO RESPONSE:', u);
                    interceptedVideoUrls.push(u);
                  }
                }
              } catch (e) {}
            });

            console.log('Opening:', PAGE_URL);

            await page.goto(PAGE_URL, {
              waitUntil: 'networkidle',
              timeout: 60000
            });

            // wait for download rows to render
            console.log('Waiting for content...');
            try {
              await page.waitForSelector('a[href], button', { timeout: 20000 });
            } catch (e) {}
            await page.waitForTimeout(5000);

            const rawTitle = (await page.title()).trim();
            const title    = sanitize(rawTitle);
            console.log('PAGE TITLE:', rawTitle, '→', title);

            // collect ALL cookies from this session
            const cookies = await context.cookies();
            const cookieHeader = cookies
              .map(c => `${c.name}=${c.value}`)
              .join('; ');

            console.log(`Session cookies: ${cookies.length}`);

            // find candidate download links from the DOM
            const domUrls = await page.$$eval('a', (els) =>
              els
                .map(a => a.href || '')
                .filter(href =>
                  href.startsWith('http') &&
                  (
                    /\.(mp4|m3u8|mkv|avi|mov|webm|vid)(\?|$)/i.test(href) ||
                    /\/download\//i.test(href)  ||
                    /[?&]url=/i.test(href)
                  )
                )
            );

            // also click download buttons and capture where they navigate
            const clickedUrls = [];

            const downloadButtons = await page.$$('a, button');

            for (const btn of downloadButtons) {
              try {
                const txt  = (await btn.innerText()).trim().toLowerCase();
                const href = (await btn.getAttribute('href')) || '';

                if (!txt.includes('download') && !href.includes('download')) continue;

                // skip obvious non-file links
                if (href.startsWith('javascript') || href === '#') continue;

                if (
                  href.startsWith('http') &&
                  /\.(mp4|m3u8|mkv|avi|mov|webm|vid)(\?|$)/i.test(href) &&
                  !clickedUrls.includes(href)
                ) {
                  console.log('Direct link from DOM:', href);
                  clickedUrls.push(href);
                  continue;
                }

                console.log('Clicking button:', txt || href);

                // open in new tab to avoid navigating away
                const [newPage] = await Promise.all([
                  context.waitForEvent('page', { timeout: 10000 }).catch(() => null),
                  btn.click({ modifiers: ['Meta'] }).catch(async () => {
                    await btn.click().catch(() => {});
                  })
                ]);

                // wait for anti-bot loader (9xbuddy shows spinner ~3-8s)
                await page.waitForTimeout(10000);

                if (newPage) {
                  try {
                    await newPage.waitForLoadState('networkidle', { timeout: 15000 });
                    const u = newPage.url();
                    console.log('NEW TAB URL:', u);
                    if (u && u !== 'about:blank' && !clickedUrls.includes(u)) {
                      clickedUrls.push(u);
                    }
                    await newPage.close();
                  } catch (e) {}
                }

                // check if the button href was updated after click
                const newHref = (await btn.getAttribute('href').catch(() => '')) || '';
                if (
                  newHref.startsWith('http') &&
                  /\.(mp4|m3u8|mkv|avi|mov|webm|vid)(\?|$)/i.test(newHref) &&
                  !clickedUrls.includes(newHref)
                ) {
                  console.log('RESOLVED after click:', newHref);
                  clickedUrls.push(newHref);
                }

              } catch (e) {}
            }

            // merge all URL sources; intercepted first (most reliable)
            const allUrls = [
              ...interceptedVideoUrls,
              ...clickedUrls,
              ...domUrls
            ].filter((u, i, arr) => u && arr.indexOf(u) === i);

            console.log(`\nTotal candidate URLs: ${allUrls.length}`);
            allUrls.forEach((u, i) => console.log(` [${i+1}] ${u}`));

            if (allUrls.length === 0) {
              console.error('No download URLs found!');
              await browser.close();
              process.exit(1);
            }

            // --- attempt download with session cookies ---
            let downloaded = false;

            for (const url of allUrls) {

              console.log('\n========================================');
              console.log('TRYING:', url);
              console.log('========================================');

              const extMatch = url.split('?')[0].match(/\.(mp4|m3u8|mkv|avi|mov|webm|vid)$/i);
              let ext = extMatch ? extMatch[1].toLowerCase() : 'mp4';
              if (ext === 'vid') ext = 'mp4';

              const destPath = path.join('downloads', `${title}.${ext}`);

              if (ext === 'm3u8') {
                // for HLS write a helper file; ffmpeg step will handle it
                fs.writeFileSync('grabbed/hls_url.txt', url);
                fs.writeFileSync('grabbed/hls_title.txt', title);
                fs.writeFileSync('grabbed/hls_cookies.txt', cookieHeader);
                console.log('HLS URL written — will use ffmpeg');
                downloaded = true;
                break;
              }

              try {
                const bytes = await downloadFile(url, destPath, {
                  'Cookie': cookieHeader
                });

                if (bytes > 1_048_576) {
                  console.log(`SUCCESS: ${(bytes/1024/1024).toFixed(1)} MB -> ${destPath}`);
                  downloaded = true;
                  break;
                } else {
                  console.log(`SKIP: too small (${bytes} bytes)`);
                  fs.unlinkSync(destPath);
                }

              } catch (err) {
                console.log('FAILED:', err.message);
                if (fs.existsSync(destPath)) fs.unlinkSync(destPath);
              }
            }

            await browser.close();

            if (!downloaded) {
              console.error('All URLs failed!');
              process.exit(1);
            }

          })();

          EOF

      - name: Run Playwright (download inside browser session)
        run: |
          node buddy_dl.js "${{ github.event.inputs.page_url }}"

      - name: Download HLS if needed
        run: |
          if [ -f grabbed/hls_url.txt ]; then
            url=$(cat grabbed/hls_url.txt)
            title=$(cat grabbed/hls_title.txt)
            cookies=$(cat grabbed/hls_cookies.txt)

            echo "HLS download: $url"

            ffmpeg -y \
              -user_agent "Mozilla/5.0" \
              -headers "Cookie: ${cookies}" \
              -i "$url" \
              -c copy \
              "downloads/${title}.mp4"
          else
            echo "No HLS — skipping"
          fi

      - name: Show results
        run: |
          echo "=== downloads/ ==="
          ls -lh downloads/ || echo "(empty)"

      - name: Create ZIP
        if: github.event.inputs.upload_mode == 'zip'
        run: |
          ts=$(date +"%Y%m%d_%H%M%S")
          zip -r \
            -P "${{ secrets.ZIP_PASSWORD }}" \
            "buddy_media_${ts}.zip" \
            downloads/

      - name: Delete old releases
        if: github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --limit 100 | awk '{print $1}')
          for tag in $releases; do
            gh release delete "$tag" -y || true
          done

      - name: Upload Direct Release
        if: github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "downloads/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP Release
        if: github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
