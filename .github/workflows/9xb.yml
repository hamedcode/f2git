name: 6 - 9xBuddy DEBUG

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "لینک فایل برای دانلود"
        required: true

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: mkdir -p grabbed

      - name: Create debug script
        run: |
          cat > debug.js << 'EOF'

          const fs   = require('fs');
          const { chromium } = require('playwright');

          const SOURCE_URL = process.argv[2];
          const PROCESS_URL = 'https://9xbuddy.site/process?url=' + encodeURIComponent(SOURCE_URL);

          (async () => {

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
              acceptDownloads: true
            });

            const page = await context.newPage();

            // ── همه network requests رو لاگ کن ──────────────────────────
            const networkLog = [];

            page.on('request', req => {
              networkLog.push({
                type: 'REQUEST',
                method: req.method(),
                url: req.url(),
                headers: req.headers()
              });
            });

            page.on('response', async resp => {
              const entry = {
                type: 'RESPONSE',
                status: resp.status(),
                url: resp.url(),
                headers: resp.headers()
              };
              // body رو فقط برای JSON و کوچیک بخون
              try {
                const ct = resp.headers()['content-type'] || '';
                const cl = parseInt(resp.headers()['content-length'] || '999999');
                if (ct.includes('json') && cl < 50000) {
                  entry.body = await resp.text();
                }
              } catch (e) {}
              networkLog.push(entry);
            });

            // popup listener
            context.on('page', async (popup) => {
              const u = popup.url();
              console.log('[POPUP OPENED]', u);
              networkLog.push({ type: 'POPUP', url: u });
              popup.on('request', req => {
                networkLog.push({ type: 'POPUP_REQUEST', url: req.url() });
              });
              try {
                await popup.waitForLoadState('networkidle', { timeout: 10000 });
                const finalUrl = popup.url();
                console.log('[POPUP FINAL URL]', finalUrl);
                const html = await popup.content();
                fs.writeFileSync('grabbed/popup_html.txt', html);
                networkLog.push({ type: 'POPUP_FINAL', url: finalUrl });
              } catch (e) {}
            });

            console.log('Opening:', PROCESS_URL);
            await page.goto(PROCESS_URL, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(4000);

            // HTML قبل از کلیک
            const htmlBefore = await page.content();
            fs.writeFileSync('grabbed/html_before.txt', htmlBefore);
            console.log('HTML before saved, size:', htmlBefore.length);

            // همه دکمه‌ها رو لیست کن
            const buttons = await page.$$eval('a, button', els =>
              els.map(el => ({
                tag:  el.tagName,
                txt:  el.innerText?.trim() || '',
                href: el.getAttribute('href') || '',
                cls:  el.className || ''
              }))
            );
            fs.writeFileSync('grabbed/buttons.json', JSON.stringify(buttons, null, 2));
            console.log('\nAll buttons/links:');
            buttons.forEach((b, i) => {
              if (b.txt || b.href) {
                console.log(` [${i}] ${b.tag} txt="${b.txt}" href="${b.href.slice(0,80)}" cls="${b.cls.slice(0,40)}"`);
              }
            });

            // فقط روی اولین "extract links" کلیک کن
            const extractBtn = await page.$('button:has-text("Extract"), a:has-text("Extract"), button:has-text("extract"), a:has-text("extract")');

            if (extractBtn) {
              console.log('\nClicking first Extract button...');

              // network log reset برای بعد از کلیک
              const networkBefore = networkLog.length;

              await extractBtn.click().catch(() => {});

              // صبر می‌کنیم و هر ثانیه چک می‌کنیم
              for (let i = 0; i < 20; i++) {
                await page.waitForTimeout(1000);

                const newRequests = networkLog.slice(networkBefore).filter(e =>
                  e.type === 'REQUEST' || e.type === 'RESPONSE'
                );

                if (newRequests.length > 0) {
                  console.log(`\nSecond ${i+1}: ${newRequests.length} new network events`);
                  newRequests.forEach(r => {
                    console.log(`  ${r.type} ${r.status || ''} ${r.url}`);
                    if (r.body) console.log(`  BODY: ${r.body.slice(0, 300)}`);
                  });
                }

                // HTML تغییر کرده؟
                const htmlNow = await page.content();
                if (htmlNow.length !== htmlBefore.length) {
                  console.log(`\nDOM changed at second ${i+1}! Size: ${htmlBefore.length} -> ${htmlNow.length}`);
                  fs.writeFileSync(`grabbed/html_after_${i+1}s.txt`, htmlNow);

                  // لینک‌های جدید
                  const allLinks = [...htmlNow.matchAll(/https?:\/\/[^\s"'<>]+\.(mp4|m3u8|mkv|webm)/gi)];
                  if (allLinks.length > 0) {
                    console.log('VIDEO LINKS FOUND IN HTML:');
                    allLinks.forEach(m => console.log(' ', m[0]));
                    break;
                  }
                }
              }

            } else {
              console.log('No Extract button found!');
            }

            // network log کامل
            fs.writeFileSync('grabbed/network_log.json', JSON.stringify(networkLog, null, 2));
            console.log('\nNetwork log entries:', networkLog.length);

            // فقط JSON responses رو نشون بده
            const jsonResponses = networkLog.filter(e => e.body);
            console.log('JSON responses:', jsonResponses.length);
            jsonResponses.forEach(r => {
              console.log('\n---');
              console.log('URL:', r.url);
              console.log('Body:', r.body.slice(0, 500));
            });

            await browser.close();

          })();

          EOF

      - name: Run debug script
        run: node debug.js "${{ github.event.inputs.source_url }}"

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: grabbed/
