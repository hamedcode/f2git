name: 6 - 9xBuddy Downloader

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: "9xbuddy process URL (e.g. https://9xbuddy.site/process?url=...)"
        required: true

      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip curl aria2 jq gh
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: |
          mkdir -p downloads
          mkdir -p grabbed

      - name: Create Playwright script
        run: |
          cat > buddy_dl.js << 'EOF'

          const fs   = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const PAGE_URL = process.argv[2];
          if (!PAGE_URL) { console.error('No URL'); process.exit(1); }

          function sanitize(str) {
            return (str || 'video')
              .replace(/[^a-zA-Z0-9 ._-]/g, '_')
              .replace(/[_ ]+/g, '_')
              .replace(/^_|_$/g, '')
              .slice(0, 80) || 'video';
          }

          // domains that are NOT video files — skip these
          const JUNK_DOMAINS = [
            '123sudo.com', 'offmp3.com', 'savegif.com',
            '9xbuddy.site', '9xbuddy.org', '9xbuddy.app',
            'google.com', 'facebook.com', 'twitter.com'
          ];

          function isJunk(url) {
            try {
              const host = new URL(url).hostname;
              return JUNK_DOMAINS.some(d => host.includes(d));
            } catch { return true; }
          }

          function isVideoUrl(url) {
            return /\.(mp4|m3u8|mkv|avi|mov|webm|vid)(\?|$)/i.test(url.split('?')[0]);
          }

          (async () => {

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent:
                'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
                'AppleWebKit/537.36 (KHTML, like Gecko) ' +
                'Chrome/122.0.0.0 Safari/537.36',
              acceptDownloads: true
            });

            const page = await context.newPage();

            // intercept network responses to catch video URLs
            const intercepted = [];
            page.on('response', async (response) => {
              try {
                const u  = response.url();
                const ct = response.headers()['content-type'] || '';
                if (
                  (isVideoUrl(u) || ct.startsWith('video/')) &&
                  !isJunk(u) &&
                  !intercepted.includes(u)
                ) {
                  console.log('INTERCEPTED:', u);
                  intercepted.push(u);
                }
              } catch (e) {}
            });

            console.log('Opening:', PAGE_URL);
            await page.goto(PAGE_URL, { waitUntil: 'networkidle', timeout: 60000 });

            console.log('Waiting for page to render...');
            try {
              await page.waitForSelector('a[href], button', { timeout: 20000 });
            } catch (e) {}
            await page.waitForTimeout(4000);

            const rawTitle = (await page.title()).trim();
            const title    = sanitize(rawTitle);
            console.log('TITLE:', rawTitle, '->', title);

            // collect direct .mp4 links from DOM (before any clicks)
            const domVideoUrls = await page.$$eval('a', els =>
              els.map(a => a.href || '').filter(Boolean)
            ).then(hrefs => hrefs.filter(h => !isJunk(h) && isVideoUrl(h)));

            console.log('DOM video links:', domVideoUrls.length);

            // click only buttons whose text says "download" but NOT "app"/"software"/"extension"
            const buttons = await page.$$('a, button');
            const clickedUrls = [];

            for (const btn of buttons) {
              try {
                const txt  = (await btn.innerText()).trim().toLowerCase();
                const href = (await btn.getAttribute('href') || '').toLowerCase();

                // skip "download app / download software / download extension"
                if (/app|software|extension|program/.test(txt)) continue;

                if (!txt.includes('download') && !href.includes('download')) continue;

                // if it's already a direct video link, grab it without clicking
                const fullHref = (await btn.getAttribute('href')) || '';
                if (fullHref.startsWith('http') && isVideoUrl(fullHref) && !isJunk(fullHref)) {
                  if (!clickedUrls.includes(fullHref)) {
                    console.log('Direct href:', fullHref);
                    clickedUrls.push(fullHref);
                  }
                  continue;
                }

                console.log('Clicking:', txt || href);

                // open in new tab so we don't navigate away
                const [newPage] = await Promise.all([
                  context.waitForEvent('page', { timeout: 12000 }).catch(() => null),
                  btn.click({ modifiers: ['Meta'] }).catch(async () => {
                    await btn.click().catch(() => {});
                  })
                ]);

                // wait for anti-bot spinner (9xbuddy ~3-8s)
                await page.waitForTimeout(10000);

                if (newPage) {
                  try {
                    await newPage.waitForLoadState('networkidle', { timeout: 15000 });
                    const u = newPage.url();
                    if (u && u !== 'about:blank' && !isJunk(u)) {
                      console.log('NEW TAB:', u);
                      if (!clickedUrls.includes(u)) clickedUrls.push(u);
                    }
                    await newPage.close();
                  } catch (e) { try { await newPage.close(); } catch {} }
                }

                // re-check href after click (9xbuddy sometimes updates it)
                const newHref = (await btn.getAttribute('href').catch(() => '')) || '';
                if (newHref.startsWith('http') && isVideoUrl(newHref) && !isJunk(newHref)) {
                  if (!clickedUrls.includes(newHref)) {
                    console.log('RESOLVED after click:', newHref);
                    clickedUrls.push(newHref);
                  }
                }

              } catch (e) {}
            }

            // merge: intercepted first (most trustworthy), then DOM, then clicked
            const allUrls = [
              ...intercepted,
              ...domVideoUrls,
              ...clickedUrls.filter(u => isVideoUrl(u) && !isJunk(u))
            ].filter((u, i, arr) => u && arr.indexOf(u) === i);

            console.log('\nCandidate URLs:', allUrls.length);
            allUrls.forEach((u, i) => console.log(` [${i+1}] ${u}`));

            if (allUrls.length === 0) {
              console.error('No video URLs found!');
              await browser.close();
              process.exit(1);
            }

            // --- download using Playwright's own request context ---
            // This carries the exact same session (cookies, headers) as the browser
            let downloaded = false;

            for (const url of allUrls) {

              console.log('\n========================================');
              console.log('TRYING:', url);
              console.log('========================================');

              const extMatch = url.split('?')[0].match(/\.(mp4|m3u8|mkv|avi|mov|webm|vid)$/i);
              let ext = extMatch ? extMatch[1].toLowerCase() : 'mp4';
              if (ext === 'vid') ext = 'mp4';

              if (ext === 'm3u8') {
                // HLS: hand off to ffmpeg — write cookies separately
                const cookies  = await context.cookies();
                const cookieStr = cookies.map(c => `${c.name}=${c.value}`).join('; ');
                fs.writeFileSync('grabbed/hls_url.txt',     url);
                fs.writeFileSync('grabbed/hls_title.txt',   title);
                fs.writeFileSync('grabbed/hls_cookies.txt', cookieStr);
                console.log('HLS — will use ffmpeg');
                downloaded = true;
                break;
              }

              const destPath = path.join('downloads', `${title}.${ext}`);

              try {

                // page.request keeps the same browser session (IP, TLS fingerprint, cookies)
                const response = await page.request.get(url, {
                  headers: {
                    'Referer':        'https://9xbuddy.site/',
                    'Origin':         'https://9xbuddy.site',
                    'Accept':         '*/*',
                    'Accept-Language':'en-US,en;q=0.9',
                  },
                  timeout: 0   // no timeout for large files
                });

                console.log('Status:', response.status());

                if (!response.ok()) {
                  console.log('SKIP: non-200 status', response.status());
                  continue;
                }

                const body = await response.body();

                if (body.length < 1_048_576) {
                  console.log(`SKIP: too small (${body.length} bytes)`);
                  continue;
                }

                fs.writeFileSync(destPath, body);
                console.log(`SUCCESS: ${(body.length/1024/1024).toFixed(1)} MB -> ${destPath}`);
                downloaded = true;
                break;

              } catch (err) {
                console.log('FAILED:', err.message);
              }
            }

            await browser.close();

            if (!downloaded) {
              console.error('All URLs failed!');
              process.exit(1);
            }

          })();

          EOF

      - name: Run Playwright
        run: |
          node buddy_dl.js "${{ github.event.inputs.page_url }}"

      - name: Download HLS if needed
        run: |
          if [ -f grabbed/hls_url.txt ]; then
            url=$(cat grabbed/hls_url.txt)
            title=$(cat grabbed/hls_title.txt)
            cookies=$(cat grabbed/hls_cookies.txt)
            echo "HLS download: $url"
            ffmpeg -y \
              -user_agent "Mozilla/5.0" \
              -headers "Cookie: ${cookies}" \
              -i "$url" \
              -c copy \
              "downloads/${title}.mp4"
          else
            echo "No HLS — skipping"
          fi

      - name: Show results
        run: |
          echo "=== downloads/ ==="
          ls -lh downloads/ || echo "(empty)"

      - name: Create ZIP
        if: github.event.inputs.upload_mode == 'zip'
        run: |
          ts=$(date +"%Y%m%d_%H%M%S")
          zip -r \
            -P "${{ secrets.ZIP_PASSWORD }}" \
            "buddy_media_${ts}.zip" \
            downloads/

      - name: Delete old releases
        if: github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --limit 100 | awk '{print $1}')
          for tag in $releases; do
            gh release delete "$tag" -y || true
          done

      - name: Upload Direct Release
        if: github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "downloads/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP Release
        if: github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buddy-${{ github.run_number }}
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
