name: 7. Build Demo Clips

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip curl

      - name: Create Demo Videos
        shell: bash
        run: |
          set +e

          mkdir -p demos
          mkdir -p work

          while IFS= read -r url || [ -n "$url" ]; do

            url="$(echo "$url" | xargs)"

            [[ -z "$url" ]] && continue

            echo "========================================"
            echo "Processing:"
            echo "$url"
            echo "========================================"

            filename=$(basename "${url%%\?*}")

            echo "Downloading..."

            curl -L --fail --retry 3 \
              -o "$filename" \
              "$url"

            curl_exit=$?

            if [[ $curl_exit -ne 0 ]]; then
              echo "Download failed (exit $curl_exit), skipping..."
              continue
            fi

            if [[ ! -f "$filename" ]]; then
              echo "File not found after download, skipping..."
              continue
            fi

            duration=$(ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$filename")

            if [[ -z "$duration" || "$duration" == "N/A" ]]; then
              echo "Could not read duration, skipping..."
              rm -f "$filename"
              continue
            fi

            echo "Duration: $duration seconds"

            duration_int=${duration%.*}

            # Calculate dynamic start times: 25%, 50%, 75% of total duration
            # Leave at least 20 seconds before end for the segment
            start1=$(( duration_int * 25 / 100 ))
            start2=$(( duration_int * 50 / 100 ))
            start3=$(( duration_int * 75 / 100 ))

            # Clamp each start so the 20s segment doesn't exceed video length
            max_start=$(( duration_int - 20 ))
            [[ $max_start -lt 0 ]] && max_start=0

            [[ $start1 -gt $max_start ]] && start1=$max_start
            [[ $start2 -gt $max_start ]] && start2=$max_start
            [[ $start3 -gt $max_start ]] && start3=$max_start

            echo "Segment starts (seconds): $start1 | $start2 | $start3"

            base="${filename%.*}"
            ext="${filename##*.}"

            mkdir -p "work/$base"

            extract_segment() {
              local start_sec="$1"
              local output="$2"

              if (( start_sec >= duration_int )); then
                echo "Skipping segment at ${start_sec}s (beyond video length)"
                return
              fi

              ffmpeg -y \
                -ss "$start_sec" \
                -i "$filename" \
                -t 20 \
                -c copy \
                "$output"

              local ffmpeg_exit=$?
              if [[ $ffmpeg_exit -ne 0 ]]; then
                echo "ffmpeg failed for segment at ${start_sec}s (exit $ffmpeg_exit)"
                rm -f "$output"
              fi
            }

            extract_segment "$start1" "work/$base/part1.$ext"
            extract_segment "$start2" "work/$base/part2.$ext"
            extract_segment "$start3" "work/$base/part3.$ext"

            list_file="work/$base/list.txt"
            rm -f "$list_file"

            for part in \
              "part1.$ext" \
              "part2.$ext" \
              "part3.$ext"
            do
              if [[ -f "work/$base/$part" ]]; then
                echo "file '$part'" >> "$list_file"
              fi
            done

            if [[ ! -s "$list_file" ]]; then
              echo "No valid segments found, skipping..."
              rm -f "$filename"
              continue
            fi

            echo "Creating demo..."

            (
              cd "work/$base"

              ffmpeg -y \
                -f concat \
                -safe 0 \
                -i list.txt \
                -c copy \
                "../../demos/${base}_demo.${ext}"
            )

            concat_exit=$?

            if [[ $concat_exit -ne 0 ]]; then
              echo "Concat failed for $base (exit $concat_exit)"
            else
              echo "Demo created: demos/${base}_demo.${ext}"
            fi

            rm -f "$filename"

          done < link.txt

      - name: Check Demo Files
        run: |
          count=$(find demos -type f | wc -l)

          echo "Demo files: $count"

          if [ "$count" -eq 0 ]; then
            echo "No demo files created."
            exit 1
          fi

      - name: Create ZIP Archive
        run: |
          cd demos
          zip -r ../demo_videos.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-${{ github.run_number }}
          name: Demo Videos ${{ github.run_number }}
          files: demo_videos.zip
          generate_release_notes: true
