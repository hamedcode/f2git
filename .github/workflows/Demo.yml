name: 7. Build Demo Clips

on:
  workflow_dispatch:
    inputs:
      parts:
        description: "تعداد پارت نمونه از هر ویدیو (Number of parts per video)"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
          - "8"
          - "10"
      length:
        description: "طول هر پارت به ثانیه (Length of each part in seconds)"
        required: true
        default: "20"
        type: choice
        options:
          - "5"
          - "10"
          - "15"
          - "20"
          - "30"
          - "45"
          - "60"

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip curl

      - name: Create Demo Videos
        shell: bash
        env:
          PARTS: ${{ inputs.parts }}
          SEG_LEN: ${{ inputs.length }}
        run: |
          set +e

          PARTS="${PARTS:-3}"
          SEG_LEN="${SEG_LEN:-20}"

          echo "Settings: $PARTS part(s) x ${SEG_LEN}s per video"

          mkdir -p demos
          mkdir -p work

          while IFS= read -r url || [ -n "$url" ]; do

            url="$(echo "$url" | xargs)"

            [[ -z "$url" ]] && continue

            echo "========================================"
            echo "Processing:"
            echo "$url"
            echo "========================================"

            filename=$(basename "${url%%\?*}")

            echo "Downloading..."

            curl -L --fail --retry 3 \
              -o "$filename" \
              "$url"

            curl_exit=$?

            if [[ $curl_exit -ne 0 ]]; then
              echo "Download failed (exit $curl_exit), skipping..."
              continue
            fi

            if [[ ! -f "$filename" ]]; then
              echo "File not found after download, skipping..."
              continue
            fi

            duration=$(ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$filename")

            if [[ -z "$duration" || "$duration" == "N/A" ]]; then
              echo "Could not read duration, skipping..."
              rm -f "$filename"
              continue
            fi

            echo "Duration: $duration seconds"

            duration_int=${duration%.*}

            # Last allowed start so a segment doesn't run past the end
            max_start=$(( duration_int - SEG_LEN ))
            [[ $max_start -lt 0 ]] && max_start=0

            base="${filename%.*}"
            ext="${filename##*.}"

            mkdir -p "work/$base"

            list_file="work/$base/list.txt"
            rm -f "$list_file"

            last_start=-1
            starts_log=""

            # Evenly spaced starts: i/(PARTS+1) of the duration
            # (PARTS=3 gives 25% / 50% / 75%, same as before)
            for (( i=1; i<=PARTS; i++ )); do

              start=$(( duration_int * i / (PARTS + 1) ))
              [[ $start -gt $max_start ]] && start=$max_start

              # Skip duplicate starts (short videos get clamped to the same point)
              if [[ $start -eq $last_start ]]; then
                echo "Skipping part $i (same start as previous: ${start}s)"
                continue
              fi
              last_start=$start

              part="part${i}.${ext}"
              starts_log="$starts_log ${start}s"

              ffmpeg -nostdin -y \
                -ss "$start" \
                -i "$filename" \
                -t "$SEG_LEN" \
                -c copy \
                "work/$base/$part"

              ffmpeg_exit=$?

              if [[ $ffmpeg_exit -ne 0 ]]; then
                echo "ffmpeg failed for part $i at ${start}s (exit $ffmpeg_exit)"
                rm -f "work/$base/$part"
                continue
              fi

              echo "file '$part'" >> "$list_file"

            done

            echo "Segment starts:$starts_log"

            if [[ ! -s "$list_file" ]]; then
              echo "No valid segments found, skipping..."
              rm -f "$filename"
              continue
            fi

            echo "Creating demo..."

            (
              cd "work/$base"

              ffmpeg -nostdin -y \
                -f concat \
                -safe 0 \
                -i list.txt \
                -c copy \
                "../../demos/${base}_demo.${ext}"
            )

            concat_exit=$?

            if [[ $concat_exit -ne 0 ]]; then
              echo "Concat failed for $base (exit $concat_exit)"
            else
              echo "Demo created: demos/${base}_demo.${ext}"
            fi

            rm -f "$filename"

          done < link.txt

      - name: Check Demo Files
        run: |
          count=$(find demos -type f | wc -l)

          echo "Demo files: $count"

          if [ "$count" -eq 0 ]; then
            echo "No demo files created."
            exit 1
          fi

      - name: Create ZIP Archive
        run: |
          cd demos
          zip -r ../demo_videos.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-${{ github.run_number }}
          name: Demo Videos ${{ github.run_number }}
          files: demo_videos.zip
          generate_release_notes: true
