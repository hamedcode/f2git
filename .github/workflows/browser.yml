name: 5 - Browser Downloader

on:
  workflow_dispatch:
    inputs:
      preferred_quality:
        description: "Preferred quality"
        required: true
        default: "720"
        type: choice
        options:
          - "480"
          - "720"
          - "1080"

      min_size_mb:
        description: "Minimum video size in MB"
        required: true
        default: "20"

      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "zip"
          - "direct"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  browser-download:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            zip \
            curl \
            wget \
            aria2 \
            jq \
            gh

          npm init -y
          npm install playwright

          npx playwright install chromium

      - name: Prepare folders
        run: |
          mkdir -p downloads
          mkdir -p grabbed
          touch grabbed/failed_pages.txt

      - name: Create Playwright script
        run: |
          cat > browser_dl.js << 'EOF'

          const fs = require('fs');
          const { chromium } = require('playwright');

          (async () => {

            const browser = await chromium.launch({
              headless: true
            });

            const context = await browser.newContext({
              userAgent:
                'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122 Safari/537.36'
            });

            const page = await context.newPage();

            const foundGlobal = new Set();

            const urls = fs
              .readFileSync('browser.txt', 'utf8')
              .split('\n')
              .map(v => v.trim())
              // skip blank lines AND lines already marked as failed (# comments)
              .filter(v => v && !v.startsWith('#'));

            for (const pageUrl of urls) {

              console.log('OPENING:', pageUrl);

              // collect links found during THIS page load
              const pageLinks = [];

              const onResponse = async (response) => {
                try {
                  const url = response.url();
                  if (
                    url.includes('.mp4') ||
                    url.includes('.m3u8') ||
                    url.includes('.vid')
                  ) {
                    const clean = url.split('?')[0];
                    if (foundGlobal.has(clean)) return;
                    foundGlobal.add(clean);
                    console.log('FOUND:', url);
                    pageLinks.push(url);
                  }
                } catch (e) {}
              };

              page.on('response', onResponse);

              try {

                await page.goto(pageUrl, {
                  waitUntil: 'networkidle',
                  timeout: 120000
                });

                await page.waitForTimeout(15000);

                // title is read AFTER the page has fully settled
                const title = (await page.title()).trim() || 'video';
                console.log('TITLE:', title);

                if (pageLinks.length === 0) {
                  // nothing found on this page at all -> mark as failed right away
                  console.log('NO MEDIA FOUND on this page');
                  fs.appendFileSync(
                    'grabbed/failed_pages.txt',
                    pageUrl + '|||no_media_found\n'
                  );
                } else {
                  // write all links found on this page, tagged with their source
                  // page URL so later steps can select ONE best link PER PAGE
                  // instead of a global top-N across all pages
                  for (const link of pageLinks) {
                    fs.appendFileSync(
                      'grabbed/raw_links.txt',
                      pageUrl + '|||' + title + '|||' + link + '\n'
                    );
                  }
                }

              } catch (e) {
                console.log('ERROR:', e);
                fs.appendFileSync(
                  'grabbed/failed_pages.txt',
                  pageUrl + '|||page_error\n'
                );
              }

              page.off('response', onResponse);

            }

            await browser.close();

          })();

          EOF

      - name: Run Playwright
        run: |
          node browser_dl.js

      - name: Analyze links
        env:
          QUALITY: ${{ github.event.inputs.preferred_quality }}
          MIN_SIZE: ${{ github.event.inputs.min_size_mb }}
        run: |

          touch grabbed/final_links.txt

          python3 << 'EOF'

          import requests
          import os

          quality = os.environ["QUALITY"]
          min_size = int(os.environ["MIN_SIZE"]) * 1024 * 1024

          # group raw candidate links by the SOURCE PAGE they came from, so we
          # pick one best-matching link PER PAGE instead of a single global
          # top-N across every page combined (that was the bug: it silently
          # dropped every page beyond the first couple).
          pages = {}

          if os.path.exists("grabbed/raw_links.txt"):
              with open("grabbed/raw_links.txt", "r", encoding="utf-8") as f:
                  raw_lines = [x.rstrip("\n") for x in f if x.strip()]
          else:
              raw_lines = []

          for entry in raw_lines:
              parts = entry.split("|||", 2)
              if len(parts) == 3:
                  page_url, title, url = parts
              elif len(parts) == 2:
                  # backward-compat, shouldn't normally happen
                  page_url, url = parts
                  title = "video"
              else:
                  continue
              pages.setdefault(page_url, []).append((title, url))

          final = []

          with open("grabbed/failed_pages.txt", "a", encoding="utf-8") as failed_f:

              for page_url, entries in pages.items():

                  checked = []
                  seen_sizes = []  # duplicate-size check scoped to THIS page only

                  for title, url in entries:

                      try:

                          r = requests.head(
                              url,
                              allow_redirects=True,
                              timeout=20,
                              headers={
                                  "User-Agent": "Mozilla/5.0"
                              }
                          )

                          size = int(r.headers.get("content-length", 0))

                          print(f"CHECK: {size/1024/1024:.1f} MB -> {url}")

                          if size < min_size:
                              print("SKIP: too small")
                              continue

                          duplicate = False

                          for s in seen_sizes:
                              diff = abs(size - s)

                              if diff < (s * 0.02):
                                  duplicate = True
                                  break

                          if duplicate:
                              print("SKIP: duplicate size (mirror on same page)")
                              continue

                          seen_sizes.append(size)

                          score = 999

                          url_lower = url.lower()

                          if quality in url_lower:
                              score = 1
                          elif "480" in url_lower:
                              score = 2
                          elif "720" in url_lower:
                              score = 3
                          elif "1080" in url_lower:
                              score = 4
                          else:
                              score = 10

                          checked.append({
                              "url": url,
                              "title": title,
                              "size": size,
                              "score": score
                          })

                      except Exception as e:
                          print("ERROR:", e)

                  if not checked:
                      print(f"NO VALID CANDIDATE for page: {page_url}")
                      failed_f.write(page_url + "|||no_valid_candidate\n")
                      continue

                  checked.sort(key=lambda x: (x["score"], x["size"]))
                  best = checked[0]
                  print("SELECTED:", best["url"], "  (page:", page_url, ")")

                  final.append((page_url, best["title"], best["url"]))

          with open("grabbed/final_links.txt", "w", encoding="utf-8") as f:
              for page_url, title, url in final:
                  f.write(page_url + "|||" + title + "|||" + url + "\n")

          print(f"\nPages with links found: {len(pages)} | selected for download: {len(final)}")

          EOF

      - name: Download videos
        run: |

          if [ ! -f grabbed/final_links.txt ]; then
            echo "No links found"
            exit 1
          fi

          counter=1

          while IFS= read -r entry; do

            [ -z "$entry" ] && continue

            # split on ||| -> pageUrl|||title|||mediaUrl
            pageUrl="${entry%%|||*}"
            rest="${entry#*|||}"
            title="${rest%%|||*}"
            url="${rest#*|||}"

            # sanitize title:
            #   1. replace any char that is NOT alphanumeric, space, dot, dash, underscore with _
            #   2. collapse multiple underscores/spaces into one underscore
            #   3. strip leading/trailing underscores
            #   4. limit to 80 characters
            safe_title=$(echo "$title" \
              | sed 's/[^a-zA-Z0-9 ._-]/_/g' \
              | sed 's/[_ ]\+/_/g' \
              | sed 's/^_//;s/_$//' \
              | cut -c1-80)

            [ -z "$safe_title" ] && safe_title="video_${counter}"

            echo ""
            echo "================================"
            echo "PAGE:        $pageUrl"
            echo "DOWNLOADING: $url"
            echo "FILENAME:    $safe_title"
            echo "================================"

            clean_url=$(echo "$url" | cut -d'?' -f1)

            ext=$(echo "$clean_url" | grep -oE '\.(mp4|m3u8|vid)' | head -1 | tr -d '.')

            # treat .vid as mp4
            if [[ "$ext" == "vid" ]]; then
              ext="mp4"
            fi

            success=0

            if [[ "$ext" == "m3u8" ]]; then

              echo "[FFMPEG] downloading m3u8"

              ffmpeg \
                -y \
                -user_agent "Mozilla/5.0" \
                -i "$url" \
                -c copy \
                "downloads/${safe_title}.mp4"

              [ $? -eq 0 ] && success=1

            else

              echo "[ARIA2] trying download..."

              aria2c \
                -x 16 \
                -s 16 \
                -k 1M \
                -c \
                --summary-interval=0 \
                --download-result=hide \
                --console-log-level=warn \
                --dir=downloads \
                --out="${safe_title}.${ext:-mp4}" \
                "$url"

              result=$?

              if [ $result -eq 0 ]; then
                success=1
              else

                echo "[CURL FALLBACK] aria2 failed"

                curl -L \
                  --retry 5 \
                  --connect-timeout 30 \
                  -A "Mozilla/5.0" \
                  -o "downloads/${safe_title}.${ext:-mp4}" \
                  "$url"

                [ $? -eq 0 ] && success=1

              fi

            fi

            if [ "$success" -ne 1 ]; then
              echo "DOWNLOAD FAILED for: $pageUrl"
              echo "${pageUrl}|||download_failed" >> grabbed/failed_pages.txt
            fi

            counter=$((counter+1))

          done < grabbed/final_links.txt

      - name: Mark failed links in browser.txt
        if: always()
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |

          python3 << 'EOF'

          import os
          from datetime import datetime, timezone

          run_number = os.environ.get("RUN_NUMBER", "")
          run_date = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          # collect every reason recorded for a failed page across all steps
          # (no media found on page / no valid quality candidate / actual
          # download error) into a single lookup
          failed = {}
          if os.path.exists("grabbed/failed_pages.txt"):
              with open("grabbed/failed_pages.txt", "r", encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if not line or "|||" not in line:
                          continue
                      u, reason = line.split("|||", 1)
                      failed[u.strip()] = reason.strip()

          if not os.path.exists("browser.txt"):
              print("browser.txt not found, nothing to update")
              raise SystemExit(0)

          with open("browser.txt", "r", encoding="utf-8") as f:
              orig_lines = f.readlines()

          new_lines = []
          removed = 0
          marked = 0

          for line in orig_lines:
              stripped = line.strip()

              # keep blank lines and existing comments untouched
              if not stripped or stripped.startswith("#"):
                  new_lines.append(line if line.endswith("\n") else line + "\n")
                  continue

              if stripped in failed:
                  reason = failed[stripped]
                  new_lines.append(
                      f"# FAILED [{reason}] ({run_date}, run #{run_number}): {stripped}\n"
                  )
                  marked += 1
              else:
                  # not in the failed list -> it downloaded successfully this
                  # run, so drop it (no need to keep re-downloading it)
                  removed += 1

          with open("browser.txt", "w", encoding="utf-8") as f:
              f.writelines(new_lines)

          print(f"browser.txt updated: {removed} completed link(s) removed, {marked} failed link(s) marked")

          EOF

      - name: Commit updated browser.txt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add browser.txt

          if git diff --cached --quiet; then
            echo "No changes to browser.txt"
          else
            git commit -m "chore(browser): mark failed / remove completed links [run ${{ github.run_number }}]"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}" || git rebase --abort
            git push origin HEAD:"${{ github.ref_name }}"
          fi

      - name: Create ZIP
        if: github.event.inputs.upload_mode == 'zip'
        run: |

          ts=$(date +"%Y%m%d_%H%M%S")

          zip -r \
            -P "${{ secrets.ZIP_PASSWORD }}" \
            "browser_media_${ts}.zip" \
            downloads/

      - name: Delete old releases
        if: github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          releases=$(gh release list --limit 100 | awk '{print $1}')

          for tag in $releases; do
            gh release delete "$tag" -y || true
          done

      - name: Upload ZIP Release
        if: github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: browser-${{ github.run_number }}
          files: "*.zip"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Direct Video Release
        if: github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: browser-${{ github.run_number }}
          files: "downloads/*"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
