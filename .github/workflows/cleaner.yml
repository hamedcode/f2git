```yaml
name: Cleaner

on:
  workflow_dispatch:
    inputs:

      # ==========================================
      # FILE HISTORY
      # ==========================================

      link:
        description: "Clean history of link.txt"
        required: true
        type: boolean
        default: false

      yt:
        description: "Clean history of yt.txt"
        required: true
        type: boolean
        default: false

      browser:
        description: "Clean history of browser.txt"
        required: true
        type: boolean
        default: false


      # ==========================================
      # WORKFLOW RUN HISTORY
      # ==========================================

      workflow_9xb:
        description: "Delete previous runs of 9xb.yml"
        required: true
        type: boolean
        default: false

      workflow_demo:
        description: "Delete previous runs of Demo.yml"
        required: true
        type: boolean
        default: false

      workflow_browser:
        description: "Delete previous runs of browser.yml"
        required: true
        type: boolean
        default: false

      workflow_cleaner:
        description: "Delete previous runs of cleaner.yml"
        required: true
        type: boolean
        default: false

      workflow_gofile:
        description: "Delete previous runs of gofile.yml"
        required: true
        type: boolean
        default: false

      workflow_zip:
        description: "Delete previous runs of zip.yml"
        required: true
        type: boolean
        default: false

      workflow_old_browser:
        description: "Delete previous runs of old_browser.yml"
        required: true
        type: boolean
        default: false

      workflow_send_to_telegram:
        description: "Delete previous runs of send_to_telegram.yml"
        required: true
        type: boolean
        default: false

      workflow_yt_dlp:
        description: "Delete previous runs of yt-dlp.yml"
        required: true
        type: boolean
        default: false

      workflow_zip_all:
        description: "Delete previous runs of zip-all.yml"
        required: true
        type: boolean
        default: false


permissions:
  contents: write
  actions: write


jobs:
  clean:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true


      # ==========================================
      # SAVE SELECTED FILES
      # ==========================================

      - name: Save selected files
        run: |
          mkdir -p /tmp/selected-files

          if [ "${{ inputs.link }}" = "true" ]; then
            if [ ! -f "link.txt" ]; then
              echo "ERROR: link.txt not found!"
              exit 1
            fi

            cp "link.txt" "/tmp/selected-files/link.txt"
          fi

          if [ "${{ inputs.yt }}" = "true" ]; then
            if [ ! -f "yt.txt" ]; then
              echo "ERROR: yt.txt not found!"
              exit 1
            fi

            cp "yt.txt" "/tmp/selected-files/yt.txt"
          fi

          if [ "${{ inputs.browser }}" = "true" ]; then
            if [ ! -f "browser.txt" ]; then
              echo "ERROR: browser.txt not found!"
              exit 1
            fi

            cp "browser.txt" "/tmp/selected-files/browser.txt"
          fi


      # ==========================================
      # CHECK FILE SELECTION
      # ==========================================

      - name: Check file selection
        run: |
          if [ -z "$(ls -A /tmp/selected-files 2>/dev/null)" ]; then
            echo "No file history cleanup selected."
          else
            echo "Selected files:"
            ls -1 /tmp/selected-files
          fi


      # ==========================================
      # INSTALL GIT-FILTER-REPO
      # ==========================================

      - name: Install git-filter-repo
        if: |
          inputs.link == true ||
          inputs.yt == true ||
          inputs.browser == true
        run: |
          python3 -m pip install git-filter-repo


      # ==========================================
      # REMOVE SELECTED FILES FROM GIT HISTORY
      # ==========================================

      - name: Remove selected files from Git history
        if: |
          inputs.link == true ||
          inputs.yt == true ||
          inputs.browser == true
        run: |
          FILES=""

          if [ "${{ inputs.link }}" = "true" ]; then
            FILES="$FILES --path link.txt"
          fi

          if [ "${{ inputs.yt }}" = "true" ]; then
            FILES="$FILES --path yt.txt"
          fi

          if [ "${{ inputs.browser }}" = "true" ]; then
            FILES="$FILES --path browser.txt"
          fi

          git filter-repo \
            $FILES \
            --invert-paths \
            --force


      # ==========================================
      # RESTORE CURRENT FILES
      # ==========================================

      - name: Restore selected files
        if: |
          inputs.link == true ||
          inputs.yt == true ||
          inputs.browser == true
        run: |
          for file in /tmp/selected-files/*; do
            filename=$(basename "$file")

            cp "$file" "$filename"
            git add "$filename"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Restore selected files"


      # ==========================================
      # RESTORE ORIGIN
      # ==========================================

      - name: Restore GitHub remote
        if: |
          inputs.link == true ||
          inputs.yt == true ||
          inputs.browser == true
        run: |
          git remote remove origin 2>/dev/null || true

          git remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"


      # ==========================================
      # PUSH REWRITTEN HISTORY
      # ==========================================

      - name: Push rewritten Git history
        if: |
          inputs.link == true ||
          inputs.yt == true ||
          inputs.browser == true
        run: |
          git push origin "${{ github.ref_name }}" --force


      # ==========================================
      # DELETE WORKFLOW RUNS
      # ==========================================

      - name: Delete selected workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          # --------------------------------------
          # 9xb.yml
          # --------------------------------------

          if [ "${{ inputs.workflow_9xb }}" = "true" ]; then

            echo "Deleting previous runs of 9xb.yml"

            gh run list \
              --workflow="9xb.yml" \
              --limit 1000 \
              --json databaseId \
              --jq '.[].databaseId' |
            while read RUN_ID; do

              if [ "$RUN_ID" != "${{ github.run_id }}" ]; then
                gh run delete "$RUN_ID" \
                  --repo "${{ github.repository }}" || true
              fi

            done

          fi


          # --------------------------------------
          # Demo.yml
          # --------------------------------------

          if [ "${{ inputs.workflow_demo }}" = "true" ]; then

            echo "Deleting previous runs of Demo.yml"

            gh run list \
              --workflow="Demo.yml" \
              --limit 1000 \
              --json databaseId \
              --jq '.[].databaseId' |
            while read RUN_ID; do

              if [ "$RUN_ID" != "${{ github.run_id }}" ]; then
                gh run delete "$RUN_ID" \
                  --repo "${{ github.repository }}" || true
              fi

            done

          fi


          # --------------------------------------
          # browser.yml
          # --------------------------------------

          if [ "${{ inputs.workflow_browser }}" = "true" ]; then

            echo "Deleting previous runs of browser.yml"

            gh run list \
              --workflow="browser.yml" \
              --limit 1000 \
              --json databaseId \
              --jq '.[].databaseId' |
            while read RUN_ID; do

              if [ "$RUN_ID" != "${{ github.run_id }}" ]; then
                gh run delete "$RUN_ID" \
                  --repo "${{ github.repository }}" || true
              fi

            done

          fi


          # --------------------------------------
          # cleaner.yml
          # --------------------------------------

          if [ "${{ inputs.workflow_cleaner }}" = "true" ]; then

            echo "Deleting previous runs of cleaner.yml"

            gh run list \
              --workflow="cleaner.yml" \
              --limit 1000 \
              --json databaseId \
              --jq '.[].databaseId' |
            while read RUN_ID; do

              if [ "$RUN_ID" != "${{ github.run_id }}" ]; then
                gh run delete "$RUN_ID" \
                  --repo "${{ github.repository }}" || true
              fi

            done

          fi


          # --------------------------------------
          # gofile.yml
          # --------------------------------------

          if [ "${{ inputs.workflow_gofile }}" = "true" ]; then

            echo "Deleting previous runs of gofile.yml"

            gh run list \
              --workflow="gofile.yml" \
              --limit 1000 \
              --json databaseId \
              --jq '.[].databaseId' |
            while read RUN_ID; do

              if [ "$RUN_ID" != "${{ github.run_id }}" ]; then
                gh run delete "$RUN_ID" \
                  --repo "${{ github.repository }}" || true
              fi

            done

          fi


          # --------------------------------------
          # zip.yml
          # --------------------------------------

          if [ "${{ inputs.workflow_zip }}" = "true" ]; then

            echo "Deleting previous runs of zip.yml"

            gh run list \
              --workflow="zip.yml" \
              --limit 1000 \
              --json databaseId \
              --jq '.[].databaseId' |
            while read RUN_ID; do

              if [ "$RUN_ID" != "${{ github.run_id }}" ]; then
                gh run delete "$RUN_ID" \
                  --repo "${{ github.repository }}" || true
              fi

            done

          fi


          # --------------------------------------
          # old_browser.yml
          # --------------------------------------

          if [ "${{ inputs.workflow_old_browser }}" = "true" ]; then

            echo "Deleting previous runs of old_browser.yml"

            gh run list \
              --workflow="old_browser.yml" \
              --limit 1000 \
              --json databaseId \
              --jq '.[].databaseId' |
            while read RUN_ID; do

              if [ "$RUN_ID" != "${{ github.run_id }}" ]; then
                gh run delete "$RUN_ID" \
                  --repo "${{ github.repository }}" || true
              fi

            done

          fi


          # --------------------------------------
          # send_to_telegram.yml
          # --------------------------------------

          if [ "${{ inputs.workflow_send_to_telegram }}" = "true" ]; then

            echo "Deleting previous runs of send_to_telegram.yml"

            gh run list \
              --workflow="send_to_telegram.yml" \
              --limit 1000 \
              --json databaseId \
              --jq '.[].databaseId' |
            while read RUN_ID; do

              if [ "$RUN_ID" != "${{ github.run_id }}" ]; then
                gh run delete "$RUN_ID" \
                  --repo "${{ github.repository }}" || true
              fi

            done

          fi


          # --------------------------------------
          # yt-dlp.yml
          # --------------------------------------

          if [ "${{ inputs.workflow_yt_dlp }}" = "true" ]; then

            echo "Deleting previous runs of yt-dlp.yml"

            gh run list \
              --workflow="yt-dlp.yml" \
              --limit 1000 \
              --json databaseId \
              --jq '.[].databaseId' |
            while read RUN_ID; do

              if [ "$RUN_ID" != "${{ github.run_id }}" ]; then
                gh run delete "$RUN_ID" \
                  --repo "${{ github.repository }}" || true
              fi

            done

          fi


          # --------------------------------------
          # zip-all.yml
          # --------------------------------------

          if [ "${{ inputs.workflow_zip_all }}" = "true" ]; then

            echo "Deleting previous runs of zip-all.yml"

            gh run list \
              --workflow="zip-all.yml" \
              --limit 1000 \
              --json databaseId \
              --jq '.[].databaseId' |
            while read RUN_ID; do

              if [ "$RUN_ID" != "${{ github.run_id }}" ]; then
                gh run delete "$RUN_ID" \
                  --repo "${{ github.repository }}" || true
              fi

            done

          fi

          echo "Workflow cleanup completed."
