name: 3 - Yt-dlp

on:
  workflow_dispatch:
    inputs:

      quality:
        description: "Preferred quality"
        required: true
        type: choice
        options:
          - "480"
          - "720"
          - "1080"
          - best
        default: "720"

      encode_mode:
        description: "Encode mode"
        required: true
        type: choice
        options:
          - disabled
          - x265-veryfast-27
          - x265-540p-29-2X
          - x265-540-28
          - x265-480-29
          - x265-720-27-80k
        default: x265-veryfast-27

      min_size_mb:
        description: "Minimum size for encoding (MB)"
        required: true
        default: "100"

      create_zip:
        description: "Create ZIP file?"
        required: true
        type: choice
        options:
          - "yes"
          - "no"
        default: "no"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        type: choice
        options:
          - "yes"
          - "no"
        default: "no"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip jq gh
          pip install --force-reinstall -U yt-dlp
          echo "yt-dlp version:"
          yt-dlp --version

      - name: Download videos
        run: |
          mkdir -p downloads

          QUALITY="${{ github.event.inputs.quality }}"

          if [[ "$QUALITY" == "best" ]]; then
            FORMAT="bestvideo+bestaudio/best"
          else
            FORMAT="bestvideo[height<=$QUALITY]+bestaudio/best[height<=$QUALITY]/best"
          fi

          FAILED=0
          TOTAL=0

          while IFS= read -r url; do

            # Skip blank lines and comment lines
            [ -z "$url" ] && continue
            [[ "$url" == \#* ]] && continue

            TOTAL=$((TOTAL+1))

            echo "=================================================="
            echo "Downloading ($TOTAL): $url"
            echo "=================================================="

            # Case 1: URL is a direct file link (ends with video extension)
            if echo "$url" | grep -qiE '\.(mp4|mkv|webm|avi|mov|m4v)([\?#].*)?$'; then
              filename=$(basename "$(echo "$url" | cut -d'?' -f1)")
              if curl -fL --retry 3 --retry-delay 2 --output "downloads/${filename}" "$url"; then
                echo "OK (direct link): $filename"
              else
                echo "::warning::Direct download failed for $url"
                FAILED=$((FAILED+1))
              fi
              continue
            fi

            # Case 2: try yt-dlp normally first
            if yt-dlp \
                -f "$FORMAT" \
                --merge-output-format mp4 \
                --no-part \
                --restrict-filenames \
                --retries 3 \
                --no-abort-on-error \
                -o "downloads/%(title).80B.%(ext)s" \
                "$url"; then
              echo "OK (yt-dlp): $url"
              continue
            fi

            echo "::warning::yt-dlp could not extract $url — trying fallback raw-HTML extraction"

            # Case 3: fallback — pull a direct mp4/m3u8 link straight out of the page HTML.
            # This is what generic-extractor failures ("Unable to extract flashvars", etc.)
            # usually need: yt-dlp has no dedicated extractor for the site, so we look for
            # the raw media URL ourselves.
            html=$(curl -fsL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$url" || true)

            if [ -z "$html" ]; then
              echo "::error::Could not even fetch the page HTML for $url"
              FAILED=$((FAILED+1))
              continue
            fi

            direct_url=$(echo "$html" \
              | grep -oE 'https?://[^"'"'"'[:space:]\\]+\.(mp4|m3u8)[^"'"'"'[:space:]\\]*' \
              | head -n1)

            if [ -z "$direct_url" ]; then
              echo "::error::No direct media URL found in HTML for $url — skipping"
              FAILED=$((FAILED+1))
              continue
            fi

            echo "Found candidate direct URL: $direct_url"
            base_name="downloads/$(date +%s)_$(basename "${direct_url%%\?*}")"

            if [[ "$direct_url" == *.m3u8* ]]; then
              out_name="${base_name%.m3u8}.mp4"
              if ffmpeg -y -i "$direct_url" -c copy "$out_name"; then
                echo "OK (fallback HLS): $out_name"
              else
                echo "::error::ffmpeg failed to pull HLS stream for $url"
                FAILED=$((FAILED+1))
              fi
            else
              if curl -fL --retry 3 --retry-delay 2 --output "$base_name" "$direct_url"; then
                echo "OK (fallback direct): $base_name"
              else
                echo "::error::curl failed to download fallback URL for $url"
                FAILED=$((FAILED+1))
              fi
            fi

          done < yt.txt

          echo "=================================================="
          echo "Download summary: $((TOTAL-FAILED))/$TOTAL succeeded"
          echo "=================================================="

          if [ "$FAILED" -gt 0 ]; then
            echo "::warning::$FAILED of $TOTAL URLs failed to download — continuing with whatever succeeded"
          fi

      - name: Encode videos
        run: |
          mkdir -p encoded

          MODE="${{ github.event.inputs.encode_mode }}"
          MIN_SIZE="${{ github.event.inputs.min_size_mb }}"

          # Helper: extract video info via ffprobe
          get_video_info() {
            local f="$1"
            local res bitrate_raw bitrate_k
            res=$(ffprobe -v error -select_streams v:0 \
              -show_entries stream=width,height \
              -of csv=s=x:p=0 "$f" 2>/dev/null || echo "N/A")
            bitrate_raw=$(ffprobe -v error -select_streams v:0 \
              -show_entries stream=bit_rate \
              -of default=nk=1:nw=1 "$f" 2>/dev/null || echo "0")
            bitrate_raw=${bitrate_raw:-0}
            [[ "$bitrate_raw" =~ ^[0-9]+$ ]] || bitrate_raw=0
            bitrate_k=$((bitrate_raw / 1000))
            echo "${res}|${bitrate_k}"
          }

          # File that accumulates per-file stats for release notes
          STATS_FILE="encode_stats.txt"
          > "$STATS_FILE"

          for file in downloads/*; do

            [ -f "$file" ] || continue

            size_mb=$(du -m "$file" | cut -f1)
            name=$(basename "$file")

            if [[ "$MODE" == "disabled" ]]; then
              cp "$file" encoded/
              continue
            fi

            if [[ "$size_mb" -lt "$MIN_SIZE" ]]; then
              cp "$file" encoded/
              # Record as "copied (too small)"
              info_before=$(get_video_info "$file")
              res_before=$(echo "$info_before" | cut -d'|' -f1)
              br_before=$(echo "$info_before" | cut -d'|' -f2)
              echo "### \`${name}\`" >> "$STATS_FILE"
              echo "- **Status:** Copied as-is (size ${size_mb} MB < minimum ${MIN_SIZE} MB)" >> "$STATS_FILE"
              echo "- **Resolution:** ${res_before}" >> "$STATS_FILE"
              echo "- **Video bitrate:** ${br_before} kbps" >> "$STATS_FILE"
              echo "- **File size:** ${size_mb} MB" >> "$STATS_FILE"
              echo "" >> "$STATS_FILE"
              continue
            fi

            bitrate=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=bit_rate \
              -of default=nk=1:nw=1 \
              "$file")

            bitrate=${bitrate:-0}
            [[ "$bitrate" =~ ^[0-9]+$ ]] || bitrate=0
            bitrate_k=$((bitrate / 1000))

            if [[ "$bitrate_k" -gt 0 && "$bitrate_k" -lt 500 ]]; then
              echo "Skipping encode (bitrate too low): $file"
              cp "$file" encoded/
              info_before=$(get_video_info "$file")
              res_before=$(echo "$info_before" | cut -d'|' -f1)
              echo "### \`${name}\`" >> "$STATS_FILE"
              echo "- **Status:** Copied as-is (bitrate ${bitrate_k} kbps < 500 kbps threshold)" >> "$STATS_FILE"
              echo "- **Resolution:** ${res_before}" >> "$STATS_FILE"
              echo "- **Video bitrate:** ${bitrate_k} kbps" >> "$STATS_FILE"
              echo "- **File size:** ${size_mb} MB" >> "$STATS_FILE"
              echo "" >> "$STATS_FILE"
              continue
            fi

            output="encoded/${name%.*}_encoded.mp4"

            # Capture before-encode info
            info_before=$(get_video_info "$file")
            res_before=$(echo "$info_before" | cut -d'|' -f1)
            br_before=$(echo "$info_before" | cut -d'|' -f2)
            size_before_mb=$size_mb

            # Determine CRF used by mode
            CRF_USED="N/A"

            if [[ "$MODE" == "x265-veryfast-27" ]]; then

              CRF_USED="27"
              ffmpeg -y \
                -i "$file" \
                -c:v libx265 \
                -pix_fmt yuv420p10le \
                -preset veryfast \
                -crf 27 \
                -c:a aac \
                "$output"

            elif [[ "$MODE" == "x265-540p-29-2X" ]]; then

              CRF_USED="29"
              ffmpeg -y \
                -i "$file" \
                -vf "setpts=0.5*PTS,fps=30,scale=-2:540" \
                -af "atempo=2.0" \
                -c:v libx265 \
                -pix_fmt yuv420p10le \
                -preset veryfast \
                -crf 29 \
                -x265-params no-sao=1:aq-mode=3:bframes=4:keyint=240 \
                -c:a aac -b:a 80k \
                "$output"

            elif [[ "$MODE" == "x265-540-28" ]]; then

              CRF_USED="28"
              ffmpeg -y \
                -i "$file" \
                -vf "scale=-2:540" \
                -c:v libx265 \
                -pix_fmt yuv420p10le \
                -preset veryfast \
                -crf 28 \
                -x265-params no-sao=1:aq-mode=3:bframes=4:keyint=240 \
                -c:a aac -b:a 80k \
                "$output"

            elif [[ "$MODE" == "x265-480-29" ]]; then

              CRF_USED="29"
              ffmpeg -y \
                -i "$file" \
                -vf "scale=-2:480" \
                -c:v libx265 \
                -pix_fmt yuv420p10le \
                -preset veryfast \
                -crf 29 \
                -x265-params no-sao=1:aq-mode=3:bframes=4:keyint=240 \
                -c:a aac -b:a 80k \
                "$output"

            elif [[ "$MODE" == "x265-720-27-80k" ]]; then

              CRF_USED="27"
              ffmpeg -y \
                -i "$file" \
                -vf "scale=-2:720" \
                -c:v libx265 \
                -pix_fmt yuv420p10le \
                -preset veryfast \
                -crf 27 \
                -x265-params no-sao=1:aq-mode=3:bframes=4:keyint=240 \
                -c:a aac -b:a 80k \
                "$output"

            fi

            # Capture after-encode info
            if [[ -f "$output" ]]; then
              info_after=$(get_video_info "$output")
              res_after=$(echo "$info_after" | cut -d'|' -f1)
              br_after=$(echo "$info_after" | cut -d'|' -f2)
              size_after_mb=$(du -m "$output" | cut -f1)

              # Calculate size reduction percentage
              if [[ "$size_before_mb" -gt 0 ]]; then
                reduction=$(awk "BEGIN {printf \"%.1f\", (1 - $size_after_mb/$size_before_mb)*100}")
              else
                reduction="N/A"
              fi

              out_name=$(basename "$output")
              echo "### \`${out_name}\`" >> "$STATS_FILE"
              echo "- **Encode mode:** \`${MODE}\`" >> "$STATS_FILE"
              echo "- **CRF:** ${CRF_USED}" >> "$STATS_FILE"
              echo "- **Resolution:** ${res_before} -> ${res_after}" >> "$STATS_FILE"
              echo "- **Video bitrate:** ${br_before} kbps -> ${br_after} kbps" >> "$STATS_FILE"
              echo "- **File size:** ${size_before_mb} MB -> ${size_after_mb} MB  (-${reduction}% reduction)" >> "$STATS_FILE"
              echo "" >> "$STATS_FILE"
            fi

          done

      - name: Build release notes
        run: |
          MODE="${{ github.event.inputs.encode_mode }}"
          QUALITY="${{ github.event.inputs.quality }}"
          RUN_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          {
            echo "## Release Info"
            echo "- **Date:** ${RUN_DATE}"
            echo "- **Requested quality:** ${QUALITY}p"
            echo "- **Encode mode:** \`${MODE}\`"
            echo ""
            if [[ -s encode_stats.txt ]]; then
              echo "---"
              echo "## File Details"
              echo ""
              cat encode_stats.txt
            fi
          } > release_notes.md

      - name: Create ZIP
        if: github.event.inputs.create_zip == 'yes'
        run: |
          ts=$(date +"%Y%m%d_%H%M%S")

          zip -r \
            -P "${{ secrets.ZIP_PASSWORD }}" \
            "media_$ts.zip" \
            encoded/

      - name: Delete old releases
        if: github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --limit 100 | awk '{print $1}')

          for tag in $releases; do
            gh release delete "$tag" -y || true
          done

      - name: Upload ZIP Release
        if: github.event.inputs.create_zip == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: media-${{ github.run_number }}
          files: "*.zip"
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: github.event.inputs.create_zip == 'no'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "media-${{ github.run_number }}" >/dev/null 2>&1 || \
          gh release create \
            "media-${{ github.run_number }}" \
            --title "media-${{ github.run_number }}" \
            --notes-file release_notes.md

      - name: Upload Files
        if: github.event.inputs.create_zip == 'no'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            "media-${{ github.run_number }}" \
            encoded/* \
            --clobber
