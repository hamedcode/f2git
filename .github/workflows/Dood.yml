name: 8 - Doodstream Downloader

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "لینک صفحه ویدیو (doodstream / playmogo / dood.* / ...)"
        required: true

      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip curl aria2 jq gh
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: mkdir -p downloads grabbed

      - name: Create resolver script
        run: |
          cat > dood_dl.js << 'EOF'

          // Resolves a doodstream-family share/embed link (dood.*, playmogo,
          // ds2play, d0000d, ...) to a direct, downloadable CDN URL.
          //
          // No clicking, no ads: we replicate the two plain HTTP calls the
          // player's own JS makes on page load to fetch its video source
          // (the "pass_md5" handshake) -- so none of the ad scripts ever
          // fire. But a raw Node fetch() gets blocked with 403 by this
          // site's bot protection (it checks the real-browser network
          // fingerprint, not just headers), so we make BOTH requests
          // through an actual headless Chromium instance instead: one
          // single clean page load (no interaction) to get the HTML, then
          // the pass_md5 call through that same browser context so it
          // carries whatever cookies/fingerprint got it past the check the
          // first time.

          const fs = require('fs');
          const { chromium } = require('playwright');

          const SOURCE_URL = process.argv[2];
          if (!SOURCE_URL) {
            console.error('No source URL given');
            process.exit(1);
          }

          const UA =
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36';

          function toEmbedUrlObj(u) {
            const parsed = new URL(u);
            parsed.pathname = parsed.pathname.replace('/d/', '/e/').replace('/f/', '/e/');
            return parsed;
          }

          function randomString(len) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let s = '';
            for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
            return s;
          }

          (async () => {

            const browser = await chromium.launch({ headless: true });

            try {

              const embedUrlObj = toEmbedUrlObj(SOURCE_URL);
              const embedUrl = embedUrlObj.toString();
              const origin = embedUrlObj.origin;

              console.log('EMBED URL:', embedUrl);

              const context = await browser.newContext({ userAgent: UA, locale: 'en-US' });
              const page = await context.newPage();

              // single clean navigation, no clicking anything
              let resp;
              try {
                resp = await page.goto(embedUrl, { waitUntil: 'networkidle', timeout: 60000 });
              } catch (e) {
                console.log('goto warning:', e.message);
              }

              if (resp && !resp.ok()) {
                console.error('Failed to load embed page, status:', resp.status());
                process.exit(1);
              }

              // give a non-interactive anti-bot interstitial a chance to
              // clear on its own, same as a real browser tab sitting there
              const bodyText = await page.evaluate(() => document.body.innerText).catch(() => '');
              if (/just a moment|checking your browser|attention required/i.test(bodyText)) {
                console.log('Anti-bot interstitial detected, waiting for it to settle...');
                await page.waitForTimeout(8000).catch(() => {});
              }

              const html = await page.content();

              const title = (await page.title().catch(() => '')).trim() || 'video';
              console.log('TITLE:', title);

              // find the pass_md5 endpoint the player's own JS calls to get
              // the real source -- a plain data endpoint, no ads attached
              const passMd5Match = html.match(/\/pass_md5\/[^'"]+/);

              if (!passMd5Match) {
                console.error('Could not find a pass_md5 endpoint on this page -- the site may have changed its player, or this URL format is not supported.');
                process.exit(1);
              }

              const passMd5Path = passMd5Match[0];
              const passMd5Url = origin + passMd5Path;

              console.log('PASS_MD5:', passMd5Url);

              // use the SAME browser context (same cookies/session) to make
              // this call, instead of a raw fetch, so it passes whatever
              // check the page load itself passed
              const md5Res = await context.request.get(passMd5Url, {
                headers: { Referer: embedUrl }
              });

              if (!md5Res.ok()) {
                console.error('pass_md5 request failed, status:', md5Res.status());
                process.exit(1);
              }

              let baseCdnUrl = (await md5Res.text()).trim();

              if (!baseCdnUrl.startsWith('http')) {
                console.error('Unexpected pass_md5 response (not a URL):', baseCdnUrl.slice(0, 200));
                process.exit(1);
              }

              if (!baseCdnUrl.endsWith('/')) baseCdnUrl += '/';

              // the token is the last path segment of the pass_md5 endpoint
              // itself
              const token = passMd5Path.split('/').filter(Boolean).pop();
              const expiry = Date.now();
              const finalUrl = `${baseCdnUrl}${randomString(10)}?token=${token}&expiry=${expiry}`;

              console.log('FINAL URL:', finalUrl);

              // sanity check it actually resolves before handing it to the
              // download step -- again through the same context
              const headRes = await context.request.head(finalUrl, {
                headers: { Referer: embedUrl }
              });

              if (!headRes.ok()) {
                console.error('Final link did not validate, status:', headRes.status());
                process.exit(1);
              }

              console.log('Validated OK, content-length:', headRes.headers()['content-length']);

              fs.writeFileSync(
                'grabbed/result.json',
                JSON.stringify({ title, url: finalUrl, referer: embedUrl }, null, 2)
              );
              console.log('Saved grabbed/result.json');

            } catch (e) {
              console.error('Error:', e.message);
              process.exit(1);
            } finally {
              await browser.close().catch(() => {});
            }

          })();

          EOF

      - name: Run resolver
        run: node dood_dl.js "${{ github.event.inputs.source_url }}"

      - name: Download video
        run: |

          if [ ! -f grabbed/result.json ]; then
            echo "No result from resolver step"
            exit 1
          fi

          title=$(jq -r '.title' grabbed/result.json)
          url=$(jq -r '.url' grabbed/result.json)
          referer=$(jq -r '.referer' grabbed/result.json)
          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"

          safe_title=$(echo "$title" \
            | sed 's/[^a-zA-Z0-9 ._-]/_/g' \
            | sed 's/[_ ]\+/_/g' \
            | sed 's/^_//;s/_$//' \
            | cut -c1-80)

          [ -z "$safe_title" ] && safe_title="video"

          echo "TITLE:   $safe_title"
          echo "URL:     $url"
          echo "REFERER: $referer"

          clean_url=$(echo "$url" | cut -d'?' -f1)
          ext=$(echo "$clean_url" | grep -oE '\.(mp4|m3u8)' | head -1 | tr -d '.')

          # the CDN checks the Referer header (and sometimes user-agent), so
          # every downloader needs to send the same ones the resolver used

          if [[ "$ext" == "m3u8" ]]; then

            echo "[FFMPEG] downloading m3u8"
            ffmpeg -y \
              -user_agent "$ua" \
              -headers "Referer: ${referer}\r\n" \
              -i "$url" -c copy "downloads/${safe_title}.mp4"

          else

            echo "[ARIA2] trying download..."
            aria2c \
              -x 16 -s 16 -k 1M -c \
              --summary-interval=5 \
              --console-log-level=warn \
              --user-agent="$ua" \
              --referer="$referer" \
              --dir=downloads \
              --out="${safe_title}.${ext:-mp4}" \
              "$url"

            if [ $? -ne 0 ]; then
              echo "[CURL FALLBACK] aria2 failed"
              curl -L --retry 5 --connect-timeout 30 \
                -A "$ua" \
                -e "$referer" \
                -o "downloads/${safe_title}.${ext:-mp4}" \
                "$url"
            fi

          fi

          echo ""
          echo "=== downloads/ ==="
          ls -lh downloads/ || true

          if [ -z "$(ls -A downloads 2>/dev/null)" ]; then
            echo "Download failed: downloads/ is empty"
            exit 1
          fi

          # doodstream CDN returns a small HTML error page (not the real
          # video) if the token/referer didn't validate -- a real clip is
          # essentially never under ~200KB, so treat anything that small as
          # a failed download
          for f in downloads/*; do
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$size" -lt 200000 ]; then
              echo "Downloaded file looks too small ($size bytes) -- likely an error page, not the video:"
              head -c 300 "$f"; echo
              exit 1
            fi
          done

      - name: Create ZIP
        if: github.event.inputs.upload_mode == 'zip'
        run: |
          ts=$(date +"%Y%m%d_%H%M%S")
          zip -r -P "${{ secrets.ZIP_PASSWORD }}" "dood_media_${ts}.zip" downloads/

      - name: Delete old releases
        if: github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --limit 100 | awk '{print $1}')
          for tag in $releases; do
            gh release delete "$tag" -y || true
          done

      - name: Upload ZIP Release
        if: github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dood-${{ github.run_number }}
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Direct Video Release
        if: github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dood-${{ github.run_number }}
          files: "downloads/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
