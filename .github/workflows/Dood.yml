name: 8 - Doodstream Downloader

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "لینک صفحه ویدیو (doodstream / playmogo / dood.* / ...)"
        required: true
        type: string

      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            zip \
            curl \
            aria2 \
            jq

          npm init -y

          npm install playwright

          npx playwright install chromium --with-deps


      # ============================================================
      # PREPARE DIRECTORIES
      # ============================================================

      - name: Prepare folders
        run: |
          mkdir -p downloads
          mkdir -p grabbed


      # ============================================================
      # CREATE DIAGNOSTIC DOOD RESOLVER
      # ============================================================

      - name: Create resolver script
        run: |
          cat > dood_dl.js << 'EOF'

          const fs = require('fs');
          const { chromium } = require('playwright');

          const SOURCE_URL = process.argv[2];

          if (!SOURCE_URL) {
            console.error('Usage: node dood_dl.js "<url>"');
            process.exit(1);
          }

          const UA =
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
            'AppleWebKit/537.36 (KHTML, like Gecko) ' +
            'Chrome/140.0.0.0 Safari/537.36';

          const sleep = ms =>
            new Promise(resolve => setTimeout(resolve, ms));

          fs.mkdirSync('grabbed', { recursive: true });


          // ==========================================================
          // NORMALIZE URL
          // ==========================================================

          function normalizePlayerUrl(input) {

            const u = new URL(input);

            if (u.pathname.startsWith('/d/')) {
              u.pathname =
                u.pathname.replace(/^\/d\//, '/e/');
            }

            return u.toString();
          }


          // ==========================================================
          // SANITIZE TITLE
          // ==========================================================

          function sanitizeTitle(s) {

            return (s || 'video')
              .replace(/<[^>]+>/g, '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/[<>:"/\\|?*\x00-\x1F]/g, '_')
              .replace(/\s+/g, ' ')
              .trim()
              .slice(0, 120) || 'video';
          }


          // ==========================================================
          // INTERESTING NETWORK REQUEST
          // ==========================================================

          function isInteresting(url) {

            return (
              /pass_md5/i.test(url) ||
              /cloudatacdn/i.test(url) ||
              /\.mp4(?:\?|$)/i.test(url) ||
              /\.m3u8(?:\?|$)/i.test(url) ||
              /\/cptr\//i.test(url) ||
              /\/api\//i.test(url)
            );
          }


          // ==========================================================
          // MAIN
          // ==========================================================

          (async () => {

            let browser;

            try {

              const playerUrl =
                normalizePlayerUrl(SOURCE_URL);

              const player =
                new URL(playerUrl);

              console.log(
                'SOURCE URL:',
                SOURCE_URL
              );

              console.log(
                'PLAYER URL:',
                playerUrl
              );


              // ======================================================
              // LAUNCH BROWSER
              // ======================================================

              browser =
                await chromium.launch({
                  headless: true
                });


              const context =
                await browser.newContext({

                  userAgent: UA,

                  locale: 'en-US',

                  timezoneId: 'UTC',

                  viewport: {
                    width: 1366,
                    height: 768
                  },

                  javaScriptEnabled: true

                });


              const page =
                await context.newPage();


              // ======================================================
              // STORAGE
              // ======================================================

              const requests = [];
              const responses = [];
              const scripts = [];

              let finalMediaUrl = null;
              let passMd5Url = null;
              let passMd5Body = null;


              // ======================================================
              // REQUEST LOGGER
              // ======================================================

              page.on('request', request => {

                const url =
                  request.url();

                const item = {

                  type: 'request',

                  method:
                    request.method(),

                  url,

                  resourceType:
                    request.resourceType(),

                  headers:
                    request.headers()

                };

                requests.push(item);


                if (isInteresting(url)) {

                  console.log(
                    '\n>>> INTERESTING REQUEST'
                  );

                  console.log(
                    request.method(),
                    url
                  );

                  console.log(
                    'TYPE:',
                    request.resourceType()
                  );

                }


                if (/pass_md5/i.test(url)) {

                  passMd5Url = url;

                  console.log(
                    '>>> PASS_MD5 REQUEST FOUND:',
                    url
                  );

                }


                if (
                  /cloudatacdn/i.test(url) &&
                  (
                    /\.mp4/i.test(url) ||
                    /token=/i.test(url)
                  )
                ) {

                  finalMediaUrl = url;

                  console.log(
                    '>>> CDN MEDIA REQUEST FOUND:',
                    url
                  );

                }

              });


              // ======================================================
              // RESPONSE LOGGER
              // ======================================================

              page.on('response', async response => {

                const url =
                  response.url();

                const item = {

                  type: 'response',

                  status:
                    response.status(),

                  url,

                  resourceType:
                    response.request()
                      .resourceType()

                };

                responses.push(item);


                if (isInteresting(url)) {

                  console.log(
                    '\n<<< INTERESTING RESPONSE'
                  );

                  console.log(
                    response.status(),
                    url
                  );

                }


                if (/pass_md5/i.test(url)) {

                  try {

                    const text =
                      await response.text();

                    passMd5Body =
                      text;

                    console.log(
                      '>>> PASS_MD5 RESPONSE BODY:'
                    );

                    console.log(
                      text.slice(0, 2000)
                    );

                  } catch (e) {

                    console.log(
                      'Could not read pass_md5 response:',
                      e.message
                    );

                  }

                }


                if (
                  /cloudatacdn/i.test(url) &&
                  (
                    /\.mp4/i.test(url) ||
                    /token=/i.test(url)
                  )
                ) {

                  finalMediaUrl =
                    url;

                }

              });


              // ======================================================
              // PAGE CONSOLE
              // ======================================================

              page.on('console', msg => {

                console.log(
                  `[PAGE CONSOLE ${msg.type()}] ${msg.text()}`
                );

              });


              page.on('pageerror', error => {

                console.log(
                  '[PAGE ERROR]',
                  error.message
                );

              });


              page.on('requestfailed', request => {

                console.log(
                  '[REQUEST FAILED]',
                  request.method(),
                  request.url(),
                  request.failure()?.errorText || ''
                );

              });


              // ======================================================
              // LOAD PLAYER
              // ======================================================

              console.log(
                '\n=== Loading player ==='
              );

              const response =
                await page.goto(
                  playerUrl,
                  {
                    waitUntil:
                      'domcontentloaded',

                    timeout:
                      60000
                  }
                );


              console.log(
                'PLAYER STATUS:',
                response
                  ? response.status()
                  : 'unknown'
              );

              console.log(
                'CURRENT URL:',
                page.url()
              );


              // ======================================================
              // WAIT FOR PLAYER INITIALIZATION
              // ======================================================

              console.log(
                '\n=== Waiting for player initialization ==='
              );

              await page.waitForTimeout(3000);


              // ======================================================
              // SAVE HTML
              // ======================================================

              const html =
                await page.content();

              fs.writeFileSync(
                'grabbed/player.html',
                html
              );

              console.log(
                'Saved grabbed/player.html'
              );


              // ======================================================
              // EXTRACT SCRIPT INFORMATION
              // ======================================================

              const scriptData =
                await page.evaluate(() => {

                  return Array.from(
                    document.scripts
                  ).map((s, i) => ({

                    index: i,

                    src:
                      s.src || null,

                    inline:
                      s.src
                        ? false
                        : true,

                    text:
                      s.src
                        ? ''
                        : s.textContent

                  }));

                });


              fs.writeFileSync(
                'grabbed/scripts.json',
                JSON.stringify(
                  scriptData,
                  null,
                  2
                )
              );


              console.log(
                'Scripts found:',
                scriptData.length
              );


              for (const s of scriptData) {

                console.log(
                  `SCRIPT ${s.index}:`,
                  s.src || '(inline)'
                );

              }


              // ======================================================
              // STATIC PATTERN SCAN
              // ======================================================

              console.log(
                '\n=== Static pattern scan ==='
              );

              const patterns = [

                /\/pass_md5[^'"`\s<)]*/gi,

                /pass_md5/gi,

                /cloudatacdn/gi,

                /token\s*[:=]/gi,

                /expiry\s*[:=]/gi,

                /m3u8/gi,

                /\.mp4/gi,

                /cptr/gi

              ];


              for (const re of patterns) {

                const matches =
                  html.match(re);

                console.log(
                  re.toString(),
                  ':',
                  matches
                    ? matches.length
                    : 0
                );

              }


              // ======================================================
              // SEARCH INLINE JS
              // ======================================================

              console.log(
                '\n=== Searching JavaScript sources ==='
              );


              for (const s of scriptData) {

                if (!s.inline)
                  continue;

                const text =
                  s.text || '';

                if (
                  /pass_md5|cloudatacdn|m3u8|\.mp4|expiry|token/i
                    .test(text)
                ) {

                  console.log(
                    `FOUND interesting inline script ${s.index}`
                  );

                  const idx =
                    text.search(
                      /pass_md5|cloudatacdn|m3u8|\.mp4|expiry|token/i
                    );

                  console.log(
                    text.slice(
                      Math.max(0, idx - 500),
                      idx + 2500
                    )
                  );

                }

              }


              // ======================================================
              // EXTENDED NETWORK OBSERVATION
              // ======================================================

              console.log(
                '\n=== Extended network observation ==='
              );


              for (
                let i = 1;
                i <= 20;
                i++
              ) {

                await sleep(1000);

                console.log(
                  `Network observation ${i}/20`
                );


                if (finalMediaUrl) {

                  console.log(
                    'Media URL already found.'
                  );

                  break;

                }

              }


              // ======================================================
              // TRY NORMAL PLAYER INTERACTION
              // ======================================================

              if (!finalMediaUrl) {

                console.log(
                  '\n=== Trying normal player interaction ==='
                );


                const selectors = [

                  'video',

                  '.jwplayer',

                  '.plyr',

                  '.vjs-tech',

                  '[class*="play"]',

                  '[id*="play"]'

                ];


                for (
                  const selector
                  of selectors
                ) {

                  try {

                    const count =
                      await page
                        .locator(selector)
                        .count();


                    console.log(
                      selector,
                      'count =',
                      count
                    );


                    if (count > 0) {

                      await page
                        .locator(selector)
                        .first()
                        .click({
                          timeout: 2000,
                          force: true
                        })
                        .catch(() => {});


                      await sleep(3000);

                    }

                  } catch {}

                }

              }


              // ======================================================
              // MEDIA ELEMENTS
              // ======================================================

              const mediaInfo =
                await page.evaluate(() => {

                  return {

                    videos:
                      Array.from(
                        document.querySelectorAll(
                          'video'
                        )
                      ).map(v => ({

                        src:
                          v.src || null,

                        currentSrc:
                          v.currentSrc || null,

                        poster:
                          v.poster || null

                      })),

                    sources:
                      Array.from(
                        document.querySelectorAll(
                          'source'
                        )
                      ).map(s => ({

                        src:
                          s.src || null,

                        type:
                          s.type || null

                      }))

                  };

                });


              console.log(
                '\n=== MEDIA ELEMENTS ==='
              );

              console.log(
                JSON.stringify(
                  mediaInfo,
                  null,
                  2
                )
              );


              // ======================================================
              // SAVE NETWORK DIAGNOSTICS
              // ======================================================

              fs.writeFileSync(
                'grabbed/network.json',
                JSON.stringify(
                  {

                    playerUrl,

                    finalMediaUrl,

                    passMd5Url,

                    passMd5Body,

                    requests,

                    responses,

                    mediaInfo

                  },
                  null,
                  2
                )
              );


              console.log(
                '\nSaved grabbed/network.json'
              );


              // ======================================================
              // RESULT
              // ======================================================

              if (finalMediaUrl) {

                console.log(
                  '\n========================================'
                );

                console.log(
                  'SUCCESS: CDN MEDIA URL FOUND'
                );

                console.log(
                  '========================================'
                );

                console.log(
                  finalMediaUrl
                );


                const title =
                  await page.title();


                fs.writeFileSync(
                  'grabbed/result.json',
                  JSON.stringify(
                    {

                      title:
                        sanitizeTitle(title),

                      url:
                        finalMediaUrl,

                      referer:
                        player.origin + '/',

                      player_url:
                        playerUrl

                    },
                    null,
                    2
                  )
                );


                console.log(
                  'Saved grabbed/result.json'
                );


              } else {

                console.log(
                  '\n========================================'
                );

                console.log(
                  'NO MEDIA URL FOUND'
                );

                console.log(
                  '========================================'
                );

                console.log(
                  'Diagnostics saved under grabbed/'
                );


                process.exitCode = 1;

              }


              await context.close();


            } catch (error) {

              console.error(
                '\nFATAL ERROR'
              );

              console.error(
                error.stack ||
                error.message
              );

              process.exitCode = 1;

            } finally {

              if (browser) {

                await browser
                  .close()
                  .catch(() => {});

              }

            }

          })();

          EOF


      # ============================================================
      # RUN RESOLVER
      # ============================================================

      - name: Run resolver
        id: resolver
        continue-on-error: true
        run: |
          node dood_dl.js "${{ github.event.inputs.source_url }}"


      # ============================================================
      # UPLOAD DIAGNOSTICS
      # ============================================================

      - name: Upload Dood diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dood-diagnostics-${{ github.run_number }}
          path: grabbed/
          if-no-files-found: warn
          retention-days: 7


      # ============================================================
      # STOP IF RESOLVER FAILED
      # ============================================================

      - name: Stop if resolver failed
        if: steps.resolver.outcome != 'success'
        run: |
          echo "Dood resolver failed."
          echo "Diagnostic files were uploaded as an artifact."
          exit 1


      # ============================================================
      # DOWNLOAD VIDEO
      # ============================================================

      - name: Download video
        if: steps.resolver.outcome == 'success'
        run: |

          if [ ! -f grabbed/result.json ]; then
            echo "No result.json found."
            exit 1
          fi


          title=$(jq -r '.title' grabbed/result.json)

          url=$(jq -r '.url' grabbed/result.json)

          referer=$(jq -r '.referer' grabbed/result.json)


          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"


          safe_title=$(echo "$title" \
            | sed 's/[^a-zA-Z0-9 ._-]/_/g' \
            | sed 's/[_ ]\+/_/g' \
            | sed 's/^_//;s/_$//' \
            | cut -c1-80)


          if [ -z "$safe_title" ]; then
            safe_title="video"
          fi


          echo "TITLE:   $safe_title"
          echo "REFERER: $referer"


          clean_url=$(echo "$url" | cut -d'?' -f1)


          ext=$(echo "$clean_url" \
            | grep -oEi '\.(mp4|m3u8)' \
            | head -1 \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d '.')


          if [ -z "$ext" ]; then
            ext="mp4"
          fi


          # ==========================================================
          # M3U8
          # ==========================================================

          if [[ "$ext" == "m3u8" ]]; then

            echo "[FFMPEG] downloading m3u8"


            ffmpeg -y \
              -user_agent "$ua" \
              -headers "Referer: ${referer}\r\n" \
              -i "$url" \
              -c copy \
              "downloads/${safe_title}.mp4"


          else

            # ========================================================
            # MP4
            # ========================================================

            echo "[ARIA2] trying download..."


            set +e


            aria2c \
              -x 8 \
              -s 8 \
              -k 1M \
              -c \
              --summary-interval=5 \
              --console-log-level=warn \
              --user-agent="$ua" \
              --referer="$referer" \
              --header="Accept: */*" \
              --dir=downloads \
              --out="${safe_title}.mp4" \
              "$url"


            aria_status=$?


            set -e


            if [ "$aria_status" -ne 0 ]; then

              echo "[CURL FALLBACK] aria2 failed"


              curl -L \
                --fail \
                --retry 5 \
                --retry-all-errors \
                --connect-timeout 30 \
                -A "$ua" \
                -e "$referer" \
                -H "Accept: */*" \
                -o "downloads/${safe_title}.mp4" \
                "$url"

            fi

          fi


          # ==========================================================
          # CHECK DOWNLOAD
          # ==========================================================

          echo ""
          echo "=== downloads/ ==="

          ls -lh downloads/ || true


          if [ -z "$(ls -A downloads 2>/dev/null)" ]; then

            echo "Download failed: downloads/ is empty"
            exit 1

          fi


          for f in downloads/*; do

            size=$(stat -c%s "$f" 2>/dev/null || echo 0)

            echo ""
            echo "Downloaded: $f"
            echo "Size: $size bytes"


            if [ "$size" -lt 200000 ]; then

              echo ""
              echo "Downloaded file looks too small."
              echo "It may be an error page instead of the video."


              file "$f" || true


              head -c 500 "$f" \
                2>/dev/null || true


              echo ""

              exit 1

            fi

          done


      # ============================================================
      # CREATE ZIP
      # ============================================================

      - name: Create ZIP
        if: steps.resolver.outcome == 'success' && github.event.inputs.upload_mode == 'zip'
        run: |

          ts=$(date +"%Y%m%d_%H%M%S")


          zip -r \
            -P "${{ secrets.ZIP_PASSWORD }}" \
            "dood_media_${ts}.zip" \
            downloads/


      # ============================================================
      # DELETE OLD RELEASES
      # ============================================================

      - name: Delete old releases
        if: steps.resolver.outcome == 'success' && github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          releases=$(gh release list --limit 100 | awk '{print $1}')


          for tag in $releases; do

            gh release delete "$tag" -y || true

          done


      # ============================================================
      # UPLOAD ZIP RELEASE
      # ============================================================

      - name: Upload ZIP Release
        if: steps.resolver.outcome == 'success' && github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dood-${{ github.run_number }}
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ============================================================
      # UPLOAD DIRECT VIDEO RELEASE
      # ============================================================

      - name: Upload Direct Video Release
        if: steps.resolver.outcome == 'success' && github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dood-${{ github.run_number }}
          files: "downloads/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
