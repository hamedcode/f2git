name: 8 - Doodstream Downloader

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "لینک صفحه ویدیو (doodstream / playmogo / dood.* / ...)"
        required: true

      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip curl aria2 jq
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: |
          mkdir -p downloads grabbed

      # ------------------------------------------------------------
      # Resolve Dood / Playmogo video
      #
      # IMPORTANT:
      # We deliberately do NOT visit /download/ anymore.
      #
      # The normal player page (/e/<id>) contains:
      #
      #   $.get('/pass_md5/<hash>/<token>', ...)
      #
      # and the pass_md5 endpoint returns the CDN base URL.
      #
      # This avoids the Cloudflare challenge currently affecting
      # /download/ on GitHub Actions.
      # ------------------------------------------------------------

      - name: Create resolver script
        run: |
          cat > dood_dl.js << 'EOF'

          const fs = require('fs');
          const crypto = require('crypto');
          const { chromium } = require('playwright');

          const SOURCE_URL = process.argv[2];

          if (!SOURCE_URL) {
            console.error('No source URL given');
            process.exit(1);
          }

          /*
           * Keep this close to a normal current Chrome UA.
           * Do not use navigator.webdriver spoofing here.
           */
          const UA =
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 ' +
            '(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36';

          const sleep = ms =>
            new Promise(resolve => setTimeout(resolve, ms));


          // ----------------------------------------------------------
          // Helpers
          // ----------------------------------------------------------

          function normalizeInput(urlString) {
            const u = new URL(urlString);

            /*
             * /d/<id> -> /e/<id>
             *
             * Dood/Playmogo player pages use /e/ while share pages
             * normally use /d/.
             */
            if (
              u.pathname.startsWith('/d/') ||
              u.pathname.startsWith('/f/')
            ) {
              u.pathname = u.pathname.replace(/^\/(d|f)\//, '/e/');
            }

            return u;
          }


          function randomString(length = 10) {
            const chars =
              'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

            let out = '';

            for (let i = 0; i < length; i++) {
              out += chars[Math.floor(Math.random() * chars.length)];
            }

            return out;
          }


          function looksLikeMedia(url) {
            return (
              /\.mp4(?:\?|$)/i.test(url) ||
              /\.m3u8(?:\?|$)/i.test(url)
            );
          }


          function looksLikeDoodCdn(url) {
            try {
              const u = new URL(url);

              return (
                /\.cloudatacdn\.com$/i.test(u.hostname) &&
                looksLikeMedia(url)
              );
            } catch {
              return false;
            }
          }


          function extractTitle(html) {
            const m = html.match(
              /<title[^>]*>([\s\S]*?)<\/title>/i
            );

            if (!m) return 'video';

            return m[1]
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/<[^>]+>/g, '')
              .trim() || 'video';
          }


          function extractPassMd5(html) {
            /*
             * Current Dood player pattern:
             *
             * $.get('/pass_md5/HASH/TOKEN', function(data) {
             *
             */

            const patterns = [
              /['"](?:https?:\/\/[^'"]+)?\/pass_md5\/([^'"]+)['"]/i,

              /['"]\/pass_md5\/([^'"]+)['"]/i,

              /\/pass_md5\/([A-Za-z0-9._~\-\/]+)[\s'"]/i
            ];

            for (const re of patterns) {
              const m = html.match(re);

              if (m && m[1]) {
                return m[1];
              }
            }

            return null;
          }


          function buildPassMd5Url(origin, passPath) {
            return new URL(
              '/pass_md5/' + passPath,
              origin
            ).toString();
          }


          function buildCandidateFromPassMd5(baseUrl, token) {
            /*
             * Classic Dood CDN mechanism:
             *
             * pass_md5 response + random 10 chars +
             * ?token=<token>&expiry=<timestamp>
             *
             * The actual browser network request is preferred if the
             * player generates a nicer/filename-based CDN URL.
             */

            const randomPart = randomString(10);

            return (
              baseUrl +
              randomPart +
              '?token=' +
              encodeURIComponent(token) +
              '&expiry=' +
              Date.now()
            );
          }


          function extractTokenFromPassPath(passPath) {
            const parts = passPath.split('/');

            return parts[parts.length - 1] || null;
          }


          function sanitizeTitle(title) {
            let s = title
              .replace(/[^a-zA-Z0-9 ._-]/g, '_')
              .replace(/[_ ]+/g, '_')
              .replace(/^_+|_+$/g, '')
              .trim();

            if (!s) s = 'video';

            return s.slice(0, 100);
          }


          async function fetchPassMd5(page, passUrl, playerUrl) {

            console.log('PASS_MD5 URL:', passUrl);

            const result = await page.evaluate(
              async ({ passUrl, playerUrl }) => {

                try {

                  const response = await fetch(passUrl, {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                      'X-Requested-With': 'XMLHttpRequest',
                      'Accept': '*/*'
                    },
                    referrer: playerUrl
                  });

                  const text = await response.text();

                  return {
                    status: response.status,
                    ok: response.ok,
                    text
                  };

                } catch (e) {

                  return {
                    status: 0,
                    ok: false,
                    text: '',
                    error: String(e)
                  };

                }

              },
              {
                passUrl,
                playerUrl
              }
            );

            console.log(
              'PASS_MD5 status:',
              result.status
            );

            if (!result.ok) {
              console.log(
                'PASS_MD5 error:',
                result.error || result.text.slice(0, 300)
              );

              return null;
            }

            const cdnBase = result.text.trim();

            if (
              !cdnBase.startsWith('http://') &&
              !cdnBase.startsWith('https://')
            ) {
              console.log(
                'PASS_MD5 returned unexpected data:',
                cdnBase.slice(0, 500)
              );

              return null;
            }

            console.log(
              'PASS_MD5 CDN base:',
              cdnBase
            );

            return cdnBase;
          }


          async function validateMediaUrl(url, referer) {

            console.log('Validating media URL...');

            try {

              const result = await fetch(url, {
                method: 'GET',

                headers: {
                  'User-Agent': UA,
                  'Referer': referer,
                  'Range': 'bytes=0-1023',
                  'Accept': '*/*'
                },

                redirect: 'follow'
              });

              console.log(
                'Media validation status:',
                result.status
              );

              const contentType =
                result.headers.get('content-type') || '';

              const contentLength =
                result.headers.get('content-length') || '';

              console.log(
                'Media content-type:',
                contentType
              );

              console.log(
                'Media content-length:',
                contentLength || '(not provided)'
              );

              /*
               * 206 is ideal for a range request.
               * 200 is also acceptable.
               */
              if (
                result.status === 200 ||
                result.status === 206
              ) {
                return true;
              }

              return false;

            } catch (e) {

              console.log(
                'Media validation failed:',
                e.message
              );

              return false;
            }
          }


          // ----------------------------------------------------------
          // Main
          // ----------------------------------------------------------

          (async () => {

            let browser = null;

            try {

              const playerUrlObj =
                normalizeInput(SOURCE_URL);

              const playerUrl =
                playerUrlObj.toString();

              const origin =
                playerUrlObj.origin;

              console.log('SOURCE URL:', SOURCE_URL);
              console.log('PLAYER URL:', playerUrl);


              browser = await chromium.launch({
                headless: true
              });


              /*
               * One persistent context is intentional.
               *
               * If Cloudflare gives us a normal clearance while
               * loading the player page, we keep the exact same
               * cookies/session for pass_md5.
               */
              const context =
                await browser.newContext({
                  userAgent: UA,
                  locale: 'en-US',
                  timezoneId: 'UTC',
                  viewport: {
                    width: 1366,
                    height: 768
                  }
                });


              /*
               * Do NOT spoof navigator.webdriver.
               *
               * The goal here is to use a normal browser session,
               * not to implement a Cloudflare bypass.
               */


              const page =
                await context.newPage();


              let networkMediaUrl = null;
              let passMd5Response = null;


              /*
               * Watch requests/responses generated by the real player.
               *
               * If the player itself creates the final CDN URL,
               * this is the best source because it gives us exactly
               * what the site generated.
               */

              page.on('request', request => {

                const url = request.url();

                if (
                  !networkMediaUrl &&
                  looksLikeDoodCdn(url)
                ) {

                  console.log(
                    'FOUND CDN MEDIA REQUEST:',
                    url
                  );

                  networkMediaUrl = url;
                }

              });


              page.on('response', async response => {

                const url = response.url();

                if (
                  !passMd5Response &&
                  /\/pass_md5\//i.test(url)
                ) {

                  try {

                    const text =
                      await response.text();

                    if (
                      response.ok() &&
                      /^https?:\/\//i.test(text.trim())
                    ) {

                      passMd5Response =
                        text.trim();

                      console.log(
                        'CAPTURED PASS_MD5 RESPONSE:',
                        passMd5Response
                      );
                    }

                  } catch {}
                }

              });


              console.log(
                '\nLoading player page...'
              );


              const response =
                await page.goto(
                  playerUrl,
                  {
                    waitUntil: 'domcontentloaded',
                    timeout: 60000
                  }
                );


              if (response) {

                console.log(
                  'Player page status:',
                  response.status()
                );

              }


              /*
               * Give the page enough time to execute the player
               * JavaScript and issue /pass_md5.
               *
               * We intentionally do NOT use networkidle because
               * these pages contain ads/analytics that can keep
               * the network busy indefinitely.
               */

              await page.waitForTimeout(5000);


              const html =
                await page.content();


              const title =
                extractTitle(html);


              console.log(
                'TITLE:',
                title
              );


              /*
               * First check whether the real player already produced
               * the final CDN URL.
               */

              if (networkMediaUrl) {

                console.log(
                  '\nUsing CDN URL captured from player.'
                );

              }


              /*
               * If the player request was not captured, extract the
               * pass_md5 endpoint directly from the player HTML.
               */

              let passPath =
                extractPassMd5(html);


              if (!passPath) {

                console.log(
                  'Could not find /pass_md5/ in player HTML.'
                );

              } else {

                console.log(
                  'PASS_MD5 path:',
                  passPath
                );

              }


              /*
               * Call pass_md5 ourselves if the browser did not
               * already do it.
               */

              let cdnBase =
                passMd5Response;


              if (
                !cdnBase &&
                passPath
              ) {

                const passUrl =
                  buildPassMd5Url(
                    origin,
                    passPath
                  );

                cdnBase =
                  await fetchPassMd5(
                    page,
                    passUrl,
                    playerUrl
                  );

              }


              /*
               * The player-generated network URL is preferred.
               *
               * If it wasn't observed, create the classic Dood
               * candidate from pass_md5.
               */

              let mediaUrl =
                networkMediaUrl;


              if (!mediaUrl && cdnBase) {

                const token =
                  extractTokenFromPassPath(
                    passPath || ''
                  );

                if (token) {

                  const candidate =
                    buildCandidateFromPassMd5(
                      cdnBase,
                      token
                    );

                  console.log(
                    '\nGenerated CDN candidate:',
                    candidate
                  );

                  /*
                   * Store it for the download step.
                   * We don't require HEAD here because some CDNs
                   * reject HEAD even though GET works.
                   */

                  mediaUrl = candidate;
                }
              }


              /*
               * Wait a little longer for the actual player request.
               *
               * This is especially useful if Turnstile/FingerprintJS
               * delays the player initialization.
               */

              if (!networkMediaUrl) {

                console.log(
                  '\nWaiting for player-generated CDN URL...'
                );

                for (
                  let i = 0;
                  i < 10 && !networkMediaUrl;
                  i++
                ) {

                  await sleep(1000);
                }

                if (networkMediaUrl) {
                  mediaUrl =
                    networkMediaUrl;
                }

              }


              if (!mediaUrl) {

                console.error(
                  '\nCould not obtain a CDN media URL.'
                );

                console.error(
                  'The player page may now require an additional human verification step.'
                );

                console.error(
                  'Player URL:',
                  playerUrl
                );

                /*
                 * Save a diagnostic snapshot to help with the next
                 * iteration without exposing cookies.
                 */

                try {
                  fs.writeFileSync(
                    'grabbed/player.html',
                    html
                  );
                } catch {}

                process.exit(1);
              }


              /*
               * The HAR shows that the CDN request uses the site
               * origin as Referer:
               *
               *     https://playmogo.com/
               *
               * not the /e/... URL.
               */

              const cdnReferer =
                origin + '/';


              console.log(
                '\nFINAL MEDIA URL:'
              );

              console.log(
                mediaUrl
              );

              console.log(
                'REFERER:',
                cdnReferer
              );


              /*
               * Lightweight validation.
               *
               * Do not fail merely because validation is unavailable;
               * the actual downloader below is the final authority.
               */

              await validateMediaUrl(
                mediaUrl,
                cdnReferer
              );


              fs.writeFileSync(
                'grabbed/result.json',
                JSON.stringify(
                  {
                    title,
                    url: mediaUrl,
                    referer: cdnReferer,
                    player_url: playerUrl
                  },
                  null,
                  2
                )
              );


              console.log(
                '\nSaved grabbed/result.json'
              );


              await context.close();

            } catch (e) {

              console.error(
                'Resolver error:',
                e.stack || e.message
              );

              process.exit(1);

            } finally {

              if (browser) {
                await browser.close()
                  .catch(() => {});
              }

            }

          })();

          EOF

      # ------------------------------------------------------------
      # Run resolver
      # ------------------------------------------------------------

      - name: Run resolver
        run: |
          node dood_dl.js "${{ github.event.inputs.source_url }}"

      # ------------------------------------------------------------
      # Download actual media
      # ------------------------------------------------------------

      - name: Download video
        run: |

          if [ ! -f grabbed/result.json ]; then
            echo "No result from resolver step"
            exit 1
          fi

          title=$(jq -r '.title' grabbed/result.json)
          url=$(jq -r '.url' grabbed/result.json)
          referer=$(jq -r '.referer' grabbed/result.json)

          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"

          safe_title=$(echo "$title" \
            | sed 's/[^a-zA-Z0-9 ._-]/_/g' \
            | sed 's/[_ ]\+/_/g' \
            | sed 's/^_//;s/_$//' \
            | cut -c1-80)

          [ -z "$safe_title" ] && safe_title="video"

          echo "TITLE:   $safe_title"
          echo "REFERER: $referer"

          clean_url=$(echo "$url" | cut -d'?' -f1)

          ext=$(echo "$clean_url" \
            | grep -oEi '\.(mp4|m3u8)' \
            | head -1 \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d '.')

          [ -z "$ext" ] && ext="mp4"


          # ----------------------------------------------------------
          # M3U8
          # ----------------------------------------------------------

          if [[ "$ext" == "m3u8" ]]; then

            echo "[FFMPEG] downloading m3u8"

            ffmpeg -y \
              -user_agent "$ua" \
              -headers "Referer: ${referer}\r\n" \
              -i "$url" \
              -c copy \
              "downloads/${safe_title}.mp4"

          else

            # --------------------------------------------------------
            # MP4
            #
            # aria2 is preferred because the video CDN generally
            # supports ranged downloads.
            # --------------------------------------------------------

            echo "[ARIA2] trying download..."

            set +e

            aria2c \
              -x 8 \
              -s 8 \
              -k 1M \
              -c \
              --summary-interval=5 \
              --console-log-level=warn \
              --user-agent="$ua" \
              --referer="$referer" \
              --header="Accept: */*" \
              --dir=downloads \
              --out="${safe_title}.mp4" \
              "$url"

            aria_status=$?

            set -e


            if [ "$aria_status" -ne 0 ]; then

              echo "[CURL FALLBACK] aria2 failed"

              curl -L \
                --fail \
                --retry 5 \
                --retry-all-errors \
                --connect-timeout 30 \
                -A "$ua" \
                -e "$referer" \
                -H "Accept: */*" \
                -o "downloads/${safe_title}.mp4" \
                "$url"

            fi

          fi


          echo ""
          echo "=== downloads/ ==="

          ls -lh downloads/ || true


          if [ -z "$(ls -A downloads 2>/dev/null)" ]; then
            echo "Download failed: downloads/ is empty"
            exit 1
          fi


          # ----------------------------------------------------------
          # Basic sanity check
          # ----------------------------------------------------------

          for f in downloads/*; do

            size=$(stat -c%s "$f" 2>/dev/null || echo 0)

            echo "Downloaded: $f"
            echo "Size: $size bytes"

            if [ "$size" -lt 200000 ]; then

              echo ""
              echo "Downloaded file looks too small."
              echo "It may be an error page instead of the video."

              file "$f" || true
              head -c 500 "$f" 2>/dev/null || true
              echo ""

              exit 1

            fi

          done


      # ------------------------------------------------------------
      # Create ZIP
      # ------------------------------------------------------------

      - name: Create ZIP
        if: github.event.inputs.upload_mode == 'zip'
        run: |
          ts=$(date +"%Y%m%d_%H%M%S")

          zip -r \
            -P "${{ secrets.ZIP_PASSWORD }}" \
            "dood_media_${ts}.zip" \
            downloads/


      # ------------------------------------------------------------
      # Delete old releases
      # ------------------------------------------------------------

      - name: Delete old releases
        if: github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          releases=$(gh release list --limit 100 | awk '{print $1}')

          for tag in $releases; do
            gh release delete "$tag" -y || true
          done


      # ------------------------------------------------------------
      # Upload ZIP Release
      # ------------------------------------------------------------

      - name: Upload ZIP Release
        if: github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dood-${{ github.run_number }}
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ------------------------------------------------------------
      # Upload Direct Video Release
      # ------------------------------------------------------------

      - name: Upload Direct Video Release
        if: github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dood-${{ github.run_number }}
          files: "downloads/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
