name: 8 - Doodstream Downloader

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "لینک صفحه ویدیو (doodstream / playmogo / dood.* / ...)"
        required: true

      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip curl aria2 jq gh
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: mkdir -p downloads grabbed

      - name: Create resolver script
        run: |
          cat > dood_dl.js << 'EOF'

          // Resolves a doodstream-family share/embed link (dood.*, playmogo,
          // ds2play, d0000d, ...) to a direct, downloadable CDN URL.
          //
          // No clicking, no ads: we replicate the two plain HTTP calls the
          // player's own JS makes on page load to fetch its video source
          // (the "pass_md5" handshake) -- so none of the ad scripts ever
          // fire. But a raw Node fetch() gets blocked with 403 by this
          // site's bot protection (it checks the real-browser network
          // fingerprint, not just headers), so we make BOTH requests
          // through an actual headless Chromium instance instead: one
          // single clean page load (no interaction) to get the HTML, then
          // the pass_md5 call through that same browser context so it
          // carries whatever cookies/fingerprint got it past the check the
          // first time.

          const fs = require('fs');
          const { chromium } = require('playwright');

          const SOURCE_URL = process.argv[2];
          if (!SOURCE_URL) {
            console.error('No source URL given');
            process.exit(1);
          }

          const UA =
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36';

          function toEmbedUrlObj(u) {
            const parsed = new URL(u);
            parsed.pathname = parsed.pathname.replace('/d/', '/e/').replace('/f/', '/e/');
            return parsed;
          }

          // "example.com" from "cdn.example.com" / "www.example.com" -- a
          // simple eTLD+1 approximation, good enough for telling "still the
          // same site" apart from "got redirected somewhere else entirely"
          function baseDomain(host) {
            const parts = host.split('.');
            return parts.slice(-2).join('.');
          }

          (async () => {

            const browser = await chromium.launch({ headless: true });

            let mediaUrl = null;
            let title = 'video';
            let usedEmbedUrl = null;

            const MAX_ATTEMPTS = 3;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            try {

              const embedUrlObj = toEmbedUrlObj(SOURCE_URL);
              const embedUrl = embedUrlObj.toString();
              const embedBaseDomain = baseDomain(embedUrlObj.host);
              usedEmbedUrl = embedUrl;

              console.log('EMBED URL:', embedUrl);

              for (let attempt = 1; attempt <= MAX_ATTEMPTS && !mediaUrl; attempt++) {

                console.log(`\n=== Attempt ${attempt}/${MAX_ATTEMPTS} (fresh session) ===`);

                const context = await browser.newContext({ userAgent: UA, locale: 'en-US' });

                // hide the most obvious automation flag -- Cloudflare
                // (and similar) explicitly check navigator.webdriver as a
                // bot signal. This only masks that one property; it does
                // NOT attempt to solve or click through any interactive
                // challenge.
                await context.addInitScript(() => {
                  Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
                });

                // Block full-page navigations AWAY from this site (the ad
                // redirects) at the network level -- same thing an ad
                // blocker like AdGuard/uBlock does. Only the TOP-level
                // frame is checked: an iframe on the page (like a
                // Cloudflare Turnstile verification widget, which is
                // legitimate and needed for the site to work, not an ad)
                // is left alone. A request to a different domain that
                // isn't a page navigation at all (e.g. fetching the video
                // itself from the CDN) is untouched either way.
                await context.route('**/*', (route) => {
                  const request = route.request();
                  if (request.isNavigationRequest() && request.frame() === page.mainFrame()) {
                    let reqHost = '';
                    try { reqHost = new URL(request.url()).host; } catch (e) {}
                    if (reqHost && baseDomain(reqHost) !== embedBaseDomain) {
                      console.log('Blocking cross-site navigation (ad redirect):', request.url());
                      return route.abort();
                    }
                  }
                  return route.continue();
                });

                // create the MAIN tab first...
                const page = await context.newPage();

                // ...and only THEN start watching for popups.
                // context.newPage() itself fires a 'page' event, so
                // registering this listener before creating the main page
                // makes the script close its own working tab by mistake.
                context.on('page', async (popup) => {
                  if (popup === page) return;
                  try {
                    console.log('POPUP opened, closing:', popup.url());
                    await popup.close();
                  } catch (e) {}
                });

                page.on('dialog', (dialog) => dialog.dismiss().catch(() => {}));
                page.on('close', () => console.log('Main tab was closed by the page.'));
                page.on('crash', () => console.log('Main tab crashed.'));

                // Capture the actual media URL the player itself requests.
                // It usually lives on a completely different domain (the
                // video CDN, e.g. cloudatacdn.com) than the doodstream
                // page itself, so we match by shape (looks like a video
                // file with a token), not by host.
                page.on('response', (response) => {
                  try {
                    const url = response.url();
                    const looksLikeDirectLink =
                      (url.includes('.mp4') || url.includes('.m3u8')) && url.includes('token=');
                    if (!mediaUrl && looksLikeDirectLink) {
                      console.log('FOUND:', url);
                      mediaUrl = url;
                    }
                  } catch (e) {}
                });

                try {
                  const resp = await page.goto(embedUrl, { waitUntil: 'networkidle', timeout: 60000 });
                  if (resp) console.log('Loaded, status:', resp.status());
                } catch (e) {
                  console.log('goto warning:', e.message);
                }

                // give a non-interactive anti-bot interstitial a chance to
                // clear on its own, same as a real browser tab sitting
                // there
                if (!page.isClosed()) {
                  const bodyText = await page.evaluate(() => document.body.innerText).catch(() => '');
                  if (/just a moment|checking your browser|attention required/i.test(bodyText)) {
                    console.log('Anti-bot interstitial detected, waiting for it to settle...');
                    await page.waitForTimeout(8000).catch(() => {});
                  }
                }

                // with ad redirects blocked, autoplay often fires the real
                // request on its own within a few seconds -- give it a
                // chance before trying anything else
                for (let i = 0; i < 10 && !mediaUrl && !page.isClosed(); i++) {
                  await page.waitForTimeout(1000).catch(() => {});
                }

                // if it's still gated behind a user gesture, try a play
                // click now -- safe to do since ad redirects are blocked
                // at the network level, so this can no longer hijack the
                // tab
                if (!mediaUrl && !page.isClosed()) {
                  console.log('No autoplay request yet, trying a play click...');
                  const playSelectors = [
                    'video',
                    '.jw-icon-display',
                    '.vjs-big-play-button',
                    '.plyr__control--overlaid',
                    'button.jw-icon-playback',
                    '#player',
                    '.jwplayer'
                  ];
                  for (const sel of playSelectors) {
                    if (mediaUrl || page.isClosed()) break;
                    try {
                      await page.click(sel, { timeout: 2000, force: true });
                      console.log(`  clicked "${sel}", now at:`, page.isClosed() ? '(tab closed)' : page.url());
                    } catch (e) {
                      console.log(`  click "${sel}" skipped:`, e.message.split('\n')[0]);
                    }
                    await page.waitForTimeout(1500).catch(() => {});
                  }
                  for (let i = 0; i < 8 && !mediaUrl && !page.isClosed(); i++) {
                    await page.waitForTimeout(1000).catch(() => {});
                  }
                }

                if (!page.isClosed()) {
                  try {
                    title = (await page.title()).trim() || title;
                  } catch (e) {
                    console.log('page.title() failed:', e.message);
                  }
                } else {
                  console.log('Skipping title read: tab is closed.');
                }
                console.log('TITLE:', title);

                if (!mediaUrl) {
                  let finalUrl = 'unknown (tab closed)';
                  if (!page.isClosed()) {
                    try { finalUrl = page.url(); } catch (e) {}
                  }
                  console.log(`Attempt ${attempt} failed. Ended up on:`, finalUrl);
                }

                await context.close().catch(() => {});

                if (!mediaUrl && attempt < MAX_ATTEMPTS) {
                  const delay = 2000 + Math.floor(Math.random() * 3000);
                  console.log(`Waiting ${Math.round(delay / 1000)}s before the next attempt...`);
                  await sleep(delay);
                }

              }

              if (!mediaUrl) {
                console.error(`Could not find a direct media link after ${MAX_ATTEMPTS} attempts.`);
                process.exit(1);
              }

              // sanity check it actually resolves before handing it to the
              // download step (a plain fetch is enough here, it's just a
              // HEAD request to a CDN, not the protected page)
              const headRes = await fetch(mediaUrl, {
                method: 'HEAD',
                headers: { 'User-Agent': UA, Referer: usedEmbedUrl }
              }).catch((e) => {
                console.log('HEAD validation request errored (continuing anyway):', e.message);
                return null;
              });

              if (headRes && !headRes.ok) {
                console.error('Media link did not validate, status:', headRes.status);
                process.exit(1);
              }

              if (headRes) {
                console.log('Validated OK, content-length:', headRes.headers.get('content-length'));
              }

              fs.writeFileSync(
                'grabbed/result.json',
                JSON.stringify({ title, url: mediaUrl, referer: usedEmbedUrl }, null, 2)
              );
              console.log('Saved grabbed/result.json');

            } catch (e) {
              console.error('Error:', e.message);
              process.exit(1);
            } finally {
              await browser.close().catch(() => {});
            }

          })();

          EOF

      - name: Run resolver
        run: node dood_dl.js "${{ github.event.inputs.source_url }}"

      - name: Download video
        run: |

          if [ ! -f grabbed/result.json ]; then
            echo "No result from resolver step"
            exit 1
          fi

          title=$(jq -r '.title' grabbed/result.json)
          url=$(jq -r '.url' grabbed/result.json)
          referer=$(jq -r '.referer' grabbed/result.json)
          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"

          safe_title=$(echo "$title" \
            | sed 's/[^a-zA-Z0-9 ._-]/_/g' \
            | sed 's/[_ ]\+/_/g' \
            | sed 's/^_//;s/_$//' \
            | cut -c1-80)

          [ -z "$safe_title" ] && safe_title="video"

          echo "TITLE:   $safe_title"
          echo "URL:     $url"
          echo "REFERER: $referer"

          clean_url=$(echo "$url" | cut -d'?' -f1)
          ext=$(echo "$clean_url" | grep -oE '\.(mp4|m3u8)' | head -1 | tr -d '.')

          # the CDN checks the Referer header (and sometimes user-agent), so
          # every downloader needs to send the same ones the resolver used

          if [[ "$ext" == "m3u8" ]]; then

            echo "[FFMPEG] downloading m3u8"
            ffmpeg -y \
              -user_agent "$ua" \
              -headers "Referer: ${referer}\r\n" \
              -i "$url" -c copy "downloads/${safe_title}.mp4"

          else

            echo "[ARIA2] trying download..."
            aria2c \
              -x 16 -s 16 -k 1M -c \
              --summary-interval=5 \
              --console-log-level=warn \
              --user-agent="$ua" \
              --referer="$referer" \
              --dir=downloads \
              --out="${safe_title}.${ext:-mp4}" \
              "$url"

            if [ $? -ne 0 ]; then
              echo "[CURL FALLBACK] aria2 failed"
              curl -L --retry 5 --connect-timeout 30 \
                -A "$ua" \
                -e "$referer" \
                -o "downloads/${safe_title}.${ext:-mp4}" \
                "$url"
            fi

          fi

          echo ""
          echo "=== downloads/ ==="
          ls -lh downloads/ || true

          if [ -z "$(ls -A downloads 2>/dev/null)" ]; then
            echo "Download failed: downloads/ is empty"
            exit 1
          fi

          # doodstream CDN returns a small HTML error page (not the real
          # video) if the token/referer didn't validate -- a real clip is
          # essentially never under ~200KB, so treat anything that small as
          # a failed download
          for f in downloads/*; do
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$size" -lt 200000 ]; then
              echo "Downloaded file looks too small ($size bytes) -- likely an error page, not the video:"
              head -c 300 "$f"; echo
              exit 1
            fi
          done

      - name: Create ZIP
        if: github.event.inputs.upload_mode == 'zip'
        run: |
          ts=$(date +"%Y%m%d_%H%M%S")
          zip -r -P "${{ secrets.ZIP_PASSWORD }}" "dood_media_${ts}.zip" downloads/

      - name: Delete old releases
        if: github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --limit 100 | awk '{print $1}')
          for tag in $releases; do
            gh release delete "$tag" -y || true
          done

      - name: Upload ZIP Release
        if: github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dood-${{ github.run_number }}
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Direct Video Release
        if: github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dood-${{ github.run_number }}
          files: "downloads/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
