name: 8 - Doodstream Downloader

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "لینک صفحه ویدیو (doodstream / playmogo / dood.* / ...)"
        required: true

      upload_mode:
        description: "Upload mode"
        required: true
        default: "direct"
        type: choice
        options:
          - "direct"
          - "zip"

      delete_old_releases:
        description: "Delete old releases?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip curl aria2 jq gh
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Prepare folders
        run: mkdir -p downloads grabbed

      - name: Create resolver script
        run: |
          cat > dood_dl.js << 'EOF'

          // Resolves a doodstream-family share/embed link (dood.*, playmogo,
          // ds2play, d0000d, ...) to a direct, downloadable CDN URL.
          //
          // Key discovery (thanks to manual View Source on the /d/ page):
          // the "Download Now" button + 5-second countdown is pure UI
          // theater. The real /download/<hash>/o/<token> link is ALREADY
          // sitting in the page's static HTML from the very first load,
          // just CSS-hidden -- no click, no wait, no JS execution needed
          // to reveal it. So:
          //   1) load the /d/<id> "share" page, pull the /download/... href
          //      straight out of the HTML
          //   2) visit that /download/... page and see what it hands back
          //      -- either it redirects/serves the actual CDN link
          //      directly, or it's another reveal-a-link page
          // A raw Node fetch() gets 403'd by this site's bot protection
          // (browser-fingerprint check, not just headers), so both loads
          // go through an actual headless Chromium instance.

          const fs = require('fs');
          const { chromium } = require('playwright');

          const SOURCE_URL = process.argv[2];
          if (!SOURCE_URL) {
            console.error('No source URL given');
            process.exit(1);
          }

          const UA =
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36';

          // normalize to the /d/<id> "share" page -- the one whose static
          // HTML already contains the real download link
          function toShareUrlObj(u) {
            const parsed = new URL(u);
            parsed.pathname = parsed.pathname.replace('/e/', '/d/').replace('/f/', '/d/');
            return parsed;
          }

          // "example.com" from "cdn.example.com" / "www.example.com" -- a
          // simple eTLD+1 approximation, good enough for telling "still the
          // same site" apart from "got redirected somewhere else entirely"
          function baseDomain(host) {
            const parts = host.split('.');
            return parts.slice(-2).join('.');
          }

          function looksLikeMediaLink(url) {
            return (url.includes('.mp4') || url.includes('.m3u8')) && url.includes('token=');
          }

          (async () => {

            const browser = await chromium.launch({ headless: true });

            let mediaUrl = null;
            let title = 'video';
            let lastPageUrl = null;

            const MAX_ATTEMPTS = 3;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            try {

              const shareUrlObj = toShareUrlObj(SOURCE_URL);
              const shareUrl = shareUrlObj.toString();
              const origin = shareUrlObj.origin;
              const siteBaseDomain = baseDomain(shareUrlObj.host);
              lastPageUrl = shareUrl;

              console.log('SHARE URL:', shareUrl);

              for (let attempt = 1; attempt <= MAX_ATTEMPTS && !mediaUrl; attempt++) {

                console.log(`\n=== Attempt ${attempt}/${MAX_ATTEMPTS} (fresh session) ===`);

                const context = await browser.newContext({ userAgent: UA, locale: 'en-US' });

                // hide the most obvious automation flag -- Cloudflare (and
                // similar) explicitly check navigator.webdriver as a bot
                // signal. This only masks that one property; it does NOT
                // attempt to solve or click through any interactive
                // challenge.
                await context.addInitScript(() => {
                  Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
                });

                // Block full-page navigations AWAY from this site (the ad
                // redirects) at the network level -- same thing an ad
                // blocker like AdGuard/uBlock does. Exceptions: only the
                // TOP frame is checked (an iframe, e.g. a Cloudflare
                // Turnstile widget, is left alone -- it's legitimate, not
                // an ad); and a navigation that already looks like the
                // final media link is let through even if it's on another
                // domain, in case this mirror delivers it via a real
                // browser redirect straight to the CDN.
                await context.route('**/*', (route) => {
                  const request = route.request();
                  if (request.isNavigationRequest() && request.frame() === page.mainFrame()) {
                    const url = request.url();
                    let reqHost = '';
                    try { reqHost = new URL(url).host; } catch (e) {}
                    if (reqHost && baseDomain(reqHost) !== siteBaseDomain && !looksLikeMediaLink(url)) {
                      console.log('Blocking cross-site navigation (ad redirect):', url);
                      return route.abort();
                    }
                  }
                  return route.continue();
                });

                // create the MAIN tab first...
                const page = await context.newPage();

                // ...and only THEN start watching for popups.
                // context.newPage() itself fires a 'page' event, so
                // registering this listener before creating the main page
                // makes the script close its own working tab by mistake.
                context.on('page', async (popup) => {
                  if (popup === page) return;
                  try {
                    console.log('POPUP opened, closing:', popup.url());
                    await popup.close();
                  } catch (e) {}
                });

                page.on('dialog', (dialog) => dialog.dismiss().catch(() => {}));

                // Capture the actual media URL if it ever shows up as a
                // network response, regardless of which step triggers it.
                // It usually lives on a completely different domain (the
                // video CDN, e.g. cloudatacdn.com), so we match by shape,
                // not by host.
                page.on('response', (response) => {
                  try {
                    const url = response.url();
                    if (!mediaUrl && looksLikeMediaLink(url)) {
                      console.log('FOUND (network):', url);
                      mediaUrl = url;
                    }
                  } catch (e) {}
                });

                async function waitOutInterstitial() {
                  if (page.isClosed()) return;
                  const bodyText = await page.evaluate(() => document.body.innerText).catch(() => '');
                  if (/just a moment|checking your browser|attention required/i.test(bodyText)) {
                    console.log('Anti-bot interstitial detected, waiting for it to settle...');
                    await page.waitForTimeout(8000).catch(() => {});
                  }
                }

                // ---- Stage 1: the /d/ share page -----------------------

                try {
                  const resp = await page.goto(shareUrl, { waitUntil: 'networkidle', timeout: 60000 });
                  if (resp) console.log('Loaded share page, status:', resp.status());
                } catch (e) {
                  console.log('goto (share page) warning:', e.message);
                }

                await waitOutInterstitial();

                if (!page.isClosed()) {
                  try { title = (await page.title()).trim() || title; } catch (e) {}
                }
                console.log('TITLE:', title);

                let downloadPageUrl = null;

                if (!mediaUrl && !page.isClosed()) {
                  const html = await page.content().catch(() => '');

                  // the real download link is plain, static HTML -- no
                  // click or wait needed to reveal it
                  const hrefMatch = html.match(/href="(\/download\/[^"]+)"/i);

                  if (hrefMatch) {
                    downloadPageUrl = origin + hrefMatch[1];
                    console.log('DOWNLOAD LINK (from share page HTML):', downloadPageUrl);
                  } else {
                    // also check directly in case the share page itself
                    // already embeds the final CDN link somewhere
                    const directMatch = html.match(/https?:\/\/[^\s"'<>]+\.(?:mp4|m3u8)\?[^\s"'<>]*token=[^\s"'<>]*/i);
                    if (directMatch) {
                      console.log('FOUND (share page HTML):', directMatch[0]);
                      mediaUrl = directMatch[0];
                    } else {
                      console.log('No /download/ link found in the share page HTML.');
                    }
                  }
                }

                // ---- Stage 2: the /download/ page -----------------------

                if (!mediaUrl && downloadPageUrl && !page.isClosed()) {

                  lastPageUrl = downloadPageUrl;

                  try {
                    const resp2 = await page.goto(downloadPageUrl, {
                      waitUntil: 'networkidle',
                      timeout: 60000,
                      referer: shareUrl
                    });
                    if (resp2) console.log('Loaded download page, status:', resp2.status());
                  } catch (e) {
                    console.log('goto (download page) warning:', e.message);
                  }

                  await waitOutInterstitial();

                  // give it a few seconds in case it auto-redirects/fires
                  // the real request on its own
                  for (let i = 0; i < 8 && !mediaUrl && !page.isClosed(); i++) {
                    await page.waitForTimeout(1000).catch(() => {});
                  }

                  if (!mediaUrl && !page.isClosed()) {
                    const html2 = await page.content().catch(() => '');

                    const directMatch2 = html2.match(/https?:\/\/[^\s"'<>]+\.(?:mp4|m3u8)\?[^\s"'<>]*token=[^\s"'<>]*/i);
                    if (directMatch2) {
                      console.log('FOUND (download page HTML):', directMatch2[0]);
                      mediaUrl = directMatch2[0];
                    } else if (/captcha|recaptcha|hcaptcha|turnstile/i.test(html2)) {
                      console.log('This step appears to require solving a CAPTCHA/human-check -- cannot automate past that.');
                    } else {
                      // last resort: click an obvious "download" button/link
                      console.log('Trying a click on a download button as last resort...');
                      try {
                        await page.click('a:has-text("Download"), .btn:has-text("Download"), a[href*="download"]', { timeout: 3000, force: true });
                      } catch (e) {
                        console.log('  download click skipped:', e.message.split('\n')[0]);
                      }
                      for (let i = 0; i < 5 && !mediaUrl && !page.isClosed(); i++) {
                        await page.waitForTimeout(1000).catch(() => {});
                      }
                    }
                  }
                }

                if (!mediaUrl) {
                  let finalUrl = 'unknown (tab closed)';
                  if (!page.isClosed()) {
                    try { finalUrl = page.url(); } catch (e) {}
                  }
                  console.log(`Attempt ${attempt} failed. Ended up on:`, finalUrl);
                }

                await context.close().catch(() => {});

                if (!mediaUrl && attempt < MAX_ATTEMPTS) {
                  const delay = 2000 + Math.floor(Math.random() * 3000);
                  console.log(`Waiting ${Math.round(delay / 1000)}s before the next attempt...`);
                  await sleep(delay);
                }

              }

              if (!mediaUrl) {
                console.error(`Could not find a direct media link after ${MAX_ATTEMPTS} attempts.`);
                process.exit(1);
              }

              // sanity check it actually resolves before handing it to the
              // download step (a plain fetch is enough here, it's just a
              // HEAD request to a CDN, not the protected page)
              const headRes = await fetch(mediaUrl, {
                method: 'HEAD',
                headers: { 'User-Agent': UA, Referer: lastPageUrl }
              }).catch((e) => {
                console.log('HEAD validation request errored (continuing anyway):', e.message);
                return null;
              });

              if (headRes && !headRes.ok) {
                console.error('Media link did not validate, status:', headRes.status);
                process.exit(1);
              }

              if (headRes) {
                console.log('Validated OK, content-length:', headRes.headers.get('content-length'));
              }

              fs.writeFileSync(
                'grabbed/result.json',
                JSON.stringify({ title, url: mediaUrl, referer: lastPageUrl }, null, 2)
              );
              console.log('Saved grabbed/result.json');

            } catch (e) {
              console.error('Error:', e.message);
              process.exit(1);
            } finally {
              await browser.close().catch(() => {});
            }

          })();

          EOF

      - name: Run resolver
        run: node dood_dl.js "${{ github.event.inputs.source_url }}"

      - name: Download video
        run: |

          if [ ! -f grabbed/result.json ]; then
            echo "No result from resolver step"
            exit 1
          fi

          title=$(jq -r '.title' grabbed/result.json)
          url=$(jq -r '.url' grabbed/result.json)
          referer=$(jq -r '.referer' grabbed/result.json)
          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"

          safe_title=$(echo "$title" \
            | sed 's/[^a-zA-Z0-9 ._-]/_/g' \
            | sed 's/[_ ]\+/_/g' \
            | sed 's/^_//;s/_$//' \
            | cut -c1-80)

          [ -z "$safe_title" ] && safe_title="video"

          echo "TITLE:   $safe_title"
          echo "URL:     $url"
          echo "REFERER: $referer"

          clean_url=$(echo "$url" | cut -d'?' -f1)
          ext=$(echo "$clean_url" | grep -oE '\.(mp4|m3u8)' | head -1 | tr -d '.')

          # the CDN checks the Referer header (and sometimes user-agent), so
          # every downloader needs to send the same ones the resolver used

          if [[ "$ext" == "m3u8" ]]; then

            echo "[FFMPEG] downloading m3u8"
            ffmpeg -y \
              -user_agent "$ua" \
              -headers "Referer: ${referer}\r\n" \
              -i "$url" -c copy "downloads/${safe_title}.mp4"

          else

            echo "[ARIA2] trying download..."
            aria2c \
              -x 16 -s 16 -k 1M -c \
              --summary-interval=5 \
              --console-log-level=warn \
              --user-agent="$ua" \
              --referer="$referer" \
              --dir=downloads \
              --out="${safe_title}.${ext:-mp4}" \
              "$url"

            if [ $? -ne 0 ]; then
              echo "[CURL FALLBACK] aria2 failed"
              curl -L --retry 5 --connect-timeout 30 \
                -A "$ua" \
                -e "$referer" \
                -o "downloads/${safe_title}.${ext:-mp4}" \
                "$url"
            fi

          fi

          echo ""
          echo "=== downloads/ ==="
          ls -lh downloads/ || true

          if [ -z "$(ls -A downloads 2>/dev/null)" ]; then
            echo "Download failed: downloads/ is empty"
            exit 1
          fi

          # doodstream CDN returns a small HTML error page (not the real
          # video) if the token/referer didn't validate -- a real clip is
          # essentially never under ~200KB, so treat anything that small as
          # a failed download
          for f in downloads/*; do
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$size" -lt 200000 ]; then
              echo "Downloaded file looks too small ($size bytes) -- likely an error page, not the video:"
              head -c 300 "$f"; echo
              exit 1
            fi
          done

      - name: Create ZIP
        if: github.event.inputs.upload_mode == 'zip'
        run: |
          ts=$(date +"%Y%m%d_%H%M%S")
          zip -r -P "${{ secrets.ZIP_PASSWORD }}" "dood_media_${ts}.zip" downloads/

      - name: Delete old releases
        if: github.event.inputs.delete_old_releases == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --limit 100 | awk '{print $1}')
          for tag in $releases; do
            gh release delete "$tag" -y || true
          done

      - name: Upload ZIP Release
        if: github.event.inputs.upload_mode == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dood-${{ github.run_number }}
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Direct Video Release
        if: github.event.inputs.upload_mode == 'direct'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dood-${{ github.run_number }}
          files: "downloads/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
